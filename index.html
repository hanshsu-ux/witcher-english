<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>巫師3英文圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --bg2:#16171a; --panel:#1b1c20; --panel2:#222328; --line:#34353b; --line2:#47484f;
  --ink:#ece6d8; --muted:#9d988d; --faint:#6e6a62;
  --gold:#caa65e; --gold-soft:#3a3122; --blood:#b4493a; --blood-soft:#3a1f1b; --moss:#8fae7c; --steel:#8fb3cc;
  --title:"Almendra","Palatino Linotype","Book Antiqua",Georgia,serif;
  --serif:"Gentium Book Plus","Charis SIL","Doulos SIL",Georgia,"Times New Roman","Lucida Grande","Arial Unicode MS","Noto Serif","DejaVu Serif",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  background:radial-gradient(1200px 500px at 50% -120px,#26272c 0%,rgba(17,18,20,0) 70%),var(--bg);
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header + nav */
header{position:sticky;top:0;z-index:20;background:rgba(17,18,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--title);font-size:24px;letter-spacing:.02em;margin:0;flex:1 1 auto;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;font-size:15px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
nav{display:flex;gap:10px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;font-family:var(--title);font-size:18px;letter-spacing:.03em;line-height:1.1}
.nb small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:0;margin-top:2px;text-align:left}
.nb .chev{width:12px;height:12px;opacity:.7;transition:transform .15s}
.nb[aria-expanded="true"]{border-color:var(--gold);background:var(--panel2)}
.nb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nb.cur{border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--gold)}
.drop{display:none;border-top:1px solid var(--line);background:var(--bg2);padding:12px 0 14px}
.drop.open{display:block}
.drop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sb{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.sb:hover,.sb.cur{border-color:var(--gold)}
.sb .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* page */
main{padding:18px 0 60px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 4px}
h2.title{font-family:var(--title);font-size:30px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px;min-height:88px}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card .w{font-family:var(--serif);font-size:21px;line-height:1.2;display:block;padding-right:22px}
.card .k{font-family:var(--serif);color:var(--muted);font-size:14px;display:block}
.card .z{font-size:14px;display:block;margin-top:2px}
.card .t{position:absolute;right:10px;top:10px;font-size:11px;color:var(--faint)}
.card.game .w{color:#cfc6b0}
.card .done{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--moss)}
.card .spo{position:absolute;right:10px;top:10px;font-size:11px;color:var(--blood)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* practice stage (drawer) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.veil.open{display:block}
.stage{position:fixed;z-index:31;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:92vh;overflow:auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transition:transform .22s ease;text-align:center}
.stage.open{transform:translate(-50%,0)}
.stage .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;color:var(--muted);line-height:1;padding:6px}
.stage .pos{font-size:12px;color:var(--muted)}
.stage .where{font-size:12px;color:var(--faint)}
.bigword{font-family:var(--serif);font-size:clamp(40px,11vw,74px);line-height:1.15;margin:14px 0 6px;display:flex;justify-content:center;flex-wrap:wrap}
.syl{position:relative;padding:0 .04em;color:var(--muted);transition:color .15s}
.syl + .syl::before{content:"·";color:var(--line2);padding:0 .06em;font-weight:400}
.syl.stress{color:var(--ink);font-weight:700}
.syl.stress::after{content:"";position:absolute;left:50%;top:-.02em;width:.15em;height:.15em;margin-left:-.075em;border-radius:50%;background:var(--gold)}
.syl.beat{color:var(--steel)}
.syl.stress.beat{color:var(--gold)}
.phon{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--serif);font-size:21px}
.phon small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-right:6px;vertical-align:middle}
.mean{margin-top:4px;font-size:18px}
.mean .pt{color:var(--muted);font-size:14px;margin-right:6px}
.tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tip{margin:12px auto 0;max-width:32em;background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:15px;text-align:left}
.ex{margin:14px auto 0;max-width:32em;font-family:var(--serif);font-size:20px}
.ex .zh{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.note{margin:10px auto 0;max-width:32em;font-size:14px;color:var(--muted);text-align:left}
.spoiler{position:relative;cursor:pointer}
.spoiler.hid > *{filter:blur(7px);user-select:none}
.spoiler.hid::after{content:"⚠ 劇透內容・點一下顯示";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:13px;color:var(--ink);background:rgba(58,31,27,.55);border:1px dashed var(--blood);border-radius:6px}
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:9px 16px;font-size:15px;min-height:44px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#16130c;font-weight:700}
.btn[aria-pressed="true"]{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.ok[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#101410}
.status{min-height:1.5em;margin-top:8px;font-size:14px;color:var(--steel)}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.cam{font-size:12px;color:var(--muted);margin-top:10px}
.cam a{color:var(--steel)}
.ctl{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:3px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--steel);color:#0e1418}
input[type=range]{accent-color:var(--gold);width:100px}

/* other views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.panel h3{font-family:var(--title);font-size:20px;margin:0 0 6px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--serif);font-size:16px}
.wchip:hover{border-color:var(--gold)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-bottom:10px;font-size:14px}
.big{font-family:var(--title);font-size:40px;line-height:1;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.sent{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;font-family:var(--serif);font-size:19px;line-height:1.5}
.sent small{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.sent.on{border-left-color:var(--gold);background:var(--gold-soft)}
.pat{padding:10px 0;border-bottom:1px solid var(--line)}
.pat b{font-family:var(--serif);font-size:18px}
.pat .d{font-size:14px;color:var(--muted)}
.pat button{margin-top:4px;background:none;border:0;padding:4px 0;text-align:left;font-family:var(--serif);font-size:17px;color:var(--steel)}
.lsn{display:block;width:100%;text-align:left}
.warn{display:none;background:var(--blood-soft);border:1px solid var(--blood);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px}
footer{color:var(--faint);font-size:12px;text-align:center;padding:20px 0 40px}
@media (max-width:560px){
  .brand{font-size:20px}
  .nb{font-size:16px;padding:7px 11px}
  h2.title{font-size:25px}
  .cards{grid-template-columns:1fr 1fr}
  .card .w{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.stage,.syl,.nb .chev{transition:none}}
</style>
</head>

</section>

l spirit lives in an old tree.","example_zh":"一個邪惡的靈住在一棵老樹裡。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["taiwan"],"spoiler":false,"note":"威倫「低語山丘」（Whispering Hillock）的樹裡困著一個靈，你的選擇會影響後續發展。","lesson":null,"added":"2026-09-27"},{"word":"flower","kk":"[ˋflaʊɚ]","ipa":"/ˈflaʊ.ɚ/","syllables":["flow","er"],"stress_index":0,"tip":"flow 在這裡念 [flaʊ]（像 how），不是 flow [flo]；和 flour（麵粉）同音","pos":"n.","zh":"花","example_en":"Pick this flower for your potion.","example_zh":"摘這朵花來做藥水。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["homophone"],"spoiler":false,"note":"很多煉金材料是花，例如白香桃木（White Myrtle），路邊看到就採。","lesson":null,"added":"2026-09-27"},{"word":"grass","kk":"[græs]","ipa":"/ɡræs/","syllables":["grass"],"stress_index":0,"tip":"a 念 [æ]，嘴巴張大像 cat；結尾是清音 s，不要加「ㄙ」尾音","pos":"n.","zh":"草","example_en":"Roach eats grass by the road.","example_zh":"蘿蔔在路邊吃草。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["vowel","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-09-27"},{"word":"rock","kk":"[rɑk]","ipa":"/rɑːk/","syllables":["rock"],"stress_index":0,"tip":"r 開頭要先嘟嘴捲舌，不是 l（lock 是鎖）；o 念 [ɑ]，嘴巴張大","pos":"n.","zh":"岩石","example_en":"A rock troll blocks the bridge.","example_zh":"一隻岩石巨魔擋住了橋。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["r","vowel"],"spoiler":false,"note":"巨魔（troll）有好幾種，有些可以溝通，不一定要開打。","lesson":null,"added":"2026-09-27"},{"word":"river","kk":"[ˋrɪvɚ]","ipa":"/ˈrɪv.ɚ/","syllables":["riv","er"],"stress_index":0,"tip":"i 是短音 [ɪ]，不是「瑞」；v 要上齒咬下唇，不是 w 或 b","pos":"n.","zh":"河","example_en":"Novigrad lies on the Pontar River.","example_zh":"諾維格瑞位在龐塔爾河畔。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["vowel","taiwan"],"spoiler":false,"note":"河邊常有溺屍鬼（drowner），用伊格尼之印（Igni）或屍食者油（Necrophage oil）比較好打。","lesson":null,"added":"2026-09-27"},{"word":"sea","kk":"[si]","ipa":"/siː/","syllables":["sea"],"stress_index":0,"tip":"s 舌尖抵下齒，不要念成 she [ʃi]；和 see 同音","pos":"n.","zh":"海","example_en":"Skellige is far out at sea.","example_zh":"史凱利傑遠在海上。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["homophone"],"spoiler":false,"note":"在史凱利傑開船會被海妖（siren）攻擊，用十字弓射下來再砍。","lesson":null,"added":"2026-09-27"},{"word":"wave","kk":"[wev]","ipa":"/weɪv/","syllables":["wave"],"stress_index":0,"tip":"a 念雙母音 [e]（ㄟ），結尾 ve 要咬唇發 [v]，不是「威」就停","pos":"n.","zh":"海浪","example_en":"Big waves hit our small boat.","example_zh":"大浪打在我們的小船上。","type":"實用","cefr":"A2","cat":"world","sub":"nature","traps":["final","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-09-27"},{"word":"sky","kk":"[skaɪ]","ipa":"/skaɪ/","syllables":["sky"],"stress_index":0,"tip":"s 後面的 k 不送氣，聽起來像 [sgaɪ]；不要在 s 後加「ㄙ」母音","pos":"n.","zh":"天空","example_en":"The Wild Hunt rides across the sky.","example_zh":"狂獵騎馬穿越天空。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-09-27"},{"word":"star","kk":"[stɑr]","ipa":"/stɑːr/","syllables":["star"],"stress_index":0,"tip":"s 後的 t 不送氣，像 [sdɑr]；ar 要捲舌，美式不是「斯答」","pos":"n.","zh":"星星","example_en":"We can see the stars tonight.","example_zh":"今晚我們看得到星星。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["r","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-09-27"},{"word":"moon","kk":"[mun]","ipa":"/muːn/","syllables":["moon"],"stress_index":0,"tip":"oo 長音 [u]，嘴巴嘟圓拉長；結尾是 n 不是 ng，舌尖要頂上齒齦","pos":"n.","zh":"月亮","example_en":"Werewolves change under the full moon.","example_zh":"狼人在滿月下變身。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["vowel"],"spoiler":false,"note":"對付狼人用月塵炸彈（Moon Dust），能阻止它再生。","lesson":null,"added":"2026-09-27"},{"word":"sun","kk":"[sʌn]","ipa":"/sʌn/","syllables":["sun"],"stress_index":0,"tip":"u 念短促的 [ʌ]，不是「三」[san]；和 son（兒子）同音","pos":"n.","zh":"太陽","example_en":"The sun is hot at noon.","example_zh":"中午的太陽很熱。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["homophone","taiwan"],"spoiler":false,"note":"午時鬼（noonwraith）只在正午陽光下出現。","lesson":null,"added":"2026-09-27"},{"word":"sunrise","kk":"[ˋsʌnˌraɪz]","ipa":"/ˈsʌn.raɪz/","syllables":["sun","rise"],"stress_index":0,"tip":"重音在 SUN；rise 結尾 s 念濁音 [z]，不是 rice [s]（米）","pos":"n.","zh":"日出","example_en":"We ride out at sunrise.","example_zh":"我們日出時出發。","type":"實用","cefr":"A2","cat":"world","sub":"nature","traps":["stress"],"spoiler":false,"note":"冥想可以選擇等到哪個時間，例如等到日出。","lesson":null,"added":"2026-09-27"},{"word":"sunset","kk":"[ˋsʌnˌsɛt]","ipa":"/ˈsʌn.set/","syllables":["sun","set"],"stress_index":0,"tip":"重音在 SUN；兩個 s 都是清音；set 的 e 是 [ɛ]，結尾 t 輕輕收住","pos":"n.","zh":"日落","example_en":"The inn gets busy after sunset.","example_zh":"日落後旅店就熱鬧起來。","type":"實用","cefr":"A2","cat":"world","sub":"nature","traps":["stress"],"spoiler":false,"note":"夜魂（nightwraith）只在夜晚出現。","lesson":null,"added":"2026-09-27"},{"word":"snow","kk":"[sno]","ipa":"/snoʊ/","syllables":["snow"],"stress_index":0,"tip":"ow 在這裡念 [o]，不是 now 的 [aʊ]；s 和 n 之間不要加母音","pos":"n.","zh":"雪","example_en":"Snow covers the mountains of Skellige.","example_zh":"雪覆蓋著史凱利傑的群山。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["vowel"],"spoiler":false,"note":"","lesson":null,"added":"2026-09-27"},{"word":"ice","kk":"[aɪs]","ipa":"/aɪs/","syllables":["ice"],"stress_index":0,"tip":"結尾是清音 [s]，不要念成 eyes [aɪz]；e 不發音","pos":"n.","zh":"冰","example_en":"The Ice Giant lives on Undvik.","example_zh":"冰巨人住在恩德維克島。","type":"實用","cefr":"A1","cat":"world","sub":"nature","traps":["silent"],"spoiler":false,"note":"冰巨人（Ice Giant）是史凱利傑恩德維克島的頭目，重點是閃避它的大錨攻擊。","lesson":null,"added":"2026-09-27"}],"lessons":[{"n":1,"title":"第 1 課　新手指南","added":"2026-09-26","story":[{"en":"Welcome to The Witcher 3!","zh":"歡迎來到巫師3！"},{"en":"You are Geralt, a monster hunter.","zh":"你是傑洛特，一名怪物獵人。"},{"en":"Here are some easy tips for new players.","zh":"這裡是給新手的幾個簡單技巧。"},{"en":"In a fight, dodge more and roll less.","zh":"戰鬥時，多閃避，少翻滾。"},{"en":"A dodge is fast, so you can attack again quickly.","zh":"閃避很快，所以你能很快再次攻擊。"},{"en":"Use your Signs.","zh":"記得使用法印。"},{"en":"Quen gives you a shield, and Igni makes fire.","zh":"昆恩給你護盾，伊格尼能放火。"},{"en":"Fire does a lot of damage to beasts.","zh":"火對野獸造成很多傷害。"},{"en":"Every monster has a weakness.","zh":"每種怪物都有弱點。"},{"en":"Before you fight, read the bestiary and prepare the right oil.","zh":"戰鬥前，先讀怪物圖鑑，準備對的劍油。"},{"en":"Explore the world and pick up ingredients.","zh":"探索世界、撿拾材料。"},{"en":"You need them to make potions.","zh":"做藥水需要它們。"},{"en":"Side quests give good rewards, so don't only play the main quest.","zh":"支線任務的獎勵很好，所以別只玩主線。"}],"patterns":[{"pattern":"Use + A + against + B","usage":"對 B 使用 A（攻略最常見的祈使句）","example_en":"Use Igni against beasts.","example_zh":"對野獸使用伊格尼法印。"},{"pattern":"It's better to + V","usage":"最好做某事；做…比較好","example_en":"It's better to dodge than to roll.","example_zh":"閃避比翻滾好。"},{"pattern":"Before + 句子/名詞, + 祈使句","usage":"在…之前，先做…","example_en":"Before you fight, read the bestiary.","example_zh":"戰鬥之前，先讀怪物圖鑑。"}],"words":["dodge","roll","enemy","attack","damage","shield","weakness","prepare","explore","ingredient","reward","Sign","bestiary"]},{"n":2,"title":"第 2 課　主要角色","added":"2026-09-26","story":[{"en":"Let's meet the main characters.","zh":"來認識主要角色吧。"},{"en":"Geralt of Rivia is a witcher.","zh":"利維亞的傑洛特是一名獵魔士。"},{"en":"He kills monsters for money.","zh":"他靠獵殺怪物賺錢。"},{"en":"Ciri is Geralt's adopted daughter.","zh":"希里是傑洛特的養女。"},{"en":"She is brave and very powerful.","zh":"她勇敢又非常強大。"},{"en":"The Wild Hunt wants her, so she is in danger.","zh":"狂獵想抓她，所以她有危險。"},{"en":"Geralt is looking for her.","zh":"傑洛特正在尋找她。"},{"en":"Yennefer is a sorceress.","zh":"葉妮芙是一名女術士。"},{"en":"She loves Geralt, and she helps him search for Ciri.","zh":"她愛著傑洛特，也幫他搜尋希里。"},{"en":"Triss is also a sorceress. She is Geralt's old friend.","zh":"特莉絲也是女術士，是傑洛特的老朋友。"},{"en":"Dandelion is a bard. He writes songs about Geralt's adventures.","zh":"丹德里恩是吟遊詩人，他寫關於傑洛特冒險的歌。"},{"en":"Vesemir is the oldest witcher. He was Geralt's teacher, and he is very loyal.","zh":"維瑟米爾是最年長的獵魔士，他是傑洛特的老師，而且非常忠誠。"}],"patterns":[{"pattern":"A is B's + 名詞","usage":"A 是 B 的…（所有格 's）","example_en":"Ciri is Geralt's adopted daughter.","example_zh":"希里是傑洛特的養女。"},{"pattern":"be + looking for + 人/物","usage":"正在尋找…（現在進行式）","example_en":"Geralt is looking for Ciri.","example_zh":"傑洛特正在尋找希里。"},{"pattern":"one of the most + 形容詞 + 複數名詞","usage":"最…的之一","example_en":"Yennefer is one of the most powerful sorceresses.","example_zh":"葉妮芙是最強大的女術士之一。"}],"words":["character","daughter","adopted","brave","powerful","danger","look for","search","loyal","adventure","witcher","sorceress","bard","Geralt","Ciri","Yennefer","Triss","Dandelion","Vesemir"]},{"n":3,"title":"第 3 課　怪物圖鑑","added":"2026-09-26","story":[{"en":"Let's open the bestiary.","zh":"來打開怪物圖鑑吧。"},{"en":"Drowners live near water.","zh":"水鬼住在水邊。"},{"en":"People say they come from the corpses of people who drowned.","zh":"據說它們來自溺死者的屍體。"},{"en":"They are not very strong, but they are dangerous in groups.","zh":"它們不算很強，但成群時很危險。"},{"en":"Drowners are weak against fire, so burn them with Igni.","zh":"水鬼怕火，所以用伊格尼燒它們。"},{"en":"Underwater, your sword doesn't work. Use your crossbow.","zh":"在水下，劍沒有用，要用十字弓。"},{"en":"Griffins are big flying creatures.","zh":"獅鷲是會飛的大型生物。"},{"en":"A griffin has the body of a lion and the head of an eagle.","zh":"獅鷲有獅子的身體和老鷹的頭。"},{"en":"Its attacks cause bleeding.","zh":"它的攻擊會造成流血。"},{"en":"Use Aard to bring it down to the ground.","zh":"用亞爾德法印把它打到地上。"},{"en":"Remember: use your silver sword for monsters and your steel sword for people.","zh":"記住：銀劍對付怪物，鋼劍對付人。"}],"patterns":[{"pattern":"A is weak against B","usage":"A 怕 B；A 對 B 比較弱","example_en":"Drowners are weak against fire.","example_zh":"水鬼怕火。"},{"pattern":"have the + 名詞 + of + 名詞","usage":"有…的…（描述外型）","example_en":"A griffin has the body of a lion and the head of an eagle.","example_zh":"獅鷲有獅子的身體和老鷹的頭。"},{"pattern":"Use A for B","usage":"用 A 對付 B（比較第 1 課的 Use A against B）","example_en":"Use your silver sword for monsters.","example_zh":"用銀劍對付怪物。"}],"words":["creature","dangerous","drown","corpse","underwater","burn","eagle","bleeding","weak against","silver","steel","drowner","griffin","necrophage","crossbow"]},{"n":4,"title":"第 4 課　法印","added":"2026-09-26","story":[{"en":"Geralt has five magic Signs.","zh":"傑洛特有五種魔法法印。"},{"en":"Each Sign uses stamina.","zh":"每個法印都會消耗耐力。"},{"en":"Aard pushes enemies away. It can knock them down.","zh":"亞爾德把敵人推開，還能把他們擊倒。"},{"en":"Igni makes fire. Use it to burn your enemies.","zh":"伊格尼產生火焰，用它燒敵人。"},{"en":"Yrden is a magic trap. It slows enemies down.","zh":"亞登是魔法陷阱，能讓敵人變慢。"},{"en":"It is also very good against ghosts and wraiths.","zh":"它也很適合對付鬼魂和妖靈。"},{"en":"Quen protects you. It makes a shield around you.","zh":"昆恩保護你，在你周圍形成護盾。"},{"en":"Axii can confuse an enemy.","zh":"亞克席能讓敵人困惑。"},{"en":"You can also use it in conversations to control people.","zh":"你也可以在對話中用它控制別人。"},{"en":"When your stamina is low, wait a moment before you use another Sign.","zh":"耐力低的時候，等一下再用下一個法印。"}],"patterns":[{"pattern":"It can + 動詞","usage":"它能夠…（can 後面接原形動詞）","example_en":"Aard can knock enemies down.","example_zh":"亞爾德能把敵人擊倒。"},{"pattern":"動詞 + 受詞 + down","usage":"片語動詞，受詞可以放中間（knock enemies down / slow enemies down）","example_en":"Yrden slows enemies down.","example_zh":"亞登讓敵人變慢。"},{"pattern":"When + 句子, + 命令句","usage":"當…的時候，就…","example_en":"When your stamina is low, wait a moment.","example_zh":"耐力低的時候，就等一下。"}],"words":["magic","knock down","stun","slow down","protect","confuse","trap","stamina","ghost","control","wraith","Aard","Igni","Yrden","Quen","Axii"]},{"n":5,"title":"第 5 課　新手技巧","added":"2026-09-26","story":[{"en":"Here are some tips for new witchers.","zh":"這裡有一些給新手獵魔士的技巧。"},{"en":"Don't rush. The world is big, so take your time.","zh":"別急。世界很大，慢慢來。"},{"en":"You should read the notice boards in every village. They give you new quests.","zh":"你應該看看每個村子的佈告欄，它們會給你新任務。"},{"en":"You should repair your sword and armor often. Visit a blacksmith or an armorer.","zh":"你應該常修理劍和盔甲，去找鐵匠或盔甲匠。"},{"en":"Meditate to heal and refill your potions.","zh":"冥想可以恢復生命並補充藥水。"},{"en":"Loot everything, but don't carry too many heavy things. Check your inventory.","zh":"什麼都撿，但別帶太多重的東西，要檢查物品欄。"},{"en":"Don't sell your starting armor to a merchant. You can make it better later.","zh":"不要把初始盔甲賣給商人，之後可以升級它。"},{"en":"Never break the law. The guards will attack you and take your money.","zh":"絕對不要犯法，守衛會攻擊你並拿走你的錢。"},{"en":"Ride Roach, your horse, to explore the map.","zh":"騎你的馬蘿蔔去探索地圖。"},{"en":"Don't worry. You'll learn fast!","zh":"別擔心，你會學得很快！"}],"patterns":[{"pattern":"You should + 動詞","usage":"你應該…（給建議）；should 的 l 不發音 [ʃʊd]","example_en":"You should read the notice boards.","example_zh":"你應該看看佈告欄。"},{"pattern":"Don't + 動詞 / You shouldn't + 動詞","usage":"不要…／你不應該…","example_en":"Don't sell your starting armor.","example_zh":"不要賣掉你的初始盔甲。"},{"pattern":"Always / Never + 命令句","usage":"一定要…／絕對不要…","example_en":"Never break the law.","example_zh":"絕對不要犯法。"}],"words":["notice board","repair","blacksmith","meditate","heal","refill","merchant","heavy","rush","guard","worry","inventory","Roach"]},{"n":6,"title":"第 6 課　獵魔委託","added":"2026-09-26","story":[{"en":"Geralt read a contract on the notice board.","zh":"傑洛特在佈告欄上看到一份委託。"},{"en":"A man named Odolan needed help.","zh":"一個叫歐多蘭的男人需要幫忙。"},{"en":"His daughter drank toxic water from the river, and she fell ill.","zh":"他的女兒喝了河裡有毒的水，病倒了。"},{"en":"She needed clean water from an old well.","zh":"她需要一口老井裡的乾淨水。"},{"en":"But a ghost lived by the well, and nobody could go there.","zh":"但井邊住著一個鬼魂，沒有人能靠近。"},{"en":"Geralt and Odolan agreed on a price.","zh":"傑洛特和歐多蘭談好了價錢。"},{"en":"Then Geralt went to the abandoned village.","zh":"然後傑洛特去了廢棄的村莊。"},{"en":"He used his Witcher Senses and investigated.","zh":"他使用獵魔士感官進行調查。"},{"en":"He looked for clues. He found burned grass, a diary, and a bracelet.","zh":"他尋找線索，找到了燒焦的草、一本日記和一個手環。"},{"en":"The evidence told him the truth. The ghost was a noonwraith.","zh":"證據告訴了他真相：那個鬼魂是午時妖靈。"},{"en":"It appeared at noon, and it was weak against Yrden.","zh":"它在正午出現，而且怕亞登法印。"},{"en":"Geralt prepared specter oil, fought the noonwraith, and won.","zh":"傑洛特準備了怨靈劍油，和午時妖靈戰鬥，並且贏了。"}],"patterns":[{"pattern":"規則過去式：動詞 + ed（三種念法）","usage":"無聲子音後念 [t]（asked）；有聲音後念 [d]（burned）；t/d 後念 [ɪd]（investigated）","example_en":"He asked, burned, and investigated.","example_zh":"他問了、燒了、也調查了。"},{"pattern":"不規則過去式","usage":"drink→drank, fall→fell, find→found, go→went, read→read（念 [rɛd]）","example_en":"His daughter drank toxic water and fell ill.","example_zh":"他的女兒喝了有毒的水，病倒了。"},{"pattern":"was / were + 形容詞或名詞","usage":"過去的狀態：單數用 was，複數用 were","example_en":"The village was abandoned.","example_zh":"那個村莊被廢棄了。"}],"words":["contract","well","toxic","abandoned","investigate","clue","evidence","diary","bracelet","noon","price","noonwraith","Witcher Senses","specter"]},{"n":7,"title":"第 7 課　技能樹","added":"2026-09-26","story":[{"en":"Every time you level up, you get an ability point.","zh":"每次升級，你都會得到一個技能點數。"},{"en":"You can also get points at Places of Power.","zh":"你也可以在力量之地獲得點數。"},{"en":"There are four skill trees: Combat, Signs, Alchemy, and General.","zh":"技能樹有四種：戰鬥、法印、煉金和一般。"},{"en":"Use your points to unlock new skills.","zh":"用點數解鎖新技能。"},{"en":"But a skill only works when it is active, so put it in a slot.","zh":"但技能只有啟用時才有效，所以要把它放進欄位。"},{"en":"At first you have only a few slots. You unlock more when you level up.","zh":"一開始只有幾個欄位，升級時會解鎖更多。"},{"en":"Skills make Geralt stronger.","zh":"技能讓傑洛特變得更強。"},{"en":"For example, one skill increases fast attack damage by 5 percent.","zh":"例如，有個技能讓快速攻擊傷害增加 5%。"},{"en":"Another skill makes your toxicity go down faster.","zh":"另一個技能讓你的毒性降得更快。"},{"en":"Mutagens give you more health, more damage, or stronger Signs.","zh":"突變誘發物讓你有更多生命值、更高傷害或更強的法印。"},{"en":"Put them next to skills of the same color.","zh":"把它們放在同色的技能旁邊。"},{"en":"You can't unlock every skill, so choose wisely!","zh":"你無法解鎖所有技能，所以要謹慎選擇！"}],"patterns":[{"pattern":"increase / reduce + 名詞 + by + 數字 percent","usage":"讓…增加／減少多少百分比（技能說明最常見的句型）","example_en":"Increases fast attack damage by 5 percent.","example_zh":"快速攻擊傷害增加 5%。"},{"pattern":"比較級：形容詞 + er / more + 形容詞","usage":"短的字加 -er（stronger, faster），長的字前面加 more（more powerful）","example_en":"Skills make Geralt stronger and more powerful.","example_zh":"技能讓傑洛特更強、更有力量。"},{"pattern":"You need + 數量 + 名詞 + to + 動詞","usage":"你需要多少…才能…","example_en":"You need 8 points to unlock the next row.","example_zh":"你需要 8 點才能解鎖下一排。"}],"words":["ability","skill","level up","unlock","increase","reduce","percent","health","critical","slot","active","maximum","adrenaline","toxicity","mutagen","Place of Power"]},{"n":8,"title":"第 8 課　煉金術","added":"2026-09-26","story":[{"en":"Alchemy is very useful for a witcher. Here is how it works.","zh":"煉金術對獵魔士很有用，以下是它的運作方式。"},{"en":"First, you need a recipe. You can find recipes in chests or buy them from a herbalist.","zh":"首先，你需要配方。你可以在箱子裡找到配方，或向草藥師購買。"},{"en":"Then, collect the ingredients.","zh":"接著，收集材料。"},{"en":"Most potions need alcohol, some herbs, and sometimes monster parts, like drowner brains.","zh":"大部分藥水需要酒精、一些草藥，有時還要怪物的部位，像是水鬼的腦。"},{"en":"Next, open the alchemy menu and brew the potion.","zh":"然後，打開煉金選單調製藥水。"},{"en":"Finally, drink it in a fight.","zh":"最後，在戰鬥中喝下它。"},{"en":"Swallow is the basic health potion. It helps you recover health slowly.","zh":"燕子藥水是基本的回血藥水，能幫你慢慢恢復生命值。"},{"en":"Remember: potions increase your toxicity, so don't drink too many at once.","zh":"記住：藥水會增加毒性，所以別一次喝太多。"},{"en":"The best part? You only brew a potion once.","zh":"最棒的是什麼？每種藥水你只需要調製一次。"},{"en":"After that, meditate with alcohol in your inventory, and your potions and bombs will refill.","zh":"之後，只要物品欄裡有酒精，冥想時藥水和炸彈就會補滿。"},{"en":"Oils don't run out, so just apply them to your sword.","zh":"劍油不會用完，所以直接塗在劍上就好。"}],"patterns":[{"pattern":"First, … Then, … Next, … Finally, …","usage":"說明步驟的順序：首先、接著、然後、最後","example_en":"First, find a recipe. Then, collect the ingredients. Finally, brew the potion.","example_zh":"首先找配方，接著收集材料，最後調製藥水。"},{"pattern":"Once you + 動詞, + 句子","usage":"一旦…就…","example_en":"Once you brew a potion, you can refill it for free.","example_zh":"一旦調製過一種藥水，之後就能免費補充。"},{"pattern":"As long as + 句子, + 句子","usage":"只要…就…","example_en":"As long as you have alcohol, meditation refills your potions.","example_zh":"只要有酒精，冥想就會補充藥水。"}],"words":["potion","recipe","alcohol","herb","herbalist","brew","dose","apply","bomb","recover","limited","Swallow","decoction","alcohest"]},{"n":9,"title":"第 9 課　鐵匠與製作","added":"2026-09-26","story":[{"en":"Geralt can't make weapons or armor himself. He needs help from a craftsman.","zh":"傑洛特自己不能做武器或盔甲，他需要工匠幫忙。"},{"en":"First, you need a diagram. A diagram shows the materials you need.","zh":"首先，你需要一張設計圖，設計圖會列出你需要的材料。"},{"en":"For example, a sword may need iron, leather, and other components.","zh":"例如，一把劍可能需要鐵、皮革和其他零件。"},{"en":"You can buy materials from merchants, find them in chests, or dismantle old items.","zh":"你可以向商人買材料、在箱子裡找，或是拆解舊物品。"},{"en":"Only blacksmiths can craft weapons, and only armorers can craft armor.","zh":"只有鐵匠能做武器，只有盔甲匠能做盔甲。"},{"en":"There are three levels of craftsmen: amateur, journeyman, and master.","zh":"工匠有三個等級：業餘、熟練和大師。"},{"en":"Some diagrams need a master.","zh":"有些設計圖需要大師級工匠。"},{"en":"Crafting also costs crowns. If you don't have enough money, you can't make the item.","zh":"製作也要花克朗，錢不夠就做不了。"},{"en":"Tip: Don't sell your old swords right away. Dismantle them.","zh":"提示：舊劍別急著賣，把它們拆解掉。"},{"en":"You'll get useful materials.","zh":"你會得到有用的材料。"}],"patterns":[{"pattern":"You need + A, B, and C + to + 動詞","usage":"做某事需要 A、B 和 C","example_en":"You need iron and leather to make a sword.","example_zh":"做劍需要鐵和皮革。"},{"pattern":"enough 的位置：enough + 名詞／形容詞 + enough","usage":"名詞放在 enough 後面；形容詞放在 enough 前面","example_en":"You don't have enough money. This blacksmith isn't skilled enough.","example_zh":"你的錢不夠。這個鐵匠的技術不夠好。"},{"pattern":"Only + A + can + 動詞","usage":"只有 A 能做某事","example_en":"Only blacksmiths can craft weapons.","example_zh":"只有鐵匠能製作武器。"}],"words":["craft","diagram","material","component","iron","leather","ore","armor","dismantle","enough","master","fee","journeyman","crowns"]},{"n":10,"title":"第 10 課　盔甲與武器","added":"2026-09-26","story":[{"en":"Geralt carries two swords: a steel sword for people and a silver sword for monsters.","zh":"傑洛特帶著兩把劍：鋼劍對付人，銀劍對付怪物。"},{"en":"Armor has three weight classes: light, medium, and heavy.","zh":"盔甲有三種重量等級：輕、中、重。"},{"en":"Light armor gives the least protection, but it is the best for stamina.","zh":"輕甲防護力最低，但最有利於耐力。"},{"en":"You can dodge and use Signs more often.","zh":"你可以更常閃避和使用法印。"},{"en":"Heavy armor gives the most protection, but your stamina comes back more slowly.","zh":"重甲防護力最高，但耐力恢復得比較慢。"},{"en":"Medium armor is in the middle. For many players, it is the best balance.","zh":"中甲介於中間，對很多玩家來說是最好的平衡。"},{"en":"Armor has four parts: chest armor, gauntlets, trousers, and boots.","zh":"盔甲分成四個部位：胸甲、護手、褲子和靴子。"},{"en":"Weapons and armor lose durability when you fight, so repair them often.","zh":"武器和盔甲戰鬥時會損失耐久度，所以要常修理。"},{"en":"Some items are rare. Relic items are some of the rarest in the game.","zh":"有些物品很稀有，遺物級是遊戲中最稀有的之一。"},{"en":"But the best gear is usually witcher gear. You craft it from diagrams.","zh":"但最好的裝備通常是獵魔士裝備，要用設計圖製作。"}],"patterns":[{"pattern":"最高級：the + 形容詞-est / the most + 形容詞","usage":"最…的；短字加 -est（the rarest），長字前加 the most（the most powerful）","example_en":"Heavy armor gives the most protection.","example_zh":"重甲的防護力最高。"},{"pattern":"不規則比較：good-better-best / bad-worse-worst / little-less-least","usage":"要個別背","example_en":"Light armor gives the least protection, but it is the best for stamina.","example_zh":"輕甲防護最少，但最有利於耐力。"},{"pattern":"A + gives more/less + 名詞 + than + B","usage":"A 比 B 給更多／更少的…","example_en":"Heavy armor gives more protection than light armor.","example_zh":"重甲比輕甲提供更多防護。"}],"words":["weapon","sword","light","medium","weight","protection","defense","durability","rare","balance","boots","trousers","gauntlets","relic"]},{"n":11,"title":"第 11 課　主線：丁香與醋栗","added":"2026-09-26","story":[{"en":"This is the first main quest in White Orchard.","zh":"這是白果園的第一個主線任務。"},{"en":"Geralt and Vesemir are looking for Yennefer.","zh":"傑洛特和維瑟米爾正在尋找葉妮芙。"},{"en":"On the road, they see a griffin attack a merchant. Vesemir is wounded in the fight.","zh":"路上他們看到獅鷲攻擊一個商人，維瑟米爾在戰鬥中受傷。"},{"en":"In the village, Geralt goes to the tavern.","zh":"到了村子，傑洛特走進酒館。"},{"en":"The innkeeper has no information about Yennefer, so Geralt asks the travelers.","zh":"旅店老闆沒有葉妮芙的消息，所以傑洛特去問旅客。"},{"en":"Only one man knows something: a bald man named Gaunter O'Dimm.","zh":"只有一個人知道些什麼：一個叫剛特・歐迪姆的光頭男子。"},{"en":"He says Yennefer spoke with a Nilfgaardian captain.","zh":"他說葉妮芙和一個尼弗迦德隊長談過話。"},{"en":"Geralt goes to the Nilfgaardian garrison, where many soldiers live.","zh":"傑洛特前往尼弗迦德要塞，那裡住著很多士兵。"},{"en":"The captain knows where Yennefer went, but he won't tell Geralt until Geralt kills the griffin.","zh":"隊長知道葉妮芙去了哪裡，但要等傑洛特殺了獅鷲才肯說。"},{"en":"It's information in exchange for a witcher's work.","zh":"這是用獵魔士的工作交換情報。"}],"patterns":[{"pattern":"ask + 人 + about + 事","usage":"向某人打聽某事","example_en":"Geralt asks the travelers about Yennefer.","example_zh":"傑洛特向旅客打聽葉妮芙。"},{"pattern":"won't + 動詞 + until + 句子","usage":"要等到…才會…","example_en":"He won't tell Geralt until Geralt kills the griffin.","example_zh":"要等傑洛特殺了獅鷲，他才會說。"},{"pattern":"A in exchange for B","usage":"用 B 交換 A","example_en":"It's information in exchange for a witcher's work.","example_zh":"這是用獵魔士的工作交換情報。"}],"words":["tavern","inn","innkeeper","traveler","information","captain","garrison","soldier","wounded","exchange","lilac","gooseberry","Nilfgaardian","Gaunter O'Dimm"]},{"n":12,"title":"第 12 課　白果園支線","added":"2026-09-26","story":[{"en":"White Orchard has several side quests. In the game, they are called secondary quests.","zh":"白果園有好幾個支線任務，在遊戲中叫做次要任務。"},{"en":"They are optional, but they give you experience, crowns, and good stories.","zh":"它們是可選的，但能給你經驗、克朗和好故事。"},{"en":"Villagers will ask you to help them.","zh":"村民會請你幫忙。"},{"en":"Some people are missing, and some need a witcher's help.","zh":"有些人失蹤了，有些人需要獵魔士的幫助。"},{"en":"You can find requests on the notice board, or people will talk to you on the road.","zh":"你可以在佈告欄找到請求，或是路上會有人來找你。"},{"en":"Open your journal to read about each quest.","zh":"打開日誌閱讀每個任務。"},{"en":"Track a quest, and a marker will appear on your map.","zh":"追蹤一個任務，地圖上就會出現標記。"},{"en":"Important: complete the side quests in White Orchard before you talk to Vesemir after the griffin hunt.","zh":"重要：獵完獅鷲後，在和維瑟米爾說話之前，先完成白果園的支線任務。"},{"en":"If you don't, some of them will fail.","zh":"不然有些任務會失敗。"},{"en":"Three quests to remember: Twisted Firestarter, Missing in Action, and On Death's Bed.","zh":"要記住三個任務：扭曲的縱火犯、作戰失蹤、臨終之床。"},{"en":"Make them a priority!","zh":"把它們列為優先！"}],"patterns":[{"pattern":"ask / help + 人 + (to) + 動詞","usage":"請某人做某事／幫某人做某事（help 後面的 to 可省略）","example_en":"Villagers will ask you to help them.","example_zh":"村民會請你幫忙。"},{"pattern":"before + 句子 / before + 動詞-ing","usage":"在…之前","example_en":"Complete the side quests before you talk to Vesemir.","example_zh":"在和維瑟米爾說話之前，先完成支線任務。"},{"pattern":"make + 受詞 + 名詞","usage":"把…變成…；讓…成為…","example_en":"Make them a priority.","example_zh":"把它們列為優先。"}],"words":["secondary","optional","missing","villager","request","fail","complete","journal","marker","track","priority","orchard","missing in action"]},{"n":13,"title":"第 13 課　感情與情緒","added":"2026-09-26","story":[{"en":"Geralt doesn't show his feelings much, but he has a heart.","zh":"傑洛特不太表露感情，但他是有心的。"},{"en":"He loves Yennefer, and he misses her.","zh":"他愛葉妮芙，也想念她。"},{"en":"Triss is also an old friend, and she cares about him.","zh":"特莉絲也是老朋友，她很關心他。"},{"en":"In the game, you can choose a relationship with Yennefer or Triss.","zh":"在遊戲中，你可以選擇和葉妮芙或特莉絲交往。"},{"en":"Your words in conversations matter. Think carefully before you choose.","zh":"你在對話中說的話很重要，選擇之前要想清楚。"},{"en":"People in the game have feelings too.","zh":"遊戲裡的人也有感情。"},{"en":"Some are lonely, some are worried, and some are jealous.","zh":"有些人孤單，有些人擔心，有些人嫉妒。"},{"en":"Listen to how they feel. It makes the story more exciting, not boring.","zh":"傾聽他們的感受，會讓故事更精彩，而不是無聊。"},{"en":"And when you are surprised by a character's words, remember: that's good writing!","zh":"當角色的話讓你驚訝時，記住：那就是好的劇本！"}],"patterns":[{"pattern":"-ed 和 -ing 形容詞","usage":"-ed 是人的感受（I'm bored / surprised）；-ing 是事物給人的感覺（It's boring / surprising）","example_en":"I was surprised. The story was surprising.","example_zh":"我很驚訝。這個故事很令人驚訝。"},{"pattern":"feel + 形容詞","usage":"感覺…（feel 後面接形容詞，不接副詞）","example_en":"Geralt feels worried about Ciri.","example_zh":"傑洛特很擔心希里。"},{"pattern":"care about / miss + 人","usage":"關心某人／想念某人","example_en":"She cares about him, and he misses her.","example_zh":"她關心他，他也想念她。"}],"words":["feel","love","miss","jealous","lonely","angry","worried","surprised","boring","relationship","honest","trust","romance"]},{"n":14,"title":"第 14 課　選擇與後果","added":"2026-09-26","story":[{"en":"The Witcher 3 is famous for its choices.","zh":"巫師3以它的選擇系統聞名。"},{"en":"Many decisions have consequences, and some consequences come much later.","zh":"很多決定都有後果，有些後果很久之後才出現。"},{"en":"Here is an easy example from the beginning of the game.","zh":"這裡有一個遊戲開頭的簡單例子。"},{"en":"After the griffin attacks a merchant, the merchant offers Geralt a reward.","zh":"獅鷲攻擊商人之後，商人要給傑洛特報酬。"},{"en":"If you accept, you will get fifty crowns.","zh":"如果你接受，你會拿到五十克朗。"},{"en":"If you refuse, you will get a free meal at the tavern and a discount later.","zh":"如果你拒絕，你會在酒館得到一頓免費餐點，之後還有折扣。"},{"en":"It's your choice, and neither answer is wrong.","zh":"這是你的選擇，兩個答案都沒錯。"},{"en":"But other choices matter more. Sometimes there is no good answer, only the lesser evil.","zh":"但其他選擇更重要。有時沒有好答案，只能兩害相權取其輕。"},{"en":"The result depends on what you say and what you do.","zh":"結果取決於你說了什麼、做了什麼。"},{"en":"So think carefully. Then don't regret it. Your story is your own!","zh":"所以要想清楚，然後別後悔。你的故事屬於你自己！"}],"patterns":[{"pattern":"If + 現在式, … will + 動詞（第一條件句）","usage":"如果…就會…；if 那半句用現在式，不用 will","example_en":"If you accept, you will get fifty crowns.","example_zh":"如果你接受，你會拿到五十克朗。"},{"pattern":"depend on + 名詞 / what 子句","usage":"取決於…","example_en":"The result depends on what you say.","example_zh":"結果取決於你說了什麼。"},{"pattern":"either A or B / neither","usage":"either A or B＝A 或 B 其中之一；neither＝兩者都不","example_en":"You can either accept or refuse. Neither answer is wrong.","example_zh":"你可以接受或拒絕，兩個答案都沒錯。"}],"words":["choice","consequence","decision","accept","refuse","depend","result","future","regret","matter","discount","meal","lesser evil"]},{"n":15,"title":"第 15 課　主線：白果園的野獸","added":"2026-09-26","story":[{"en":"The captain wants the griffin dead. He tells Geralt to talk to a hunter and a herbalist.","zh":"隊長要獅鷲死。他叫傑洛特去找一個獵人和一個草藥師。"},{"en":"First, Geralt visits the herbalist.","zh":"首先，傑洛特去拜訪草藥師。"},{"en":"She says he needs a plant called buckthorn to use as bait.","zh":"她說他需要一種叫鼠李的植物當誘餌。"},{"en":"It grows on the riverbed, so Geralt has to dive.","zh":"它長在河床上，所以傑洛特必須潛水。"},{"en":"Next, Geralt goes to the hunter's hut, but the hunter isn't home.","zh":"接著，傑洛特去獵人的小屋，但獵人不在家。"},{"en":"He must be out hunting.","zh":"他一定是出去打獵了。"},{"en":"Geralt uses his Witcher Senses and follows the footprints.","zh":"傑洛特使用獵魔士感官，跟著腳印走。"},{"en":"He finds the hunter fighting wild dogs. You can help him, or you can say you're in a hurry.","zh":"他發現獵人正在和野狗戰鬥。你可以幫他，也可以說你在趕時間。"},{"en":"The hunter takes Geralt to the place where the griffin attacked some soldiers.","zh":"獵人帶傑洛特到獅鷲攻擊士兵的地點。"},{"en":"Geralt examines the area. He finds bottles, blood, and footprints.","zh":"傑洛特仔細檢查這個區域，發現了酒瓶、血跡和腳印。"},{"en":"The soldiers might have had a party before the attack.","zh":"士兵們在被攻擊前可能在開派對。"},{"en":"He follows the tracks and finds the griffin's nest. Now it's time to hunt.","zh":"他跟著足跡找到獅鷲的巢。現在該去狩獵了。"}],"patterns":[{"pattern":"must be + 名詞/形容詞/動詞-ing（很確定的推測）","usage":"一定是…；根據證據推測","example_en":"He must be out hunting.","example_zh":"他一定是出去打獵了。"},{"pattern":"might + 動詞（不太確定的推測）","usage":"可能…；比 must 不確定","example_en":"The soldiers might have had a party.","example_zh":"士兵們可能開過派對。"},{"pattern":"be in a hurry","usage":"正在趕時間","example_en":"I'm in a hurry.","example_zh":"我在趕時間。"}],"words":["hunter","hut","footprint","blood","nest","bait","dive","riverbed","wild","hurry","examine","buckthorn"]},{"n":16,"title":"第 16 課　地圖與方向","added":"2026-09-26","story":[{"en":"Let's learn to read the map of White Orchard.","zh":"來學看白果園的地圖吧。"},{"en":"The Nilfgaardian garrison is north of the village.","zh":"尼弗迦德要塞在村子的北方。"},{"en":"The hunter's hut is southwest of the village.","zh":"獵人的小屋在村子的西南方。"},{"en":"To get there, start at the notice board and follow the road southwest.","zh":"要去那裡，從佈告欄出發，沿著路往西南走。"},{"en":"Near the door, you will find the hunter's tracks. They go south into the forest.","zh":"門附近會找到獵人的足跡，它們往南進入森林。"},{"en":"There is a river near the village, and you can cross it on a bridge.","zh":"村子附近有一條河，你可以從橋上過河。"},{"en":"There is even a signpost called Broken Bridge.","zh":"甚至有一個路標就叫「斷橋」。"},{"en":"Look for signposts on the road. You can use them to fast travel.","zh":"留意路上的路標，你可以用它們快速旅行。"},{"en":"If you are lost, open the map and check your direction.","zh":"如果迷路了，打開地圖確認方向。"}],"patterns":[{"pattern":"A is + 方位 + of + B","usage":"A 在 B 的某個方位（north of, southwest of）","example_en":"The garrison is north of the village.","example_zh":"要塞在村子北方。"},{"pattern":"位置介系詞：next to / behind / across / near","usage":"在旁邊／在後面／在對面／在附近","example_en":"The inn is across the road, next to the notice board.","example_zh":"旅店在馬路對面，佈告欄旁邊。"},{"pattern":"指路命令句：Follow / Turn / Go + 方向","usage":"沿著…走／轉彎／往…走","example_en":"Follow the road and turn left at the bridge.","example_zh":"沿著路走，到橋那裡左轉。"}],"words":["north","south","east","west","direction","road","bridge","signpost","across","toward","behind","follow"]},{"n":17,"title":"第 17 課　買賣與商人","added":"2026-09-26","story":[{"en":"Geralt meets a merchant on the road.","zh":"傑洛特在路上遇到一個商人。"},{"en":"Merchant: Good day, witcher! Would you like to buy something?","zh":"商人：你好，獵魔士！想買點什麼嗎？"},{"en":"Geralt: How much is this sword?","zh":"傑洛特：這把劍多少錢？"},{"en":"Merchant: It costs two hundred crowns.","zh":"商人：兩百克朗。"},{"en":"Geralt: That's too expensive. I can't afford it.","zh":"傑洛特：太貴了，我買不起。"},{"en":"Merchant: Then I'll make you an offer. One hundred and fifty.","zh":"商人：那我給你一個價錢，一百五十。"},{"en":"Geralt: Hm. I'd like to sell some things too.","zh":"傑洛特：嗯，我也想賣一些東西。"},{"en":"Merchant: Let me see. This old armor isn't worth much. I'll give you half the price.","zh":"商人：我看看。這件舊盔甲不值多少錢，我給你半價。"},{"en":"Tip: Some items are cheap but hard to find, like Gwent cards. Buy them when you see them!","zh":"提示：有些東西很便宜但很難找，像是昆特牌卡片。看到就買！"}],"patterns":[{"pattern":"How much is + 單數 / How much are + 複數?","usage":"…多少錢？","example_en":"How much is this sword? How much are these boots?","example_zh":"這把劍多少錢？這雙靴子多少錢？"},{"pattern":"I'd like to + 動詞","usage":"我想要…（比 I want 禮貌）；I'd＝I would","example_en":"I'd like to sell some things.","example_zh":"我想賣一些東西。"},{"pattern":"too + 形容詞","usage":"太…了（負面）；比較第 9 課的 形容詞 + enough","example_en":"That's too expensive.","example_zh":"那太貴了。"}],"words":["buy","sell","how much","cost","cheap","expensive","afford","trade","coin","offer","worth","half"]},{"n":18,"title":"第 18 課　昆特牌","added":"2026-09-26","story":[{"en":"Gwent is a card game inside The Witcher 3.","zh":"昆特牌是巫師3裡的紙牌遊戲。"},{"en":"You can learn it from a scholar in the White Orchard tavern.","zh":"你可以跟白果園酒館裡的一位學者學。"},{"en":"Each player has a deck of cards. At the start, you draw ten cards.","zh":"每個玩家都有一副牌，一開始抽十張。"},{"en":"The board has three rows on each side: close combat, ranged, and siege.","zh":"每一邊的桌面有三排：近戰、遠程和攻城。"},{"en":"Take turns. On your turn, you play one card.","zh":"輪流出牌，輪到你時出一張牌。"},{"en":"Each card has a strength from 0 to 15.","zh":"每張卡的戰力從 0 到 15。"},{"en":"At the end of a round, the player with the higher score wins the round.","zh":"回合結束時，分數比較高的玩家贏得這回合。"},{"en":"If you don't want to play more cards, you can pass.","zh":"不想再出牌的話，可以跳過。"},{"en":"To win the game, you have to win two of the three rounds.","zh":"要贏得整局，你必須贏三回合中的兩回合。"},{"en":"Be careful with weather cards. They make all cards in one row weak.","zh":"小心天氣卡，它們會讓一整排的卡都變弱。"},{"en":"Tip: Innkeepers and merchants sell cards. Buy them early!","zh":"提示：旅店老闆和商人都有賣卡，早點買！"}],"patterns":[{"pattern":"序數：first / second / third","usage":"第一／第二／第三（first round, the third round）","example_en":"You have to win two of the three rounds.","example_zh":"你必須贏三回合中的兩回合。"},{"pattern":"have to + 動詞","usage":"必須…（規則要求）","example_en":"To win the game, you have to win two rounds.","example_zh":"要贏整局，你必須贏兩回合。"},{"pattern":"It's + 人 + turn","usage":"輪到某人了（your / my / his turn）","example_en":"It's your turn.","example_zh":"輪到你了。"}],"words":["card","deck","round","pass","score","row","weather","strength","opponent","draw","lose","turn","Gwent","siege"]},{"n":19,"title":"第 19 課　對話與提問","added":"2026-09-26","story":[{"en":"Conversations are a big part of The Witcher 3. Many dialogue options are questions.","zh":"對話是巫師3很重要的一部分，很多對話選項都是問句。"},{"en":"When Geralt looks for Yennefer, he asks many questions.","zh":"傑洛特尋找葉妮芙時，問了很多問題。"},{"en":"Where is Yennefer? When did she leave? Which way did she go?","zh":"葉妮芙在哪裡？她什麼時候離開的？她往哪條路走了？"},{"en":"Sometimes strangers ask Geralt questions too.","zh":"有時陌生人也會問傑洛特問題。"},{"en":"Who are you? What do you want? Why are you here?","zh":"你是誰？你想要什麼？你為什麼在這裡？"},{"en":"Listen to the answer before you choose your next option.","zh":"選下一個選項之前，先仔細聽回答。"},{"en":"Remember: in who and whose, you say the h, and the w is silent.","zh":"記住：who 和 whose 要念 h，w 不發音。"},{"en":"In what, where, when, why, and which, most people say the w, and the h is silent.","zh":"what、where、when、why、which 大多數人念 w，h 不發音。"},{"en":"Good questions give you good information.","zh":"好問題帶來好情報。"}],"patterns":[{"pattern":"疑問詞 + be + 主詞","usage":"問「是什麼／在哪裡」","example_en":"Where is Yennefer? Who are you?","example_zh":"葉妮芙在哪裡？你是誰？"},{"pattern":"疑問詞 + do / does / did + 主詞 + 動詞","usage":"一般動詞的問句；過去用 did，後面動詞用原形","example_en":"Where did she go? What do you want?","example_zh":"她去哪裡了？你想要什麼？"},{"pattern":"How + 形容詞／副詞","usage":"How long（多久）、How far（多遠）、How much（多少錢）","example_en":"How long ago did she leave?","example_zh":"她多久以前離開的？"}],"words":["who","whose","what","where","when","why","which","how","answer","conversation","option","stranger"]},{"n":20,"title":"第 20 課　時間與晝夜","added":"2026-09-26","story":[{"en":"The world of The Witcher 3 has day and night.","zh":"巫師3的世界有白天和黑夜。"},{"en":"In the morning, villagers go to work. In the evening, many of them go to the tavern.","zh":"早上村民去工作，傍晚很多人去酒館。"},{"en":"Some monsters only come out at certain times.","zh":"有些怪物只在特定時間出現。"},{"en":"A noonwraith appears at noon, and a nightwraith appears at night.","zh":"午時妖靈在正午出現，夜之妖靈在夜晚出現。"},{"en":"If you need a different time, you can meditate.","zh":"如果你需要換個時間，可以冥想。"},{"en":"Choose an hour, and Geralt will meditate until that time.","zh":"選一個時間，傑洛特會冥想到那個時候。"},{"en":"For example, meditate until midnight, or until dawn.","zh":"例如，冥想到午夜，或冥想到黎明。"},{"en":"It is eight o'clock now. Wait one hour, and it will be nine o'clock.","zh":"現在八點，等一個小時就九點了。"},{"en":"Be careful at night. It's dark, so it's harder to see.","zh":"晚上要小心，天很黑，比較看不清楚。"}],"patterns":[{"pattern":"at / in / on + 時間","usage":"at + 時刻（at noon, at night）；in + 時段（in the morning）；on + 日期（on Monday）","example_en":"A noonwraith appears at noon. Villagers work in the morning.","example_zh":"午時妖靈在正午出現。村民早上工作。"},{"pattern":"until + 時間","usage":"直到某個時間","example_en":"Meditate until midnight.","example_zh":"冥想到午夜。"},{"pattern":"It is + 數字 + o'clock","usage":"現在幾點（只用在整點）","example_en":"It is eight o'clock now.","example_zh":"現在八點。"}],"words":["morning","afternoon","evening","night","midnight","hour","minute","until","o'clock","dawn","dusk","knight"]},{"n":21,"title":"第 21 課　天氣與自然","added":"2026-09-26","story":[{"en":"The weather in The Witcher 3 changes all the time.","zh":"巫師3的天氣隨時在變化。"},{"en":"Sometimes it's sunny. Sometimes it's raining, and sometimes there is a big storm.","zh":"有時晴天，有時下雨，有時還有大暴風雨。"},{"en":"Listen to the wind. When the wind is howling, a storm is coming.","zh":"聽聽風聲，風在呼嘯時，暴風雨就要來了。"},{"en":"In the morning, there may be fog over the lake.","zh":"早上湖面上可能有霧。"},{"en":"The world has many places to explore: forests, swamps, caves, lakes, mountains, and even islands.","zh":"這個世界有很多地方可以探索：森林、沼澤、洞穴、湖泊、山脈，甚至島嶼。"},{"en":"Swamps are wet and full of drowners.","zh":"沼澤很濕，到處都是水鬼。"},{"en":"Caves are dark, so drink a Cat potion to see better.","zh":"洞穴很暗，喝一瓶貓藥水就能看得比較清楚。"},{"en":"It's getting dark. Time to find an inn!","zh":"天漸漸黑了，該找間旅店了！"}],"patterns":[{"pattern":"It's + 動詞-ing（描述現在的天氣）","usage":"It's raining（正在下雨）；天氣的主詞用 it","example_en":"It's raining, and the wind is howling.","example_zh":"正在下雨，風在呼嘯。"},{"pattern":"It's getting + 形容詞","usage":"漸漸變得…","example_en":"It's getting dark.","example_zh":"天漸漸黑了。"},{"pattern":"There is + 單數 / There are + 複數","usage":"有…（存在）","example_en":"There is fog over the lake. There are many caves.","example_zh":"湖面上有霧。有很多洞穴。"}],"words":["rain","storm","fog","wind","howl","forest","swamp","cave","lake","mountain","island","dark"]},{"n":22,"title":"第 22 課　身體與受傷","added":"2026-09-26","story":[{"en":"Fighting monsters is dangerous. Geralt often gets hurt.","zh":"和怪物戰鬥很危險，傑洛特常常受傷。"},{"en":"A griffin can hit you with its claws, and you will start to bleed.","zh":"獅鷲會用爪子攻擊你，你會開始流血。"},{"en":"Some monsters use poison. If you get poisoned, your health goes down slowly.","zh":"有些怪物會用毒，中毒的話，生命值會慢慢下降。"},{"en":"Watch out for attacks to your head and chest.","zh":"小心頭部和胸部受到的攻擊。"},{"en":"Good armor protects your body: chest, arms, hands, and legs.","zh":"好的盔甲保護你的身體：胸部、手臂、手和腿。"},{"en":"When Geralt is injured, he can drink a potion, eat food, or meditate.","zh":"傑洛特受傷時，可以喝藥水、吃東西或冥想。"},{"en":"After a long fight, his arm hurts and his legs are tired.","zh":"長時間戰鬥後，他的手臂痛，腿也很累。"},{"en":"Even a witcher feels pain. But a witcher's heart is strong.","zh":"就連獵魔士也會痛，但獵魔士的心很堅強。"}],"patterns":[{"pattern":"My + 身體部位 + hurts / hurt","usage":"我的…痛（單數用 hurts，複數用 hurt）","example_en":"My arm hurts. My legs hurt.","example_zh":"我的手臂痛。我的腿痛。"},{"pattern":"get + 過去分詞","usage":"變得…；遭受…（get hurt, get poisoned）","example_en":"If you get poisoned, your health goes down.","example_zh":"如果中毒，生命值會下降。"},{"pattern":"Watch out (for + 名詞)!","usage":"小心…！","example_en":"Watch out for attacks to your head!","example_zh":"小心頭部受到攻擊！"}],"words":["head","arm","leg","chest","hand","heart","hurt","injured","poison","bleed","pain","stomach"]},{"n":23,"title":"第 23 課　食物與飲料","added":"2026-09-26","story":[{"en":"Food is important in The Witcher 3. When Geralt eats, his health comes back.","zh":"食物在巫師3很重要，傑洛特吃東西時生命值會恢復。"},{"en":"You can buy food from innkeepers and merchants: bread, meat, cheese, and fruit.","zh":"你可以向旅店老闆和商人買食物：麵包、肉、起司和水果。"},{"en":"Water and milk are good too. Beer and wine are alcohol.","zh":"水和牛奶也不錯，啤酒和葡萄酒則是酒精飲料。"},{"en":"Remember, you can use strong alcohol for alchemy.","zh":"記得，烈酒可以用在煉金術上。"},{"en":"Are you hungry? Have a piece of bread. Are you thirsty? Have a bottle of water.","zh":"餓了嗎？吃一塊麵包。渴了嗎？喝一瓶水。"},{"en":"Some food is very delicious, like the roast chicken at the White Orchard inn.","zh":"有些食物很好吃，像是白果園旅店的烤雞。"},{"en":"Tip: You don't need much food, but carry some in your inventory.","zh":"提示：你不需要很多食物，但物品欄裡要帶一些。"}],"patterns":[{"pattern":"a piece of / a bottle of / a cup of + 不可數名詞","usage":"不可數名詞要用單位來數：a piece of bread, a bottle of water","example_en":"Have a piece of bread and a bottle of water.","example_zh":"吃一塊麵包，喝一瓶水。"},{"pattern":"much + 不可數 / many + 可數","usage":"much food, much water；many potions, many cards","example_en":"You don't need much food, but you have many potions.","example_zh":"你不需要很多食物，但你有很多藥水。"},{"pattern":"some（肯定句）/ any（否定、疑問句）","usage":"Do you have any food? Yes, I have some.","example_en":"Do you have any bread? Yes, I have some.","example_zh":"你有麵包嗎？有，我有一些。"}],"words":["food","bread","meat","cheese","water","beer","wine","hungry","thirsty","delicious","piece","bottle"]},{"n":24,"title":"第 24 課　現在完成式與常用回應","added":"2026-09-26","story":[{"en":"Geralt travels a lot, so he often asks, \"Have you seen this woman?\"","zh":"傑洛特到處旅行，所以常問：「你見過這個女人嗎？」"},{"en":"In the tavern, people talk about rumors.","zh":"在酒館裡，人們在聊傳聞。"},{"en":"\"Have you heard the news? A griffin has attacked the road again!\"","zh":"「你聽說了嗎？獅鷲又在路上攻擊人了！」"},{"en":"Some villagers have never seen a witcher before. They are surprised.","zh":"有些村民從來沒見過獵魔士，他們很驚訝。"},{"en":"When someone asks for help, Geralt might say, \"Sure,\" or \"Of course.\"","zh":"有人求助時，傑洛特可能會說「好啊」或「當然」。"},{"en":"If someone says sorry, he might say, \"Never mind.\"","zh":"有人道歉時，他可能會說「沒關係」。"},{"en":"When he understands, he says, \"I see.\"","zh":"他明白時會說「我懂了」。"},{"en":"Has Geralt found Yennefer yet? Not yet, but he has already learned a lot.","zh":"傑洛特找到葉妮芙了嗎？還沒，但他已經打聽到很多了。"},{"en":"And you? Have you finished the White Orchard quests yet?","zh":"那你呢？白果園的任務完成了嗎？"}],"patterns":[{"pattern":"Have you (ever) + 過去分詞?","usage":"你（曾經）…過嗎？（現在完成式問經驗）","example_en":"Have you ever seen a griffin?","example_zh":"你見過獅鷲嗎？"},{"pattern":"have / has + already + 過去分詞；… yet?","usage":"already（已經）用在肯定句；yet 用在否定句（還沒）和問句（了沒）","example_en":"He has already learned a lot. Has he found her yet?","example_zh":"他已經學到很多了。他找到她了沒？"},{"pattern":"常用回應：Sure / Of course / Never mind / I see","usage":"好啊／當然／沒關係／我明白了","example_en":"Sure. Of course. Never mind. I see.","example_zh":"好啊。當然。沒關係。我懂了。"}],"words":["seen","heard","ever","never","already","yet","sure","fine","of course","never mind","I see","rumor"]},{"n":25,"title":"第 25 課　外貌與顏色","added":"2026-09-27","story":[{"en":"Geralt has long white hair.","zh":"傑洛特有一頭長長的白髮。"},{"en":"He is tall and thin, but very strong.","zh":"他又高又瘦，但非常強壯。"},{"en":"He has a scar over his left eye, and his skin is pale.","zh":"他的左眼上有一道疤，皮膚很蒼白。"},{"en":"His eyes are yellow, like a cat's eyes.","zh":"他的眼睛是黃色的，像貓的眼睛。"},{"en":"Some villagers are afraid. They say he looks like a monster.","zh":"有些村民會害怕，他們說他看起來像怪物。"},{"en":"But most of the time, he just looks tired.","zh":"但大部分的時候，他只是看起來很累。"},{"en":"He wears a silver wolf medallion around his neck.","zh":"他脖子上戴著一個銀色的狼頭徽章。"},{"en":"Yennefer has black hair and purple eyes.","zh":"葉妮芙有黑色的頭髮和紫色的眼睛。"},{"en":"She always wears black and white.","zh":"她總是穿黑色和白色。"},{"en":"Roach is a big brown horse.","zh":"蘿蔔是一匹高大的棕色馬。"},{"en":"In this game, your appearance can change. Geralt's beard grows every day!","zh":"在這個遊戲裡，你的外表會改變。傑洛特的鬍子每天都在長！"}],"patterns":[{"pattern":"look + 形容詞","usage":"看起來…（look 後面接形容詞，不接副詞：looks tired，不是 looks tiredly）","example_en":"He looks tired.","example_zh":"他看起來很累。"},{"pattern":"look like + 名詞","usage":"看起來像…（後面接名詞；和上一句型不要混用）","example_en":"He looks like a monster.","example_zh":"他看起來像怪物。"},{"pattern":"形容詞順序：看法 → 大小 → 年齡 → 顏色 + 名詞","usage":"多個形容詞一起用時的順序；中文比較自由，英文有固定順序","example_en":"Roach is a big brown horse.","example_zh":"蘿蔔是一匹高大的棕色馬。"}],"words":["hair","white","tall","thin","scar","eye","yellow","purple","pale","beard","handsome","wear","appearance","medallion"]},{"n":26,"title":"第 26 課　每天的例行公事（獵魔士的一天）","added":"2026-09-27","story":[{"en":"What does a witcher do every day?","zh":"獵魔士每天都在做什麼？"},{"en":"Geralt usually wakes up at dawn.","zh":"傑洛特通常在黎明醒來。"},{"en":"He always eats breakfast first.","zh":"他總是先吃早餐。"},{"en":"Then he often practices with his sword.","zh":"然後他常常練劍。"},{"en":"He sometimes uses a whetstone to make his sword sharper.","zh":"他有時候會用磨刀石讓劍更鋒利。"},{"en":"He is rarely lazy.","zh":"他很少偷懶。"},{"en":"In the afternoon, he rides Roach to the next village.","zh":"下午，他騎蘿蔔去下一個村子。"},{"en":"He reads the notice board and asks about contracts.","zh":"他看佈告欄，打聽有沒有委託。"},{"en":"At night he is usually tired, so he meditates or sleeps at an inn.","zh":"晚上他通常很累，所以會冥想或在旅店睡覺。"},{"en":"This is his daily routine.","zh":"這就是他每天的例行公事。"},{"en":"How often do you play The Witcher?","zh":"你多常玩巫師？"}],"patterns":[{"pattern":"頻率副詞 + 一般動詞","usage":"always / usually / often / sometimes / rarely 放在一般動詞前面（台灣人常放句尾）","example_en":"Geralt usually wakes up at dawn.","example_zh":"傑洛特通常在黎明醒來。"},{"pattern":"be 動詞 + 頻率副詞","usage":"遇到 am / is / are，頻率副詞放在 be 動詞後面","example_en":"He is rarely lazy.","example_zh":"他很少偷懶。"},{"pattern":"How often do you + 動詞？","usage":"你多常…？回答用頻率副詞或 every day / twice a week","example_en":"How often do you meditate?","example_zh":"你多常冥想？"}],"words":["always","usually","often","sometimes","rarely","wake up","breakfast","ride","practice","sleep","tired","daily","routine","whetstone"]},{"n":27,"title":"第 27 課　計畫與打算","added":"2026-09-27","story":[{"en":"Geralt has a plan.","zh":"傑洛特有一個計畫。"},{"en":"\"I'm going to leave White Orchard tomorrow,\" he says.","zh":"「我明天要離開白果園。」他說。"},{"en":"\"I'm going to follow Yennefer's trail.\"","zh":"「我要循著葉妮芙的線索走。」"},{"en":"A villager asks, \"Will you come back?\"","zh":"一個村民問：「你會回來嗎？」"},{"en":"\"Maybe. I will probably return soon.\"","zh":"「也許吧。我大概很快就會回來。」"},{"en":"The innkeeper says, \"It will rain tonight. Stay here.\"","zh":"旅店老闆說：「今晚會下雨，留下來吧。」"},{"en":"Geralt decides to stay one more night.","zh":"傑洛特決定多住一晚。"},{"en":"\"Fine. I'll leave at dawn. I promise.\"","zh":"「好吧，我黎明就走，我保證。」"},{"en":"Later, he will arrive in Velen, a dangerous land.","zh":"之後，他會抵達危險的威倫。"},{"en":"What is your plan for the next quest?","zh":"你下一個任務的計畫是什麼？"}],"patterns":[{"pattern":"be going to + 原形動詞","usage":"已經想好的計畫或打算；going to 口語常念 gonna","example_en":"I'm going to leave tomorrow.","example_zh":"我明天要離開。"},{"pattern":"will + 原形動詞","usage":"說話當下才決定、答應或保證；常縮寫成 I'll [aɪl]","example_en":"Fine. I'll leave at dawn.","example_zh":"好吧，我黎明就走。"},{"pattern":"will probably / maybe … will","usage":"預測未來；probably 放在 will 後面（台灣人常放錯位置）","example_en":"It will probably rain tonight.","example_zh":"今晚大概會下雨。"}],"words":["plan","going to","leave","tomorrow","tonight","next","maybe","probably","soon","return","arrive","decide","promise","Velen"]},{"n":28,"title":"第 28 課　委託人的故事","added":"2026-09-27","story":[{"en":"This notice is from a woman who lives in the village.","zh":"這張告示來自一個住在村子裡的女人。"},{"en":"She is a widow. Her husband was a farmer.","zh":"她是寡婦，她的丈夫是個農夫。"},{"en":"Something is killing her sheep at night.","zh":"有東西在晚上殺她的羊。"},{"en":"The villagers say it is a wolf that came from the forest.","zh":"村民說那是從森林來的狼。"},{"en":"But the footprints that Geralt finds are not a wolf's.","zh":"但傑洛特找到的腳印不是狼的。"},{"en":"He looks for someone who saw the monster.","zh":"他尋找看過那隻怪物的人。"},{"en":"A boy who works on the farm says it lives in an old cellar.","zh":"一個在農場工作的男孩說，牠住在一個老地窖裡。"},{"en":"It is a ghoul, a monster which eats dead bodies.","zh":"那是食屍鬼，一種吃屍體的怪物。"},{"en":"The woman wants to hire Geralt, but she can't pay much.","zh":"那女人想僱用傑洛特，但她付不了多少錢。"},{"en":"Someone also tried to steal her last coins.","zh":"還有人想偷她最後的幾枚錢幣。"},{"en":"Will Geralt help a woman who has almost nothing?","zh":"傑洛特會幫助一個幾乎一無所有的女人嗎？"}],"patterns":[{"pattern":"人 + who + 動詞","usage":"「…的人」：用 who 把說明放在人的後面（中文放前面，英文放後面）","example_en":"A woman who lives in the village needs help.","example_zh":"一個住在村子裡的女人需要幫忙。"},{"pattern":"東西／動物 + which / that + 動詞","usage":"「…的東西」：物和動物用 which 或 that；口語 that 最常用","example_en":"It's a monster that kills sheep.","example_zh":"那是一隻會殺羊的怪物。"},{"pattern":"someone who + 動詞","usage":"「一個…的人」：找人、問人時很常用","example_en":"I'm looking for someone who saw it.","example_zh":"我在找看過牠的人。"}],"words":["woman","village","farmer","widow","husband","sheep","wolf","kill","steal","someone","cellar","pay","hire","ghoul"]},{"n":29,"title":"第 29 課　酒館裡的騷動","added":"2026-09-27","story":[{"en":"Last night, Geralt was sitting in the tavern.","zh":"昨晚，傑洛特正坐在酒館裡。"},{"en":"He was drinking beer and playing Gwent.","zh":"他正在喝啤酒、玩昆特牌。"},{"en":"Some soldiers were singing at the next table.","zh":"隔壁桌有幾個士兵正在唱歌。"},{"en":"Suddenly, there was a loud noise.","zh":"突然傳來一聲巨響。"},{"en":"A drunk man fell on the floor.","zh":"一個醉漢跌倒在地上。"},{"en":"He jumped up and shouted at Geralt.","zh":"他跳起來對傑洛特大吼。"},{"en":"A woman screamed.","zh":"一個女人尖叫。"},{"en":"Geralt was finishing his game when the man hit the table.","zh":"傑洛特正要打完這局牌時，那男人拍了桌子。"},{"en":"It became a brawl.","zh":"場面變成了一場鬥毆。"},{"en":"While they were fighting, a thief escaped through the window.","zh":"他們打架的時候，一個小偷從窗戶逃走了。"},{"en":"Nobody saw him. But Geralt did.","zh":"沒人看到他，但傑洛特看到了。"}],"patterns":[{"pattern":"was / were + V-ing","usage":"過去進行式：過去某個時間點「正在」做的事；he/she/I 用 was，you/they 用 were","example_en":"He was drinking beer.","example_zh":"他當時正在喝啤酒。"},{"pattern":"was V-ing … when + 過去式","usage":"正在做 A 的時候，B 突然發生（長的動作用進行式，突然的動作用過去式）","example_en":"He was playing Gwent when the man shouted.","example_zh":"他正在玩昆特牌時，那個人大吼。"},{"pattern":"While + was/were V-ing, …","usage":"兩件事同時在進行；while 後面常接進行式","example_en":"While they were fighting, a thief escaped.","example_zh":"他們打架的時候，一個小偷逃走了。"}],"words":["suddenly","while","noise","fall","floor","drunk","jump","shout","scream","table","fight","brawl","escape","window"]}],"review":["sheep","shout","eye","breakfast","sure","fine","of course","never mind","I see","rumor"],"review_label":"09/27 16:00 這一批","planned":{"ui":22,"verbs":36,"describe":27,"talk":24,"time":21,"direction":19,"feelings":19,"body":20,"main":3,"allies":16,"people":27,"races":17,"looks":22,"combat":21,"signs":12,"alchemy":19,"abilities":14,"weapons":0,"armor":0,"items":3,"crafting":0,"money":0,"places":29,"monsters":38,"nature":15,"food":29,"lore":12,"quests":23,"choices":16,"gwent":22,"tips":2},"planned_total":528};
const W=DATA.words, TAX=DATA.taxonomy, LES=DATA.lessons, META=DATA.meta||{};
const SUBS={}; TAX.forEach(c=>c.subs.forEach(s=>{SUBS[s.key]=Object.assign({cat:c.key,catEn:c.en,catZh:c.zh},s)}));
const TRAPS={silent:"不發音字母",stress:"重音位置",homophone:"同音字",confusable:"易混淆字",th:"th 的兩種音",ed:"-ed 字尾",r:"捲舌音",vowel:"長短母音與拼法",final:"字尾子音要發",taiwan:"台灣人常見念法"};
const TYPES=["全部","實用","遊戲專有","角色名","古風"];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={rate:store.get("rate",0.8),acc:store.get("acc","en-US"),done:store.get("done2",{}),type:"全部",list:[],idx:0,shown:{}};
const countSub=k=>W.filter(w=>w.sub===k).length;

/* ---------- speech ---------- */
const synth=window.speechSynthesis; let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));$("warn").style.display=(synth.getVoices().length&&!voices.length)?"block":"none"}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else{$("warn").style.display="block"}
function pickVoice(){const want=S.acc.toLowerCase();const m=voices.filter(v=>v.lang.replace("_","-").toLowerCase()===want);
  return m.find(v=>/samantha|google us|daniel|google uk|aria|jenny|libby|sonia|natural/i.test(v.name))||m[0]||voices[0]||null}
const SAY=DATA.tts_respell||{};
const SAY_RE=Object.keys(SAY).length?new RegExp("\\b("+Object.keys(SAY).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g"):null;
const fix=t=>SAY_RE?t.replace(SAY_RE,m=>SAY[m]):t;
let run=0;
function speak(t,rate){t=fix(t);return new Promise(r=>{if(!synth){r();return}const u=new SpeechSynthesisUtterance(t);const v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang=S.acc;u.rate=rate||S.rate;u.onend=r;u.onerror=r;synth.speak(u)})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stop(){run++;if(synth)synth.cancel();setAuto(false);$("st").textContent="";document.querySelectorAll(".sent.on").forEach(e=>e.classList.remove("on"))}

/* ---------- nav ---------- */
const chev='<svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
let openCat=null;
function renderNav(){
  $("nav").innerHTML=TAX.map(c=>`<button class="nb${cur.cat===c.key?" cur":""}" data-cat="${c.key}" aria-expanded="${openCat===c.key}" aria-controls="drop"><span>${c.en}<small>${c.zh}</small></span>${chev}</button>`).join("");
  if(openCat){const c=TAX.find(t=>t.key===openCat);
    $("dropgrid").innerHTML=c.subs.map(s=>`<button class="sb${cur.sub===s.key?" cur":""}" data-sub="${s.key}"><span>${esc(s.zh)}</span><span class="n">${s.view?"":countSub(s.key)}</span></button>`).join("");}
  $("drop").classList.toggle("open",!!openCat);
}
$("nav").onclick=e=>{const b=e.target.closest(".nb");if(!b)return;openCat=openCat===b.dataset.cat?null:b.dataset.cat;renderNav()};
$("dropgrid").onclick=e=>{const b=e.target.closest(".sb");if(!b)return;openCat=null;go("#/"+SUBS[b.dataset.sub].cat+"/"+b.dataset.sub)};
document.addEventListener("click",e=>{if(openCat&&!e.composedPath().some(el=>el.tagName==="HEADER")){openCat=null;renderNav()}});

/* ---------- routing ---------- */
let cur={cat:"home",sub:"review"};
function go(h){if(location.hash===h)route();else location.hash=h}
function route(){
  const h=decodeURIComponent(location.hash.slice(2)).split("/");
  if(h[0]==="w"&&h[1]){const i=W.findIndex(w=>w.word.toLowerCase()===h[1].toLowerCase());if(i>=0){if(!S.list.length)S.list=[i];openStage(i);return}}
  if(h[0]==="s"){cur={cat:"search",sub:""};renderNav();viewSearch(h.slice(1).join("/"));return}
  const sub=SUBS[h[1]]?h[1]:(TAX.find(c=>c.key===h[0])||TAX[0]).subs[0].key;
  cur={cat:SUBS[sub].cat,sub};S.type="全部";closeStage(true);renderNav();render();window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- views ---------- */
function head(s,extra){return `<p class="crumb">${esc(s.catEn)} › ${esc(s.catZh)}</p><h2 class="title">${esc(s.zh)}</h2><p class="sub">${extra||""}</p>`}
function cardsHTML(idxs){
  if(!idxs.length)return '<p class="empty">這個分類還在收錄中，排程會自動補上。</p>';
  return '<div class="cards">'+idxs.map((i,n)=>{const w=W[i];const d=S.done[w.word];
    return `<button class="card${w.type!=="實用"?" game":""}" data-n="${n}"><span class="w">${esc(w.word)}</span><span class="k">${esc(w.kk)}</span><span class="z">${esc(w.zh)}</span>${w.spoiler?'<span class="spo">劇透</span>':`<span class="t">${esc(w.type==="實用"?w.cefr:w.type)}</span>`}${d?'<span class="done">已練 ✓</span>':""}</button>`}).join("")+'</div>';
}
function bindCards(root,idxs){root.querySelectorAll(".card").forEach(b=>b.onclick=()=>{S.list=idxs;openStage(idxs[+b.dataset.n])})}
function viewList(s){
  let idx=W.map((w,i)=>i).filter(i=>W[i].sub===s.key);
  const types=TYPES.filter(t=>t==="全部"||idx.some(i=>W[i].type===t));
  const shown=S.type==="全部"?idx:idx.filter(i=>W[i].type===S.type);
  $("main").innerHTML=head(s,`${idx.length} 個字・點卡片練發音`)+
    (types.length>2?`<div class="chips">${types.map(t=>`<button class="chip" data-t="${t}" aria-pressed="${S.type===t}">${t}</button>`).join("")}</div>`:"")+
    `<div class="acts" style="justify-content:flex-start;margin:0 0 14px"><button class="btn" id="runall">整類自動跟讀</button></div>`+cardsHTML(shown);
  $("main").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{S.type=c.dataset.t;viewList(s)});
  bindCards($("main"),shown);
  $("runall").onclick=()=>{if(!shown.length)return;S.list=shown;openStage(shown[0]);startAuto()};
}
function viewReview(s){
  const idx=DATA.review.map(w=>W.findIndex(x=>x.word===w)).filter(i=>i>=0);
  $("main").innerHTML=head(s,`${esc(DATA.review_label)}・每 4 小時換一批，從全部 ${W.length} 字中輪流挑選`)+
    `<div class="acts" style="justify-content:flex-start;margin:0 0 14px"><button class="btn pri" id="runall">開始跟讀這 ${idx.length} 個字</button></div>`+cardsHTML(idx);
  bindCards($("main"),idx);$("runall").onclick=()=>{S.list=idx;openStage(idx[0]);startAuto()};
}
function viewNew(s){
  const idx=W.map((w,i)=>i).sort((a,b)=>(W[b].added||"").localeCompare(W[a].added||"")||b-a).slice(0,48);
  $("main").innerHTML=head(s,"最近加入的 48 個字")+cardsHTML(idx);bindCards($("main"),idx);
}
function viewTraps(s){
  let h=head(s,"同一種發音陷阱放在一起練，效果最好。點字直接練。");
  Object.entries(TRAPS).forEach(([k,zh])=>{const idx=W.map((w,i)=>i).filter(i=>(W[i].traps||[]).includes(k));if(!idx.length)return;
    h+=`<div class="panel"><h3>${zh} <span class="sub" style="font-size:13px">${idx.length} 字</span></h3><div class="row">${idx.map(i=>`<button class="wchip" data-i="${i}" data-k="${k}">${esc(W[i].word)}</button>`).join("")}</div></div>`});
  $("main").innerHTML=h;
  $("main").querySelectorAll(".wchip").forEach(b=>b.onclick=()=>{const k=b.dataset.k;S.list=W.map((w,i)=>i).filter(i=>(W[i].traps||[]).includes(k));openStage(+b.dataset.i)});
}
function viewStats(s){
  const done=Object.keys(S.done).length;
  let h=head(s,"單字會依分類持續擴充，愈完整愈好。")+`<div class="kpis"><div class="kpi"><div class="big">${W.length}</div><span>已收錄單字</span></div>`+
    `<div class="kpi"><div class="big">${DATA.planned_total}</div><span>待收錄（規劃中）</span></div><div class="kpi"><div class="big">${done}</div><span>你已練過（這台裝置）</span></div>`+
    `<div class="kpi"><div class="big">${LES.length}</div><span>課程故事</span></div></div>`;
  TAX.filter(c=>c.key!=="home").forEach(c=>{h+=`<div class="panel"><h3>${c.en}・${c.zh}</h3>`+c.subs.filter(x=>!x.view).map(x=>{
    const n=countSub(x.key),p=(DATA.planned[x.key]||0),pct=Math.round(100*n/Math.max(1,n+p));
    return `<div class="stat"><a href="#/${c.key}/${x.key}" style="color:var(--ink)">${esc(x.zh)}</a><span class="sub" style="margin:0">${n} / ${n+p}</span><div class="bar" style="grid-column:1/-1"><i style="width:${pct}%"></i></div></div>`}).join("")+`</div>`});
  $("main").innerHTML=h;
}
function viewLessons(s){
  $("main").innerHTML=head(s,"原本的課程：每課一篇短文＋三個句型。點一課打開。")+LES.map((l,i)=>`<button class="panel lsn" data-l="${i}"><h3>${esc(l.title)}</h3><div class="sub" style="margin:0">${l.words.slice(0,8).map(esc).join("・")}…</div></button>`).join("");
  $("main").querySelectorAll(".lsn").forEach(b=>b.onclick=()=>viewLesson(s,+b.dataset.l));
}
function viewLesson(s,li){
  const l=LES[li];const idx=l.words.map(w=>W.findIndex(x=>x.word===w)).filter(i=>i>=0);
  $("main").innerHTML=`<p class="crumb">Guides › 課程故事</p><h2 class="title">${esc(l.title)}</h2><p class="sub"><a href="#/guides/lessons" style="color:var(--steel)">← 所有課程</a></p>`+
    `<div class="panel"><h3>短文朗讀</h3><p class="sub" style="margin:0 0 6px">點一句只念那一句；「整篇朗讀」會一句一句念並停頓讓你跟讀。</p><button class="btn" id="all">整篇朗讀</button><div id="story" style="margin-top:8px">${l.story.map((x,i)=>`<button class="sent" data-i="${i}">${esc(x.en)}<small>${esc(x.zh)}</small></button>`).join("")}</div></div>`+
    `<div class="panel"><h3>句型</h3>${l.patterns.map((p,i)=>`<div class="pat"><b>${esc(p.pattern)}</b><div class="d">${esc(p.usage)}</div><button data-i="${i}">🔊 ${esc(p.example_en)}</button><div class="d">${esc(p.example_zh)}</div></div>`).join("")}</div>`+
    `<h3 style="font-family:var(--title)">本課單字</h3>`+cardsHTML(idx);
  bindCards($("main"),idx);
  $("story").onclick=async e=>{const b=e.target.closest(".sent");if(!b)return;stop();b.classList.add("on");await speak(l.story[+b.dataset.i].en);b.classList.remove("on")};
  $("all").onclick=async()=>{stop();const my=++run;const els=[...document.querySelectorAll(".sent")];
    for(let i=0;i<els.length&&my===run;i++){els[i].classList.add("on");els[i].scrollIntoView({block:"nearest",behavior:"smooth"});await speak(l.story[i].en);if(my!==run)break;await wait(800+l.story[i].en.split(" ").length*420);els[i].classList.remove("on")}};
  $("main").querySelectorAll(".pat button").forEach(b=>b.onclick=()=>{stop();speak(l.patterns[+b.dataset.i].example_en)});
  window.scrollTo(0,0);
}
function viewGrammar(s){
  $("main").innerHTML=head(s,"所有課程的句型，依課次排列。點例句聽發音。")+LES.map(l=>`<div class="panel"><h3>${esc(l.title)}</h3>${l.patterns.map(p=>`<div class="pat"><b>${esc(p.pattern)}</b><div class="d">${esc(p.usage)}</div><button data-s="${esc(p.example_en)}">🔊 ${esc(p.example_en)}</button><div class="d">${esc(p.example_zh)}</div></div>`).join("")}</div>`).join("");
  $("main").querySelectorAll(".pat button").forEach(b=>b.onclick=()=>{stop();speak(b.dataset.s)});
}
function viewSearch(q){
  const t=q.trim().toLowerCase();
  const idx=t?W.map((w,i)=>i).filter(i=>{const w=W[i];return w.word.toLowerCase().includes(t)||w.zh.includes(q.trim())}):[];
  $("main").innerHTML=`<p class="crumb">搜尋</p><h2 class="title">「${esc(q)}」</h2><p class="sub">${idx.length} 個結果</p>`+(idx.length?cardsHTML(idx):'<p class="empty">找不到。可能還沒收錄，排程會持續擴充。</p>');
  bindCards($("main"),idx);
}
function render(){
  const s=SUBS[cur.sub];const v=s.view;
  if(v==="review")viewReview(s);else if(v==="new")viewNew(s);else if(v==="traps")viewTraps(s);else if(v==="stats")viewStats(s);
  else if(v==="lessons")viewLessons(s);else if(v==="grammar")viewGrammar(s);else viewList(s);
}
let qt;$("q").oninput=e=>{clearTimeout(qt);const v=e.target.value;qt=setTimeout(()=>{if(v.trim())go("#/s/"+encodeURIComponent(v.trim()));else go("#/home/review")},250)};

/* ---------- stage ---------- */
function openStage(i){
  S.idx=Math.max(0,S.list.indexOf(i));if(S.list.indexOf(i)<0){S.list=[i];S.idx=0}
  fillStage();$("veil").classList.add("open");$("stage").classList.add("open");
}
function closeStage(silent){if(!$("stage").classList.contains("open"))return;stop();$("veil").classList.remove("open");$("stage").classList.remove("open");if(!silent)render()}
function cw(){return W[S.list[S.idx]]}
function fillStage(){
  const w=cw(),s=SUBS[w.sub];
  $("pos").textContent=`${S.idx+1} / ${S.list.length}`;
  $("where").textContent=`${s.catEn} › ${s.zh}${w.lesson?`・第 ${w.lesson} 課`:""}`;
  $("word").innerHTML=w.syllables.map((x,i)=>`<span class="syl${i===w.stress_index?" stress":""}">${esc(x)}</span>`).join("");
  $("word").setAttribute("aria-label",w.word);
  $("kk").textContent=w.kk;$("ipa").textContent=w.ipa;$("pt").textContent=w.pos;$("zh").textContent=w.zh;
  $("tags").innerHTML=[w.type,w.cefr!=="—"?w.cefr:""].concat((w.traps||[]).map(k=>TRAPS[k])).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  $("tip").textContent="發音："+w.tip+(/[。！？]$/.test(w.tip)?"":"。");
  $("en").textContent=w.example_en;$("ez").textContent=w.example_zh;$("note").textContent=w.note||"";
  const ex=$("exwrap");ex.className=w.spoiler&&!S.shown[w.word]?"spoiler hid":"";
  ex.onclick=()=>{if(ex.classList.contains("hid")){S.shown[w.word]=1;ex.className=""}};
  const d=!!S.done[w.word];$("mark").setAttribute("aria-pressed",d);$("mark").textContent=d?"已練 ✓":"標記已練";
  const link=w.type==="實用"&&!(DATA.no_dictionary_link||[]).includes(w.word);
  $("cam").innerHTML=link?`<a href="https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${encodeURIComponent(w.word.toLowerCase().replace(/ /g,"-"))}" target="_blank" rel="noopener">劍橋字典（真人發音）↗</a>`:"遊戲專有名詞：機器發音僅供參考，以遊戲配音為準";
  history.replaceState(null,"","#/w/"+encodeURIComponent(w.word));
}
function beat(rate){const syl=[...document.querySelectorAll("#word .syl")];const per=Math.max(220,340/(rate||S.rate));
  syl.forEach((el,i)=>setTimeout(()=>{el.classList.add("beat");setTimeout(()=>el.classList.remove("beat"),per)},i*per))}
async function sayW(rate){beat(rate);await speak(cw().word,rate)}
function step(d){S.idx=(S.idx+d+S.list.length)%S.list.length;fillStage()}
$("pw").onclick=()=>{stop();sayW()};$("ps").onclick=()=>{stop();sayW(0.5)};
$("pe").onclick=()=>{const w=cw();if(w.spoiler&&!S.shown[w.word])return;stop();speak(w.example_en)};
$("prev").onclick=()=>{stop();step(-1)};$("next").onclick=()=>{stop();step(1)};
$("mark").onclick=()=>{const k=cw().word;if(S.done[k])delete S.done[k];else S.done[k]=1;store.set("done2",S.done);fillStage()};
$("close").onclick=()=>{closeStage();history.replaceState(null,"","#/"+cur.cat+"/"+cur.sub)};
$("veil").onclick=$("close").onclick;
document.addEventListener("keydown",e=>{if(!$("stage").classList.contains("open"))return;if(e.key==="Escape")$("close").onclick();if(e.key==="ArrowRight")$("next").onclick();if(e.key==="ArrowLeft")$("prev").onclick()});
function setAuto(on){$("auto").setAttribute("aria-pressed",on);$("auto").textContent=on?"停止跟讀":"自動跟讀"}
async function startAuto(){stop();const my=++run;setAuto(true);
  while(my===run){const w=cw();
    $("st").textContent="聽";await sayW();if(my!==run)break;
    $("st").textContent="換你念";await wait(1800);if(my!==run)break;
    $("st").textContent="慢速再聽一次";await sayW(0.5);if(my!==run)break;
    $("st").textContent="換你念";await wait(2000);if(my!==run)break;
    if(!(w.spoiler&&!S.shown[w.word])){$("st").textContent="例句";await speak(w.example_en);if(my!==run)break;
      $("st").textContent="換你念例句";await wait(1200+w.example_en.split(" ").length*450);if(my!==run)break}
    if(S.idx===S.list.length-1){$("st").textContent="這一組跑完一輪了";setAuto(false);break}
    step(1)}}
$("auto").onclick=()=>{if($("auto").getAttribute("aria-pressed")==="true")stop();else startAuto()};
document.querySelectorAll("[data-acc]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.acc===S.acc);
  b.onclick=()=>{S.acc=b.dataset.acc;store.set("acc",S.acc);document.querySelectorAll("[data-acc]").forEach(x=>x.setAttribute("aria-pressed",x===b));speak(cw().word)}});
$("rate").value=S.rate;$("rv").textContent=S.rate.toFixed(1)+"×";
$("rate").oninput=e=>{S.rate=+e.target.value;$("rv").textContent=S.rate.toFixed(1)+"×";store.set("rate",S.rate)};

$("meta").textContent=`${W.length} 字・更新 ${META.updated||""}`;
$("foot").innerHTML=`巫師3英文圖鑑・KK＋IPA 雙音標・每 4 小時自動更新<br>劇透內容預設模糊，點一下才顯示`;
if(!location.hash)history.replaceState(null,"","#/home/review");
route();
</script>
</body>
</html>
