<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4E7E0; --panel:#F1F3EE; --ink:#1F2B25; --muted:#5C6B62; --line:#C5CCC2;
  --steel:#355F7C; --steel-soft:#D5E1E9; --amber:#A8741C; --amber-soft:#F1E3C4; --done:#4F7254;
  --serif:"Gentium Book Plus","Charis SIL","Doulos SIL",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A17; --panel:#1C2420; --ink:#DCE3DB; --muted:#93A198; --line:#2F3A34;
    --steel:#8DB2CC; --steel-soft:#22313B; --amber:#DDAB4E; --amber-soft:#3A2F19; --done:#8CB891;
  }
}
:root[data-theme="dark"]{
  --bg:#141A17; --panel:#1C2420; --ink:#DCE3DB; --muted:#93A198; --line:#2F3A34;
  --steel:#8DB2CC; --steel-soft:#22313B; --amber:#DDAB4E; --amber-soft:#3A2F19; --done:#8CB891;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

/* controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0 12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1 1 100%}
.ctl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select{font:inherit;font-size:14px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:4px 10px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--steel);color:var(--panel)}
input[type=range]{accent-color:var(--steel);width:110px}
.rate-val{font-variant-numeric:tabular-nums;min-width:3.2em;color:var(--ink)}

/* stage: the one bold element */
.stage{margin:20px 0 8px;padding:28px 20px 22px;background:var(--panel);border-radius:14px;border:1px solid var(--line);text-align:center}
.pos{font-size:13px;color:var(--muted)}
.word{font-family:var(--serif);font-size:clamp(46px,13vw,84px);line-height:1.15;margin:18px 0 6px;display:flex;justify-content:center;flex-wrap:wrap;gap:0}
.syl{position:relative;padding:0 .04em;color:var(--muted);transition:color .15s}
.syl + .syl::before{content:"·";color:var(--line);padding:0 .06em;font-weight:400}
.syl.stress{color:var(--ink);font-weight:700}
.syl.stress::after{content:"";position:absolute;left:50%;top:-.02em;width:.16em;height:.16em;margin-left:-.08em;border-radius:50%;background:var(--amber)}
.syl.beat{color:var(--steel)}
.syl.stress.beat{color:var(--amber)}
.phon{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--serif);font-size:22px}
.phon span small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-right:6px;vertical-align:middle}
.meaning{margin-top:6px;font-size:18px}
.meaning .pos-tag{color:var(--muted);font-size:14px;margin-right:6px}
.tip{margin:14px auto 0;max-width:30em;background:var(--amber-soft);border-radius:8px;padding:8px 12px;font-size:15px;text-align:left}
.sentence{margin:16px auto 0;max-width:32em;font-family:var(--serif);font-size:20px}
.sentence .zh{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:9px 16px;font-size:15px;min-height:44px}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--panel);font-weight:700}
.btn[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--panel)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}
.nav .btn{min-width:84px}
.mark{font-size:14px}
.mark[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--panel)}
.status{min-height:1.6em;margin-top:10px;font-size:14px;color:var(--steel)}

/* lists */
h2{font-size:17px;margin:34px 0 10px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;text-align:left;background:none;border:0;padding:10px 4px}
.row .w{font-family:var(--serif);font-size:20px}
.row .k{font-family:var(--serif);color:var(--muted);font-size:16px;margin-left:8px}
.row .m{font-size:14px;color:var(--muted);grid-column:1/2}
.row .ok{grid-row:1/3;grid-column:2;align-self:center;font-size:13px;color:var(--done);font-weight:700}
.row[aria-current="true"]{background:var(--steel-soft)}
.row.game .w{color:var(--muted)}

.story p{margin:0}
.sent{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;font-family:var(--serif);font-size:19px;line-height:1.5}
.sent small{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.sent.on{border-left-color:var(--steel);background:var(--steel-soft)}
.pat{padding:10px 4px;border-bottom:1px solid var(--line)}
.pat b{font-family:var(--serif);font-size:19px}
.pat .d{font-size:14px;color:var(--muted)}
.pat button{margin-top:6px;background:none;border:0;padding:4px 0;text-align:left;font-family:var(--serif);font-size:18px;color:var(--steel)}
.warn{background:var(--amber-soft);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px;display:none}
@media (prefers-reduced-motion:reduce){.syl{transition:none}}
</style>
</head>

</div>

/* storage (per-viewer convenience) */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let state={lesson:store.get("lesson",0),idx:0,rate:store.get("rate",0.8),acc:store.get("acc","en-US"),done:store.get("done",{})};
if(!LESSONS[state.lesson]) state.lesson=0;
const $=id=>document.getElementById(id);
const L=()=>LESSONS[state.lesson];

/* speech */
const synth=window.speechSynthesis;
let voices=[];
function loadVoices(){ if(!synth) return; voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)); $("warn").style.display=(synth.getVoices().length && !voices.length)?"block":"none"; }
if(synth){ loadVoices(); synth.onvoiceschanged=loadVoices; } else { $("warn").style.display="block"; }
function pickVoice(){
  const want=state.acc.toLowerCase();
  const m=voices.filter(v=>v.lang.replace("_","-").toLowerCase()===want);
  const pref=m.find(v=>/samantha|google us|daniel|google uk|aria|jenny|libby|sonia|natural/i.test(v.name));
  return pref||m[0]||voices[0]||null;
}
let runId=0;
const NAME_SAY={"Geralt": "Gairalt", "Ciri": "Siri", "Yennefer": "Yennifer", "Vesemir": "Vessemeer", "Aard": "Ard", "Igni": "Ignee", "Yrden": "Eerden", "Quen": "Kwen", "Axii": "Axee"};
const NAME_RE=Object.keys(NAME_SAY).length?new RegExp("\\b("+Object.keys(NAME_SAY).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g"):null;
function fixNames(t){return NAME_RE?t.replace(NAME_RE,m=>NAME_SAY[m]):t}
function speak(text,rate){
  text=fixNames(text);
  return new Promise(res=>{
    if(!synth){res();return;}
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(); if(v){u.voice=v;u.lang=v.lang}else{u.lang=state.acc}
    u.rate=rate||state.rate; u.onend=res; u.onerror=res;
    synth.speak(u);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function stopAll(){ runId++; if(synth) synth.cancel(); setAuto(false); status(""); document.querySelectorAll(".sent.on").forEach(e=>e.classList.remove("on")); }
function status(t){$("status").textContent=t}

function beat(rate){
  const syls=[...document.querySelectorAll("#word .syl")];
  const per=Math.max(220,340/(rate||state.rate));
  syls.forEach((el,i)=>{ setTimeout(()=>{el.classList.add("beat");setTimeout(()=>el.classList.remove("beat"),per)},i*per); });
}
async function sayWord(rate){ const w=L().words[state.idx]; beat(rate); await speak(w.w,rate); }

/* render */
function renderStage(){
  const w=L().words[state.idx], n=L().words.length;
  $("pos").textContent=`${state.idx+1} / ${n}`;
  $("word").innerHTML=w.s.map((s,i)=>`<span class="syl${i===w.st?" stress":""}">${s}</span>`).join("");
  $("word").setAttribute("aria-label",w.w);
  $("kk").textContent=w.kk; $("ipa").textContent=w.ipa;
  $("ptag").textContent=w.p; $("zh").textContent=w.zh;
  $("tip").textContent=w.tip; $("sen").textContent=w.en; $("senzh").textContent=w.ez;
  const key=L().id+":"+w.w, d=!!state.done[key];
  $("mark").setAttribute("aria-pressed",d); $("mark").textContent=d?"已練 ✓":"標記已練";
  document.querySelectorAll(".row").forEach((r,i)=>r.setAttribute("aria-current",i===state.idx));
}
function renderList(){
  $("list").innerHTML=L().words.map((w,i)=>{
    const d=state.done[L().id+":"+w.w];
    return `<li><button class="row${w.game?" game":""}" data-i="${i}"><span><span class="w">${w.w}</span><span class="k">${w.kk}</span></span><span class="m">${w.zh}</span><span class="ok">${d?"已練":""}</span></button></li>`;
  }).join("");
}
function renderStory(){
  $("story").innerHTML=L().story.map((s,i)=>`<button class="sent" data-i="${i}">${s[0]}<small>${s[1]}</small></button>`).join("");
  $("pats").innerHTML=L().patterns.map((p,i)=>`<div class="pat"><b>${p.p}</b><div class="d">${p.d}</div><button data-i="${i}">🔊 ${p.en}</button><div class="d">${p.ez}</div></div>`).join("");
}
function renderAll(){ $("lesson").value=state.lesson; renderList(); renderStory(); renderStage(); }

/* controls */
$("lesson").innerHTML=LESSONS.map((l,i)=>`<option value="${i}">${l.title}</option>`).join("");
$("lesson").onchange=e=>{stopAll();state.lesson=+e.target.value;state.idx=0;store.set("lesson",state.lesson);renderAll()};
$("rate").value=state.rate; $("rateVal").textContent=state.rate+"×";
$("rate").oninput=e=>{state.rate=+e.target.value;$("rateVal").textContent=state.rate.toFixed(1)+"×";store.set("rate",state.rate)};
document.querySelectorAll("[data-acc]").forEach(b=>{
  b.setAttribute("aria-pressed",b.dataset.acc===state.acc);
  b.onclick=()=>{state.acc=b.dataset.acc;store.set("acc",state.acc);document.querySelectorAll("[data-acc]").forEach(x=>x.setAttribute("aria-pressed",x===b));speak(L().words[state.idx].w)};
});
$("playWord").onclick=()=>{stopAll();sayWord()};
$("playSlow").onclick=()=>{stopAll();sayWord(0.5)};
$("playSen").onclick=()=>{stopAll();speak(L().words[state.idx].en)};
function go(d){state.idx=(state.idx+d+L().words.length)%L().words.length;renderStage()}
$("prev").onclick=()=>{stopAll();go(-1)};
$("next").onclick=()=>{stopAll();go(1)};
$("mark").onclick=()=>{const k=L().id+":"+L().words[state.idx].w;if(state.done[k])delete state.done[k];else state.done[k]=1;store.set("done",state.done);renderList();renderStage()};
$("list").onclick=e=>{const b=e.target.closest(".row");if(!b)return;stopAll();state.idx=+b.dataset.i;renderStage();sayWord();window.scrollTo({top:0,behavior:"smooth"})};

/* auto shadowing: word → pause → slow → pause → sentence → pause → next */
function setAuto(on){ $("auto").setAttribute("aria-pressed",on); $("auto").textContent=on?"停止跟讀":"自動跟讀"; }
$("auto").onclick=async()=>{
  if($("auto").getAttribute("aria-pressed")==="true"){stopAll();return;}
  stopAll(); const my=++runId; setAuto(true);
  while(my===runId){
    const w=L().words[state.idx];
    status("聽"); await sayWord(); if(my!==runId)break;
    status("換你念"); await wait(1800); if(my!==runId)break;
    status("慢速再聽一次"); await sayWord(0.5); if(my!==runId)break;
    status("換你念"); await wait(2000); if(my!==runId)break;
    status("例句"); await speak(w.en); if(my!==runId)break;
    status("換你念例句"); await wait(1200+w.en.split(" ").length*450); if(my!==runId)break;
    if(state.idx===L().words.length-1){status("這一課跑完一輪了");setAuto(false);break;}
    go(1);
  }
};

/* story */
$("story").onclick=async e=>{const b=e.target.closest(".sent");if(!b)return;stopAll();b.classList.add("on");await speak(L().story[+b.dataset.i][0]);b.classList.remove("on")};
$("storyAll").onclick=async()=>{
  stopAll(); const my=++runId; const els=[...document.querySelectorAll(".sent")];
  for(let i=0;i<els.length&&my===runId;i++){
    els[i].classList.add("on"); els[i].scrollIntoView({block:"nearest",behavior:"smooth"});
    await speak(L().story[i][0]); if(my!==runId)break;
    await wait(800+L().story[i][0].split(" ").length*420);
    els[i].classList.remove("on");
  }
};
$("pats").onclick=e=>{const b=e.target.closest("button");if(!b)return;stopAll();speak(L().patterns[+b.dataset.i].en)};

renderAll();
</script>
