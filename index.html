<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>巫師3英文圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almendra:wght@400;700&family=Gentium+Book+Plus:ital,wght@0,400;0,700;1,400&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#111214; --bg2:#16171a; --panel:#1b1c20; --panel2:#222328; --line:#34353b; --line2:#47484f;
  --ink:#ece6d8; --muted:#9d988d; --faint:#6e6a62;
  --gold:#caa65e; --gold-soft:#3a3122; --blood:#b4493a; --blood-soft:#3a1f1b; --moss:#8fae7c; --steel:#8fb3cc;
  --title:"Almendra","Palatino Linotype","Book Antiqua",Georgia,serif;
  --serif:"Gentium Book Plus","Charis SIL","Doulos SIL",Georgia,"Times New Roman","Lucida Grande","Arial Unicode MS","Noto Serif","DejaVu Serif",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;
  background:radial-gradient(1200px 500px at 50% -120px,#26272c 0%,rgba(17,18,20,0) 70%),var(--bg);
  padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}

/* header + nav */
header{position:sticky;top:0;z-index:20;background:rgba(17,18,20,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.brand{font-family:var(--title);font-size:24px;letter-spacing:.02em;margin:0;flex:1 1 auto;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:8px;letter-spacing:0}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px 8px 34px;font-size:15px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.6}
nav{display:flex;gap:10px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;font-family:var(--title);font-size:18px;letter-spacing:.03em;line-height:1.1}
.nb small{display:block;font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:0;margin-top:2px;text-align:left}
.nb .chev{width:12px;height:12px;opacity:.7;transition:transform .15s}
.nb[aria-expanded="true"]{border-color:var(--gold);background:var(--panel2)}
.nb[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nb.cur{border-color:var(--line2);box-shadow:inset 0 -2px 0 var(--gold)}
.drop{display:none;border-top:1px solid var(--line);background:var(--bg2);padding:12px 0 14px}
.drop.open{display:block}
.drop .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sb{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px}
.sb:hover,.sb.cur{border-color:var(--gold)}
.sb .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* page */
main{padding:18px 0 60px}
.crumb{font-size:13px;color:var(--muted);margin:0 0 4px}
h2.title{font-family:var(--title);font-size:30px;margin:0 0 4px;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 12px;min-height:88px}
.card:hover{border-color:var(--line2);background:var(--panel2)}
.card .w{font-family:var(--serif);font-size:21px;line-height:1.2;display:block;padding-right:22px}
.card .k{font-family:var(--serif);color:var(--muted);font-size:14px;display:block}
.card .z{font-size:14px;display:block;margin-top:2px}
.card .t{position:absolute;right:10px;top:10px;font-size:11px;color:var(--faint)}
.card.game .w{color:#cfc6b0}
.card .done{position:absolute;right:10px;bottom:8px;font-size:12px;color:var(--moss)}
.card .spo{position:absolute;right:10px;top:10px;font-size:11px;color:var(--blood)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* practice stage (drawer) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.veil.open{display:block}
.stage{position:fixed;z-index:31;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:92vh;overflow:auto;
  background:var(--bg2);border:1px solid var(--line2);border-bottom:0;border-radius:16px 16px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom,0px));
  transition:transform .22s ease;text-align:center}
.stage.open{transform:translate(-50%,0)}
.stage .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:26px;color:var(--muted);line-height:1;padding:6px}
.stage .pos{font-size:12px;color:var(--muted)}
.stage .where{font-size:12px;color:var(--faint)}
.bigword{font-family:var(--serif);font-size:clamp(40px,11vw,74px);line-height:1.15;margin:14px 0 6px;display:flex;justify-content:center;flex-wrap:wrap}
.syl{position:relative;padding:0 .04em;color:var(--muted);transition:color .15s}
.syl + .syl::before{content:"·";color:var(--line2);padding:0 .06em;font-weight:400}
.syl.stress{color:var(--ink);font-weight:700}
.syl.stress::after{content:"";position:absolute;left:50%;top:-.02em;width:.15em;height:.15em;margin-left:-.075em;border-radius:50%;background:var(--gold)}
.syl.beat{color:var(--steel)}
.syl.stress.beat{color:var(--gold)}
.phon{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-family:var(--serif);font-size:21px}
.phon small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-right:6px;vertical-align:middle}
.mean{margin-top:4px;font-size:18px}
.mean .pt{color:var(--muted);font-size:14px;margin-right:6px}
.tags{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;border:1px solid var(--line2);border-radius:999px;padding:1px 8px;color:var(--muted)}
.tip{margin:12px auto 0;max-width:32em;background:var(--gold-soft);border-left:3px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:15px;text-align:left}
.ex{margin:14px auto 0;max-width:32em;font-family:var(--serif);font-size:20px}
.ex .zh{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.note{margin:10px auto 0;max-width:32em;font-size:14px;color:var(--muted);text-align:left}
.spoiler{position:relative;cursor:pointer}
.spoiler.hid > *{filter:blur(7px);user-select:none}
.spoiler.hid::after{content:"⚠ 劇透內容・點一下顯示";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--sans);font-size:13px;color:var(--ink);background:rgba(58,31,27,.55);border:1px dashed var(--blood);border-radius:6px}
.acts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:999px;padding:9px 16px;font-size:15px;min-height:44px}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#16130c;font-weight:700}
.btn[aria-pressed="true"]{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.ok[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#101410}
.status{min-height:1.5em;margin-top:8px;font-size:14px;color:var(--steel)}
.nav2{display:flex;justify-content:space-between;gap:8px;margin-top:10px}
.cam{font-size:12px;color:var(--muted);margin-top:10px}
.cam a{color:var(--steel)}
.ctl{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:3px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--steel);color:#0e1418}
input[type=range]{accent-color:var(--gold);width:100px}

/* other views */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.panel h3{font-family:var(--title);font-size:20px;margin:0 0 6px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:6px}
.wchip{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-family:var(--serif);font-size:16px}
.wchip:hover{border-color:var(--gold)}
.bar{height:8px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold)}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin-bottom:10px;font-size:14px}
.big{font-family:var(--title);font-size:40px;line-height:1;color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.sent{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:8px 10px;font-family:var(--serif);font-size:19px;line-height:1.5}
.sent small{display:block;font-family:var(--sans);font-size:14px;color:var(--muted)}
.sent.on{border-left-color:var(--gold);background:var(--gold-soft)}
.pat{padding:10px 0;border-bottom:1px solid var(--line)}
.pat b{font-family:var(--serif);font-size:18px}
.pat .d{font-size:14px;color:var(--muted)}
.pat button{margin-top:4px;background:none;border:0;padding:4px 0;text-align:left;font-family:var(--serif);font-size:17px;color:var(--steel)}
.lsn{display:block;width:100%;text-align:left}
.warn{display:none;background:var(--blood-soft);border:1px solid var(--blood);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px}
/* SRS */
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.gb{border:1px solid var(--line2);background:var(--panel);border-radius:10px;padding:8px 4px;font-size:15px;min-height:54px;line-height:1.25}
.gb small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.gb.g0{border-color:var(--blood)}.gb.g0:hover{background:var(--blood-soft)}
.gb.g2{border-color:var(--gold)}.gb.g2:hover{background:var(--gold-soft)}
.gb.g3{border-color:var(--moss)}
.reveal{display:none;margin-top:14px}
.stage.quiz .mean,.stage.quiz .tags,.stage.quiz .tip,.stage.quiz #ez,.stage.quiz #note,.stage.quiz .grade,.stage.quiz .where{visibility:hidden;height:0;margin:0;padding:0;overflow:hidden}
.stage.quiz .reveal{display:inline-flex}
.srsinfo{font-size:12px;color:var(--faint);margin-top:8px;min-height:1.2em}
.btn.fv[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.card .done.due{color:var(--steel)}
.card .done.bad{color:var(--blood)}
.card .w .fv{font-style:normal;color:var(--gold);font-size:14px;margin-left:4px;vertical-align:middle}
h3.sec{font-family:var(--title);font-size:20px;margin:22px 0 8px}
.flash{border-color:var(--moss);font-size:15px}
.spark{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:16px;margin-top:6px}
.spark i{flex:1;background:var(--gold);border-radius:3px 3px 0 0;min-height:3px;position:relative}
.spark i.z{background:var(--line)}
.spark i.st{background:var(--steel)}
.spark i em{position:absolute;bottom:100%;left:-4px;right:-4px;text-align:center;font-style:normal;font-size:10px;color:var(--muted);line-height:1.4}
.sparkx{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:4px}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--bg2);margin-top:6px}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend b{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* scenes */
.dl .who{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);letter-spacing:.02em}
.dl.me{border-left-color:var(--line2)}
.dl.me .who{color:var(--gold)}
.dl.me.on{border-left-color:var(--gold)}
.scx{margin:14px auto 0;max-width:32em;text-align:left}
.scxh{font-size:12px;color:var(--muted);margin-bottom:2px}
.scx .sent{font-size:17px;padding:6px 10px}
.scl{font-size:13px;color:var(--steel)}
.stage.quiz .scx small{visibility:hidden}
a.card{text-decoration:none;color:inherit}
footer{color:var(--faint);font-size:12px;text-align:center;padding:20px 0 40px}
@media (max-width:560px){
  .brand{font-size:20px}
  .nb{font-size:16px;padding:7px 11px}
  h2.title{font-size:25px}
  .cards{grid-template-columns:1fr 1fr}
  .card .w{font-size:18px}
}
@media (prefers-reduced-motion:reduce){.stage,.syl,.nb .chev{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1 class="brand">Witcher English <small id="meta"></small></h1>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜尋英文或中文…" autocomplete="off" aria-label="搜尋單字"></label>
    </div>
    <nav id="nav" aria-label="分類"></nav>
  </div>
  <div class="drop" id="drop"><div class="wrap"><div class="grid" id="dropgrid"></div></div></div>
</header>

<main class="wrap" id="main"></main>
<div class="wrap"><div class="warn" id="warn">這個瀏覽器沒有英文語音。請改用 Safari（iPhone/iPad/Mac）或 Chrome，或在手機設定中下載英文語音。</div></div>
<footer id="foot"></footer>

<div class="veil" id="veil"></div>
<section class="stage" id="stage" role="dialog" aria-modal="true" aria-label="單字練習">
  <button class="x" id="close" aria-label="關閉">×</button>
  <div class="pos" id="pos"></div>
  <div class="where" id="where"></div>
  <div class="bigword" id="word"></div>
  <div class="phon"><span><small>KK</small><span id="kk"></span></span><span><small>IPA</small><span id="ipa"></span></span></div>
  <div class="mean"><span class="pt" id="pt"></span><span id="zh"></span></div>
  <div class="tags" id="tags"></div>
  <div class="tip" id="tip"></div>
  <div id="exwrap"><div class="ex"><span id="en"></span><span class="zh" id="ez"></span></div><div class="note" id="note"></div></div>
  <div class="scx" id="scx"></div>
  <div class="acts">
    <button class="btn pri" id="pw">聽單字</button>
    <button class="btn" id="ps">慢速</button>
    <button class="btn" id="pe">聽例句</button>
    <button class="btn" id="auto" aria-pressed="false">自動跟讀</button>
  </div>
  <div class="status" id="st" aria-live="polite"></div>
  <button class="btn pri reveal" id="reveal">顯示答案（空白鍵）</button>
  <div class="grade" id="grade" aria-label="記憶評分">
    <button class="gb g0" data-g="0">忘了<small></small></button>
    <button class="gb g1" data-g="1">模糊<small></small></button>
    <button class="gb g2" data-g="2">記得<small></small></button>
    <button class="gb g3" data-g="3">很熟<small></small></button>
  </div>
  <div class="srsinfo" id="srsinfo"></div>
  <div class="nav2">
    <button class="btn" id="prev">上一個</button>
    <button class="btn fv" id="fav" aria-pressed="false">☆ 收藏</button>
    <button class="btn" id="next">下一個</button>
  </div>
  <div class="ctl">
    <span>口音 <span class="seg"><button data-acc="en-US">美式</button><button data-acc="en-GB">英式</button></span></span>
    <label>語速 <input id="rate" type="range" min="0.5" max="1.2" step="0.1"> <span id="rv"></span></label>
  </div>
  <div class="cam" id="cam"></div>
</section>

:"","lesson":null,"added":"2026-10-08"},{"word":"ally","kk":"[ˋælaɪ]","ipa":"/ˈæl.aɪ/","syllables":["al","ly"],"stress_index":0,"tip":"y 念 [aɪ]，不是 [i]；別和 alley [ˋælɪ]（小巷）搞混","pos":"n.","zh":"盟友","example_en":"We need every ally we can find.","example_zh":"我們需要找到的每一個盟友。","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":["confusable"],"spoiler":false,"note":"主線後段要找盟友，誰會來幫忙取決於你先前的支線選擇。","lesson":null,"added":"2026-10-08"},{"word":"side with","kk":"[ˋsaɪd wɪð]","ipa":"/ˈsaɪd wɪð/","syllables":["side","with"],"stress_index":0,"tip":"side 的 d 要收輕輕的音，不要多加「的」；with 的 th 是有聲 [ð]","pos":"phr.","zh":"站在…那一邊","example_en":"Will you side with the elves?","example_zh":"你會站在精靈那邊嗎？","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":["th","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"neutral","kk":"[ˋnjutrəl]","ipa":"/ˈnuː.trəl/","syllables":["neu","tral"],"stress_index":0,"tip":"美式 neu 念 [nu]，不是「紐」加 [j]；尾巴 -tral 很輕，不要念成「抽」","pos":"adj.","zh":"中立的","example_en":"Witchers try to stay neutral.","example_zh":"獵魔士盡量保持中立。","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":["taiwan"],"spoiler":false,"note":"獵魔士照傳統不介入政治，但遊戲常常逼你選邊。","lesson":null,"added":"2026-10-08"},{"word":"conscience","kk":"[ˋkɑnʃəns]","ipa":"/ˈkɑːn.ʃəns/","syllables":["con","science"],"stress_index":0,"tip":"sci 念 [ʃ]，不是 science 的 [saɪ]；只有兩個音節","pos":"n.","zh":"良心","example_en":"My conscience tells me to help her.","example_zh":"我的良心叫我幫她。","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":[],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"intervene","kk":"[ˌɪntɚˋvin]","ipa":"/ˌɪn.t̬ɚˈviːn/","syllables":["in","ter","vene"],"stress_index":2,"tip":"重音在最後 VENE，念長音 [vin]；v 要上齒碰下唇，不是 [b] 或 [w]","pos":"v.","zh":"介入；插手","example_en":"Should Geralt intervene in the fight?","example_zh":"傑洛特該插手這場打鬥嗎？","type":"實用","cefr":"C1","cat":"guides","sub":"choices","traps":["stress","vowel"],"spoiler":false,"note":"路上看到有人被欺負時，常會跳出要不要介入的選項。","lesson":null,"added":"2026-10-08"},{"word":"decline","kk":"[dɪˋklaɪn]","ipa":"/dɪˈklaɪn/","syllables":["de","cline"],"stress_index":1,"tip":"重音在後面 CLINE；de 很短念 [dɪ]，不要念成「低」","pos":"v.","zh":"婉拒","example_en":"You can decline the contract.","example_zh":"你可以婉拒這份委託。","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":["stress","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"agree","kk":"[əˋgri]","ipa":"/əˈɡriː/","syllables":["a","gree"],"stress_index":1,"tip":"開頭 a 是輕輕的 [ə]；重音在 GREE，長音 [i]","pos":"v.","zh":"同意","example_en":"Do you agree to help us?","example_zh":"你同意幫我們嗎？","type":"實用","cefr":"A2","cat":"guides","sub":"choices","traps":["stress","vowel"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"hesitate","kk":"[ˋhɛzəˌtet]","ipa":"/ˈhez.ə.teɪt/","syllables":["hes","i","tate"],"stress_index":0,"tip":"s 念 [z]，不是 [s]；重音在第一音節 HES","pos":"v.","zh":"猶豫","example_en":"Do not hesitate, witcher. Choose.","example_zh":"別猶豫，獵魔人，選吧。","type":"實用","cefr":"B1","cat":"guides","sub":"choices","traps":["stress"],"spoiler":false,"note":"有些對話選項有時間限制，猶豫太久會自動選預設。","lesson":null,"added":"2026-10-08"},{"word":"obey","kk":"[əˋbe]","ipa":"/oʊˈbeɪ/","syllables":["o","bey"],"stress_index":1,"tip":"重音在後面 BEY；ey 念 [e]，和 they 押韻","pos":"v.","zh":"服從","example_en":"The soldiers obey the Emperor.","example_zh":"士兵服從皇帝。","type":"實用","cefr":"B1","cat":"guides","sub":"choices","traps":["stress","th","vowel"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"guilt","kk":"[gɪlt]","ipa":"/ɡɪlt/","syllables":["guilt"],"stress_index":0,"tip":"u 不發音，念 [gɪlt]，和 gilt 同音；i 是短 [ɪ]","pos":"n.","zh":"罪惡感；有罪","example_en":"He lives with his guilt.","example_zh":"他帶著罪惡感活著。","type":"實用","cefr":"B2","cat":"guides","sub":"choices","traps":["silent","homophone"],"spoiler":false,"note":"形容詞 guilty 已收錄。","lesson":null,"added":"2026-10-08"},{"word":"innocent","kk":"[ˋɪnəsn̩t]","ipa":"/ˈɪn.ə.sənt/","syllables":["in","no","cent"],"stress_index":0,"tip":"重音在第一音節 IN；後面兩個音節都弱化，不要念成「伊諾森特」","pos":"adj.","zh":"無辜的","example_en":"The girl is innocent.","example_zh":"那個女孩是無辜的。","type":"實用","cefr":"B1","cat":"guides","sub":"choices","traps":["stress","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"justice","kk":"[ˋdʒʌstɪs]","ipa":"/ˈdʒʌs.tɪs/","syllables":["jus","tice"],"stress_index":0,"tip":"u 念 [ʌ]，不是 [u]；結尾 -tice 念 [tɪs]，不是 [taɪs]","pos":"n.","zh":"正義；公道","example_en":"The villagers want justice.","example_zh":"村民想討回公道。","type":"實用","cefr":"B1","cat":"guides","sub":"choices","traps":["vowel"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"},{"word":"punish","kk":"[ˋpʌnɪʃ]","ipa":"/ˈpʌn.ɪʃ/","syllables":["pun","ish"],"stress_index":0,"tip":"u 念 [ʌ]（和 fun 一樣）；結尾 sh 嘴唇嘟起，不要加「ㄒㄩ」","pos":"v.","zh":"懲罰","example_en":"Will you punish the thief?","example_zh":"你要懲罰那個小偷嗎？","type":"實用","cefr":"B1","cat":"guides","sub":"choices","traps":["vowel","taiwan"],"spoiler":false,"note":"","lesson":null,"added":"2026-10-08"}],"lessons":[{"n":1,"title":"第 1 課　新手指南","added":"2026-09-26","story":[{"en":"Welcome to The Witcher 3!","zh":"歡迎來到巫師3！"},{"en":"You are Geralt, a monster hunter.","zh":"你是傑洛特，一名怪物獵人。"},{"en":"Here are some easy tips for new players.","zh":"這裡是給新手的幾個簡單技巧。"},{"en":"In a fight, dodge more and roll less.","zh":"戰鬥時，多閃避，少翻滾。"},{"en":"A dodge is fast, so you can attack again quickly.","zh":"閃避很快，所以你能很快再次攻擊。"},{"en":"Use your Signs.","zh":"記得使用法印。"},{"en":"Quen gives you a shield, and Igni makes fire.","zh":"昆恩給你護盾，伊格尼能放火。"},{"en":"Fire does a lot of damage to beasts.","zh":"火對野獸造成很多傷害。"},{"en":"Every monster has a weakness.","zh":"每種怪物都有弱點。"},{"en":"Before you fight, read the bestiary and prepare the right oil.","zh":"戰鬥前，先讀怪物圖鑑，準備對的劍油。"},{"en":"Explore the world and pick up ingredients.","zh":"探索世界、撿拾材料。"},{"en":"You need them to make potions.","zh":"做藥水需要它們。"},{"en":"Side quests give good rewards, so don't only play the main quest.","zh":"支線任務的獎勵很好，所以別只玩主線。"}],"patterns":[{"pattern":"Use + A + against + B","usage":"對 B 使用 A（攻略最常見的祈使句）","example_en":"Use Igni against beasts.","example_zh":"對野獸使用伊格尼法印。"},{"pattern":"It's better to + V","usage":"最好做某事；做…比較好","example_en":"It's better to dodge than to roll.","example_zh":"閃避比翻滾好。"},{"pattern":"Before + 句子/名詞, + 祈使句","usage":"在…之前，先做…","example_en":"Before you fight, read the bestiary.","example_zh":"戰鬥之前，先讀怪物圖鑑。"}],"words":["dodge","roll","enemy","attack","damage","shield","weakness","prepare","explore","ingredient","reward","Sign","bestiary"]},{"n":2,"title":"第 2 課　主要角色","added":"2026-09-26","story":[{"en":"Let's meet the main characters.","zh":"來認識主要角色吧。"},{"en":"Geralt of Rivia is a witcher.","zh":"利維亞的傑洛特是一名獵魔士。"},{"en":"He kills monsters for money.","zh":"他靠獵殺怪物賺錢。"},{"en":"Ciri is Geralt's adopted daughter.","zh":"希里是傑洛特的養女。"},{"en":"She is brave and very powerful.","zh":"她勇敢又非常強大。"},{"en":"The Wild Hunt wants her, so she is in danger.","zh":"狂獵想抓她，所以她有危險。"},{"en":"Geralt is looking for her.","zh":"傑洛特正在尋找她。"},{"en":"Yennefer is a sorceress.","zh":"葉妮芙是一名女術士。"},{"en":"She loves Geralt, and she helps him search for Ciri.","zh":"她愛著傑洛特，也幫他搜尋希里。"},{"en":"Triss is also a sorceress. She is Geralt's old friend.","zh":"特莉絲也是女術士，是傑洛特的老朋友。"},{"en":"Dandelion is a bard. He writes songs about Geralt's adventures.","zh":"丹德里恩是吟遊詩人，他寫關於傑洛特冒險的歌。"},{"en":"Vesemir is the oldest witcher. He was Geralt's teacher, and he is very loyal.","zh":"維瑟米爾是最年長的獵魔士，他是傑洛特的老師，而且非常忠誠。"}],"patterns":[{"pattern":"A is B's + 名詞","usage":"A 是 B 的…（所有格 's）","example_en":"Ciri is Geralt's adopted daughter.","example_zh":"希里是傑洛特的養女。"},{"pattern":"be + looking for + 人/物","usage":"正在尋找…（現在進行式）","example_en":"Geralt is looking for Ciri.","example_zh":"傑洛特正在尋找希里。"},{"pattern":"one of the most + 形容詞 + 複數名詞","usage":"最…的之一","example_en":"Yennefer is one of the most powerful sorceresses.","example_zh":"葉妮芙是最強大的女術士之一。"}],"words":["character","daughter","adopted","brave","powerful","danger","look for","search","loyal","adventure","witcher","sorceress","bard","Geralt","Ciri","Yennefer","Triss","Dandelion","Vesemir"]},{"n":3,"title":"第 3 課　怪物圖鑑","added":"2026-09-26","story":[{"en":"Let's open the bestiary.","zh":"來打開怪物圖鑑吧。"},{"en":"Drowners live near water.","zh":"水鬼住在水邊。"},{"en":"People say they come from the corpses of people who drowned.","zh":"據說它們來自溺死者的屍體。"},{"en":"They are not very strong, but they are dangerous in groups.","zh":"它們不算很強，但成群時很危險。"},{"en":"Drowners are weak against fire, so burn them with Igni.","zh":"水鬼怕火，所以用伊格尼燒它們。"},{"en":"Underwater, your sword doesn't work. Use your crossbow.","zh":"在水下，劍沒有用，要用十字弓。"},{"en":"Griffins are big flying creatures.","zh":"獅鷲是會飛的大型生物。"},{"en":"A griffin has the body of a lion and the head of an eagle.","zh":"獅鷲有獅子的身體和老鷹的頭。"},{"en":"Its attacks cause bleeding.","zh":"它的攻擊會造成流血。"},{"en":"Use Aard to bring it down to the ground.","zh":"用亞爾德法印把它打到地上。"},{"en":"Remember: use your silver sword for monsters and your steel sword for people.","zh":"記住：銀劍對付怪物，鋼劍對付人。"}],"patterns":[{"pattern":"A is weak against B","usage":"A 怕 B；A 對 B 比較弱","example_en":"Drowners are weak against fire.","example_zh":"水鬼怕火。"},{"pattern":"have the + 名詞 + of + 名詞","usage":"有…的…（描述外型）","example_en":"A griffin has the body of a lion and the head of an eagle.","example_zh":"獅鷲有獅子的身體和老鷹的頭。"},{"pattern":"Use A for B","usage":"用 A 對付 B（比較第 1 課的 Use A against B）","example_en":"Use your silver sword for monsters.","example_zh":"用銀劍對付怪物。"}],"words":["creature","dangerous","drown","corpse","underwater","burn","eagle","bleeding","weak against","silver","steel","drowner","griffin","necrophage","crossbow"]},{"n":4,"title":"第 4 課　法印","added":"2026-09-26","story":[{"en":"Geralt has five magic Signs.","zh":"傑洛特有五種魔法法印。"},{"en":"Each Sign uses stamina.","zh":"每個法印都會消耗耐力。"},{"en":"Aard pushes enemies away. It can knock them down.","zh":"亞爾德把敵人推開，還能把他們擊倒。"},{"en":"Igni makes fire. Use it to burn your enemies.","zh":"伊格尼產生火焰，用它燒敵人。"},{"en":"Yrden is a magic trap. It slows enemies down.","zh":"亞登是魔法陷阱，能讓敵人變慢。"},{"en":"It is also very good against ghosts and wraiths.","zh":"它也很適合對付鬼魂和妖靈。"},{"en":"Quen protects you. It makes a shield around you.","zh":"昆恩保護你，在你周圍形成護盾。"},{"en":"Axii can confuse an enemy.","zh":"亞克席能讓敵人困惑。"},{"en":"You can also use it in conversations to control people.","zh":"你也可以在對話中用它控制別人。"},{"en":"When your stamina is low, wait a moment before you use another Sign.","zh":"耐力低的時候，等一下再用下一個法印。"}],"patterns":[{"pattern":"It can + 動詞","usage":"它能夠…（can 後面接原形動詞）","example_en":"Aard can knock enemies down.","example_zh":"亞爾德能把敵人擊倒。"},{"pattern":"動詞 + 受詞 + down","usage":"片語動詞，受詞可以放中間（knock enemies down / slow enemies down）","example_en":"Yrden slows enemies down.","example_zh":"亞登讓敵人變慢。"},{"pattern":"When + 句子, + 命令句","usage":"當…的時候，就…","example_en":"When your stamina is low, wait a moment.","example_zh":"耐力低的時候，就等一下。"}],"words":["magic","knock down","stun","slow down","protect","confuse","trap","stamina","ghost","control","wraith","Aard","Igni","Yrden","Quen","Axii"]},{"n":5,"title":"第 5 課　新手技巧","added":"2026-09-26","story":[{"en":"Here are some tips for new witchers.","zh":"這裡有一些給新手獵魔士的技巧。"},{"en":"Don't rush. The world is big, so take your time.","zh":"別急。世界很大，慢慢來。"},{"en":"You should read the notice boards in every village. They give you new quests.","zh":"你應該看看每個村子的佈告欄，它們會給你新任務。"},{"en":"You should repair your sword and armor often. Visit a blacksmith or an armorer.","zh":"你應該常修理劍和盔甲，去找鐵匠或盔甲匠。"},{"en":"Meditate to heal and refill your potions.","zh":"冥想可以恢復生命並補充藥水。"},{"en":"Loot everything, but don't carry too many heavy things. Check your inventory.","zh":"什麼都撿，但別帶太多重的東西，要檢查物品欄。"},{"en":"Don't sell your starting armor to a merchant. You can make it better later.","zh":"不要把初始盔甲賣給商人，之後可以升級它。"},{"en":"Never break the law. The guards will attack you and take your money.","zh":"絕對不要犯法，守衛會攻擊你並拿走你的錢。"},{"en":"Ride Roach, your horse, to explore the map.","zh":"騎你的馬蘿蔔去探索地圖。"},{"en":"Don't worry. You'll learn fast!","zh":"別擔心，你會學得很快！"}],"patterns":[{"pattern":"You should + 動詞","usage":"你應該…（給建議）；should 的 l 不發音 [ʃʊd]","example_en":"You should read the notice boards.","example_zh":"你應該看看佈告欄。"},{"pattern":"Don't + 動詞 / You shouldn't + 動詞","usage":"不要…／你不應該…","example_en":"Don't sell your starting armor.","example_zh":"不要賣掉你的初始盔甲。"},{"pattern":"Always / Never + 命令句","usage":"一定要…／絕對不要…","example_en":"Never break the law.","example_zh":"絕對不要犯法。"}],"words":["notice board","repair","blacksmith","meditate","heal","refill","merchant","heavy","rush","guard","worry","inventory","Roach"]},{"n":6,"title":"第 6 課　獵魔委託","added":"2026-09-26","story":[{"en":"Geralt read a contract on the notice board.","zh":"傑洛特在佈告欄上看到一份委託。"},{"en":"A man named Odolan needed help.","zh":"一個叫歐多蘭的男人需要幫忙。"},{"en":"His daughter drank toxic water from the river, and she fell ill.","zh":"他的女兒喝了河裡有毒的水，病倒了。"},{"en":"She needed clean water from an old well.","zh":"她需要一口老井裡的乾淨水。"},{"en":"But a ghost lived by the well, and nobody could go there.","zh":"但井邊住著一個鬼魂，沒有人能靠近。"},{"en":"Geralt and Odolan agreed on a price.","zh":"傑洛特和歐多蘭談好了價錢。"},{"en":"Then Geralt went to the abandoned village.","zh":"然後傑洛特去了廢棄的村莊。"},{"en":"He used his Witcher Senses and investigated.","zh":"他使用獵魔士感官進行調查。"},{"en":"He looked for clues. He found burned grass, a diary, and a bracelet.","zh":"他尋找線索，找到了燒焦的草、一本日記和一個手環。"},{"en":"The evidence told him the truth. The ghost was a noonwraith.","zh":"證據告訴了他真相：那個鬼魂是午時妖靈。"},{"en":"It appeared at noon, and it was weak against Yrden.","zh":"它在正午出現，而且怕亞登法印。"},{"en":"Geralt prepared specter oil, fought the noonwraith, and won.","zh":"傑洛特準備了怨靈劍油，和午時妖靈戰鬥，並且贏了。"}],"patterns":[{"pattern":"規則過去式：動詞 + ed（三種念法）","usage":"無聲子音後念 [t]（asked）；有聲音後念 [d]（burned）；t/d 後念 [ɪd]（investigated）","example_en":"He asked, burned, and investigated.","example_zh":"他問了、燒了、也調查了。"},{"pattern":"不規則過去式","usage":"drink→drank, fall→fell, find→found, go→went, read→read（念 [rɛd]）","example_en":"His daughter drank toxic water and fell ill.","example_zh":"他的女兒喝了有毒的水，病倒了。"},{"pattern":"was / were + 形容詞或名詞","usage":"過去的狀態：單數用 was，複數用 were","example_en":"The village was abandoned.","example_zh":"那個村莊被廢棄了。"}],"words":["contract","well","toxic","abandoned","investigate","clue","evidence","diary","bracelet","noon","price","noonwraith","Witcher Senses","specter"]},{"n":7,"title":"第 7 課　技能樹","added":"2026-09-26","story":[{"en":"Every time you level up, you get an ability point.","zh":"每次升級，你都會得到一個技能點數。"},{"en":"You can also get points at Places of Power.","zh":"你也可以在力量之地獲得點數。"},{"en":"There are four skill trees: Combat, Signs, Alchemy, and General.","zh":"技能樹有四種：戰鬥、法印、煉金和一般。"},{"en":"Use your points to unlock new skills.","zh":"用點數解鎖新技能。"},{"en":"But a skill only works when it is active, so put it in a slot.","zh":"但技能只有啟用時才有效，所以要把它放進欄位。"},{"en":"At first you have only a few slots. You unlock more when you level up.","zh":"一開始只有幾個欄位，升級時會解鎖更多。"},{"en":"Skills make Geralt stronger.","zh":"技能讓傑洛特變得更強。"},{"en":"For example, one skill increases fast attack damage by 5 percent.","zh":"例如，有個技能讓快速攻擊傷害增加 5%。"},{"en":"Another skill makes your toxicity go down faster.","zh":"另一個技能讓你的毒性降得更快。"},{"en":"Mutagens give you more health, more damage, or stronger Signs.","zh":"突變誘發物讓你有更多生命值、更高傷害或更強的法印。"},{"en":"Put them next to skills of the same color.","zh":"把它們放在同色的技能旁邊。"},{"en":"You can't unlock every skill, so choose wisely!","zh":"你無法解鎖所有技能，所以要謹慎選擇！"}],"patterns":[{"pattern":"increase / reduce + 名詞 + by + 數字 percent","usage":"讓…增加／減少多少百分比（技能說明最常見的句型）","example_en":"Increases fast attack damage by 5 percent.","example_zh":"快速攻擊傷害增加 5%。"},{"pattern":"比較級：形容詞 + er / more + 形容詞","usage":"短的字加 -er（stronger, faster），長的字前面加 more（more powerful）","example_en":"Skills make Geralt stronger and more powerful.","example_zh":"技能讓傑洛特更強、更有力量。"},{"pattern":"You need + 數量 + 名詞 + to + 動詞","usage":"你需要多少…才能…","example_en":"You need 8 points to unlock the next row.","example_zh":"你需要 8 點才能解鎖下一排。"}],"words":["ability","skill","level up","unlock","increase","reduce","percent","health","critical","slot","active","maximum","adrenaline","toxicity","mutagen","Place of Power"]},{"n":8,"title":"第 8 課　煉金術","added":"2026-09-26","story":[{"en":"Alchemy is very useful for a witcher. Here is how it works.","zh":"煉金術對獵魔士很有用，以下是它的運作方式。"},{"en":"First, you need a recipe. You can find recipes in chests or buy them from a herbalist.","zh":"首先，你需要配方。你可以在箱子裡找到配方，或向草藥師購買。"},{"en":"Then, collect the ingredients.","zh":"接著，收集材料。"},{"en":"Most potions need alcohol, some herbs, and sometimes monster parts, like drowner brains.","zh":"大部分藥水需要酒精、一些草藥，有時還要怪物的部位，像是水鬼的腦。"},{"en":"Next, open the alchemy menu and brew the potion.","zh":"然後，打開煉金選單調製藥水。"},{"en":"Finally, drink it in a fight.","zh":"最後，在戰鬥中喝下它。"},{"en":"Swallow is the basic health potion. It helps you recover health slowly.","zh":"燕子藥水是基本的回血藥水，能幫你慢慢恢復生命值。"},{"en":"Remember: potions increase your toxicity, so don't drink too many at once.","zh":"記住：藥水會增加毒性，所以別一次喝太多。"},{"en":"The best part? You only brew a potion once.","zh":"最棒的是什麼？每種藥水你只需要調製一次。"},{"en":"After that, meditate with alcohol in your inventory, and your potions and bombs will refill.","zh":"之後，只要物品欄裡有酒精，冥想時藥水和炸彈就會補滿。"},{"en":"Oils don't run out, so just apply them to your sword.","zh":"劍油不會用完，所以直接塗在劍上就好。"}],"patterns":[{"pattern":"First, … Then, … Next, … Finally, …","usage":"說明步驟的順序：首先、接著、然後、最後","example_en":"First, find a recipe. Then, collect the ingredients. Finally, brew the potion.","example_zh":"首先找配方，接著收集材料，最後調製藥水。"},{"pattern":"Once you + 動詞, + 句子","usage":"一旦…就…","example_en":"Once you brew a potion, you can refill it for free.","example_zh":"一旦調製過一種藥水，之後就能免費補充。"},{"pattern":"As long as + 句子, + 句子","usage":"只要…就…","example_en":"As long as you have alcohol, meditation refills your potions.","example_zh":"只要有酒精，冥想就會補充藥水。"}],"words":["potion","recipe","alcohol","herb","herbalist","brew","dose","apply","bomb","recover","limited","Swallow","decoction","alcohest"]},{"n":9,"title":"第 9 課　鐵匠與製作","added":"2026-09-26","story":[{"en":"Geralt can't make weapons or armor himself. He needs help from a craftsman.","zh":"傑洛特自己不能做武器或盔甲，他需要工匠幫忙。"},{"en":"First, you need a diagram. A diagram shows the materials you need.","zh":"首先，你需要一張設計圖，設計圖會列出你需要的材料。"},{"en":"For example, a sword may need iron, leather, and other components.","zh":"例如，一把劍可能需要鐵、皮革和其他零件。"},{"en":"You can buy materials from merchants, find them in chests, or dismantle old items.","zh":"你可以向商人買材料、在箱子裡找，或是拆解舊物品。"},{"en":"Only blacksmiths can craft weapons, and only armorers can craft armor.","zh":"只有鐵匠能做武器，只有盔甲匠能做盔甲。"},{"en":"There are three levels of craftsmen: amateur, journeyman, and master.","zh":"工匠有三個等級：業餘、熟練和大師。"},{"en":"Some diagrams need a master.","zh":"有些設計圖需要大師級工匠。"},{"en":"Crafting also costs crowns. If you don't have enough money, you can't make the item.","zh":"製作也要花克朗，錢不夠就做不了。"},{"en":"Tip: Don't sell your old swords right away. Dismantle them.","zh":"提示：舊劍別急著賣，把它們拆解掉。"},{"en":"You'll get useful materials.","zh":"你會得到有用的材料。"}],"patterns":[{"pattern":"You need + A, B, and C + to + 動詞","usage":"做某事需要 A、B 和 C","example_en":"You need iron and leather to make a sword.","example_zh":"做劍需要鐵和皮革。"},{"pattern":"enough 的位置：enough + 名詞／形容詞 + enough","usage":"名詞放在 enough 後面；形容詞放在 enough 前面","example_en":"You don't have enough money. This blacksmith isn't skilled enough.","example_zh":"你的錢不夠。這個鐵匠的技術不夠好。"},{"pattern":"Only + A + can + 動詞","usage":"只有 A 能做某事","example_en":"Only blacksmiths can craft weapons.","example_zh":"只有鐵匠能製作武器。"}],"words":["craft","diagram","material","component","iron","leather","ore","armor","dismantle","enough","master","fee","journeyman","crowns"]},{"n":10,"title":"第 10 課　盔甲與武器","added":"2026-09-26","story":[{"en":"Geralt carries two swords: a steel sword for people and a silver sword for monsters.","zh":"傑洛特帶著兩把劍：鋼劍對付人，銀劍對付怪物。"},{"en":"Armor has three weight classes: light, medium, and heavy.","zh":"盔甲有三種重量等級：輕、中、重。"},{"en":"Light armor gives the least protection, but it is the best for stamina.","zh":"輕甲防護力最低，但最有利於耐力。"},{"en":"You can dodge and use Signs more often.","zh":"你可以更常閃避和使用法印。"},{"en":"Heavy armor gives the most protection, but your stamina comes back more slowly.","zh":"重甲防護力最高，但耐力恢復得比較慢。"},{"en":"Medium armor is in the middle. For many players, it is the best balance.","zh":"中甲介於中間，對很多玩家來說是最好的平衡。"},{"en":"Armor has four parts: chest armor, gauntlets, trousers, and boots.","zh":"盔甲分成四個部位：胸甲、護手、褲子和靴子。"},{"en":"Weapons and armor lose durability when you fight, so repair them often.","zh":"武器和盔甲戰鬥時會損失耐久度，所以要常修理。"},{"en":"Some items are rare. Relic items are some of the rarest in the game.","zh":"有些物品很稀有，遺物級是遊戲中最稀有的之一。"},{"en":"But the best gear is usually witcher gear. You craft it from diagrams.","zh":"但最好的裝備通常是獵魔士裝備，要用設計圖製作。"}],"patterns":[{"pattern":"最高級：the + 形容詞-est / the most + 形容詞","usage":"最…的；短字加 -est（the rarest），長字前加 the most（the most powerful）","example_en":"Heavy armor gives the most protection.","example_zh":"重甲的防護力最高。"},{"pattern":"不規則比較：good-better-best / bad-worse-worst / little-less-least","usage":"要個別背","example_en":"Light armor gives the least protection, but it is the best for stamina.","example_zh":"輕甲防護最少，但最有利於耐力。"},{"pattern":"A + gives more/less + 名詞 + than + B","usage":"A 比 B 給更多／更少的…","example_en":"Heavy armor gives more protection than light armor.","example_zh":"重甲比輕甲提供更多防護。"}],"words":["weapon","sword","light","medium","weight","protection","defense","durability","rare","balance","boots","trousers","gauntlets","relic"]},{"n":11,"title":"第 11 課　主線：丁香與醋栗","added":"2026-09-26","story":[{"en":"This is the first main quest in White Orchard.","zh":"這是白果園的第一個主線任務。"},{"en":"Geralt and Vesemir are looking for Yennefer.","zh":"傑洛特和維瑟米爾正在尋找葉妮芙。"},{"en":"On the road, they see a griffin attack a merchant. Vesemir is wounded in the fight.","zh":"路上他們看到獅鷲攻擊一個商人，維瑟米爾在戰鬥中受傷。"},{"en":"In the village, Geralt goes to the tavern.","zh":"到了村子，傑洛特走進酒館。"},{"en":"The innkeeper has no information about Yennefer, so Geralt asks the travelers.","zh":"旅店老闆沒有葉妮芙的消息，所以傑洛特去問旅客。"},{"en":"Only one man knows something: a bald man named Gaunter O'Dimm.","zh":"只有一個人知道些什麼：一個叫剛特・歐迪姆的光頭男子。"},{"en":"He says Yennefer spoke with a Nilfgaardian captain.","zh":"他說葉妮芙和一個尼弗迦德隊長談過話。"},{"en":"Geralt goes to the Nilfgaardian garrison, where many soldiers live.","zh":"傑洛特前往尼弗迦德要塞，那裡住著很多士兵。"},{"en":"The captain knows where Yennefer went, but he won't tell Geralt until Geralt kills the griffin.","zh":"隊長知道葉妮芙去了哪裡，但要等傑洛特殺了獅鷲才肯說。"},{"en":"It's information in exchange for a witcher's work.","zh":"這是用獵魔士的工作交換情報。"}],"patterns":[{"pattern":"ask + 人 + about + 事","usage":"向某人打聽某事","example_en":"Geralt asks the travelers about Yennefer.","example_zh":"傑洛特向旅客打聽葉妮芙。"},{"pattern":"won't + 動詞 + until + 句子","usage":"要等到…才會…","example_en":"He won't tell Geralt until Geralt kills the griffin.","example_zh":"要等傑洛特殺了獅鷲，他才會說。"},{"pattern":"A in exchange for B","usage":"用 B 交換 A","example_en":"It's information in exchange for a witcher's work.","example_zh":"這是用獵魔士的工作交換情報。"}],"words":["tavern","inn","innkeeper","traveler","information","captain","garrison","soldier","wounded","exchange","lilac","gooseberry","Nilfgaardian","Gaunter O'Dimm"]},{"n":12,"title":"第 12 課　白果園支線","added":"2026-09-26","story":[{"en":"White Orchard has several side quests. In the game, they are called secondary quests.","zh":"白果園有好幾個支線任務，在遊戲中叫做次要任務。"},{"en":"They are optional, but they give you experience, crowns, and good stories.","zh":"它們是可選的，但能給你經驗、克朗和好故事。"},{"en":"Villagers will ask you to help them.","zh":"村民會請你幫忙。"},{"en":"Some people are missing, and some need a witcher's help.","zh":"有些人失蹤了，有些人需要獵魔士的幫助。"},{"en":"You can find requests on the notice board, or people will talk to you on the road.","zh":"你可以在佈告欄找到請求，或是路上會有人來找你。"},{"en":"Open your journal to read about each quest.","zh":"打開日誌閱讀每個任務。"},{"en":"Track a quest, and a marker will appear on your map.","zh":"追蹤一個任務，地圖上就會出現標記。"},{"en":"Important: complete the side quests in White Orchard before you talk to Vesemir after the griffin hunt.","zh":"重要：獵完獅鷲後，在和維瑟米爾說話之前，先完成白果園的支線任務。"},{"en":"If you don't, some of them will fail.","zh":"不然有些任務會失敗。"},{"en":"Three quests to remember: Twisted Firestarter, Missing in Action, and On Death's Bed.","zh":"要記住三個任務：扭曲的縱火犯、作戰失蹤、臨終之床。"},{"en":"Make them a priority!","zh":"把它們列為優先！"}],"patterns":[{"pattern":"ask / help + 人 + (to) + 動詞","usage":"請某人做某事／幫某人做某事（help 後面的 to 可省略）","example_en":"Villagers will ask you to help them.","example_zh":"村民會請你幫忙。"},{"pattern":"before + 句子 / before + 動詞-ing","usage":"在…之前","example_en":"Complete the side quests before you talk to Vesemir.","example_zh":"在和維瑟米爾說話之前，先完成支線任務。"},{"pattern":"make + 受詞 + 名詞","usage":"把…變成…；讓…成為…","example_en":"Make them a priority.","example_zh":"把它們列為優先。"}],"words":["secondary","optional","missing","villager","request","fail","complete","journal","marker","track","priority","orchard","missing in action"]},{"n":13,"title":"第 13 課　感情與情緒","added":"2026-09-26","story":[{"en":"Geralt doesn't show his feelings much, but he has a heart.","zh":"傑洛特不太表露感情，但他是有心的。"},{"en":"He loves Yennefer, and he misses her.","zh":"他愛葉妮芙，也想念她。"},{"en":"Triss is also an old friend, and she cares about him.","zh":"特莉絲也是老朋友，她很關心他。"},{"en":"In the game, you can choose a relationship with Yennefer or Triss.","zh":"在遊戲中，你可以選擇和葉妮芙或特莉絲交往。"},{"en":"Your words in conversations matter. Think carefully before you choose.","zh":"你在對話中說的話很重要，選擇之前要想清楚。"},{"en":"People in the game have feelings too.","zh":"遊戲裡的人也有感情。"},{"en":"Some are lonely, some are worried, and some are jealous.","zh":"有些人孤單，有些人擔心，有些人嫉妒。"},{"en":"Listen to how they feel. It makes the story more exciting, not boring.","zh":"傾聽他們的感受，會讓故事更精彩，而不是無聊。"},{"en":"And when you are surprised by a character's words, remember: that's good writing!","zh":"當角色的話讓你驚訝時，記住：那就是好的劇本！"}],"patterns":[{"pattern":"-ed 和 -ing 形容詞","usage":"-ed 是人的感受（I'm bored / surprised）；-ing 是事物給人的感覺（It's boring / surprising）","example_en":"I was surprised. The story was surprising.","example_zh":"我很驚訝。這個故事很令人驚訝。"},{"pattern":"feel + 形容詞","usage":"感覺…（feel 後面接形容詞，不接副詞）","example_en":"Geralt feels worried about Ciri.","example_zh":"傑洛特很擔心希里。"},{"pattern":"care about / miss + 人","usage":"關心某人／想念某人","example_en":"She cares about him, and he misses her.","example_zh":"她關心他，他也想念她。"}],"words":["feel","love","miss","jealous","lonely","angry","worried","surprised","boring","relationship","honest","trust","romance"]},{"n":14,"title":"第 14 課　選擇與後果","added":"2026-09-26","story":[{"en":"The Witcher 3 is famous for its choices.","zh":"巫師3以它的選擇系統聞名。"},{"en":"Many decisions have consequences, and some consequences come much later.","zh":"很多決定都有後果，有些後果很久之後才出現。"},{"en":"Here is an easy example from the beginning of the game.","zh":"這裡有一個遊戲開頭的簡單例子。"},{"en":"After the griffin attacks a merchant, the merchant offers Geralt a reward.","zh":"獅鷲攻擊商人之後，商人要給傑洛特報酬。"},{"en":"If you accept, you will get fifty crowns.","zh":"如果你接受，你會拿到五十克朗。"},{"en":"If you refuse, you will get a free meal at the tavern and a discount later.","zh":"如果你拒絕，你會在酒館得到一頓免費餐點，之後還有折扣。"},{"en":"It's your choice, and neither answer is wrong.","zh":"這是你的選擇，兩個答案都沒錯。"},{"en":"But other choices matter more. Sometimes there is no good answer, only the lesser evil.","zh":"但其他選擇更重要。有時沒有好答案，只能兩害相權取其輕。"},{"en":"The result depends on what you say and what you do.","zh":"結果取決於你說了什麼、做了什麼。"},{"en":"So think carefully. Then don't regret it. Your story is your own!","zh":"所以要想清楚，然後別後悔。你的故事屬於你自己！"}],"patterns":[{"pattern":"If + 現在式, … will + 動詞（第一條件句）","usage":"如果…就會…；if 那半句用現在式，不用 will","example_en":"If you accept, you will get fifty crowns.","example_zh":"如果你接受，你會拿到五十克朗。"},{"pattern":"depend on + 名詞 / what 子句","usage":"取決於…","example_en":"The result depends on what you say.","example_zh":"結果取決於你說了什麼。"},{"pattern":"either A or B / neither","usage":"either A or B＝A 或 B 其中之一；neither＝兩者都不","example_en":"You can either accept or refuse. Neither answer is wrong.","example_zh":"你可以接受或拒絕，兩個答案都沒錯。"}],"words":["choice","consequence","decision","accept","refuse","depend","result","future","regret","matter","discount","meal","lesser evil"]},{"n":15,"title":"第 15 課　主線：白果園的野獸","added":"2026-09-26","story":[{"en":"The captain wants the griffin dead. He tells Geralt to talk to a hunter and a herbalist.","zh":"隊長要獅鷲死。他叫傑洛特去找一個獵人和一個草藥師。"},{"en":"First, Geralt visits the herbalist.","zh":"首先，傑洛特去拜訪草藥師。"},{"en":"She says he needs a plant called buckthorn to use as bait.","zh":"她說他需要一種叫鼠李的植物當誘餌。"},{"en":"It grows on the riverbed, so Geralt has to dive.","zh":"它長在河床上，所以傑洛特必須潛水。"},{"en":"Next, Geralt goes to the hunter's hut, but the hunter isn't home.","zh":"接著，傑洛特去獵人的小屋，但獵人不在家。"},{"en":"He must be out hunting.","zh":"他一定是出去打獵了。"},{"en":"Geralt uses his Witcher Senses and follows the footprints.","zh":"傑洛特使用獵魔士感官，跟著腳印走。"},{"en":"He finds the hunter fighting wild dogs. You can help him, or you can say you're in a hurry.","zh":"他發現獵人正在和野狗戰鬥。你可以幫他，也可以說你在趕時間。"},{"en":"The hunter takes Geralt to the place where the griffin attacked some soldiers.","zh":"獵人帶傑洛特到獅鷲攻擊士兵的地點。"},{"en":"Geralt examines the area. He finds bottles, blood, and footprints.","zh":"傑洛特仔細檢查這個區域，發現了酒瓶、血跡和腳印。"},{"en":"The soldiers might have had a party before the attack.","zh":"士兵們在被攻擊前可能在開派對。"},{"en":"He follows the tracks and finds the griffin's nest. Now it's time to hunt.","zh":"他跟著足跡找到獅鷲的巢。現在該去狩獵了。"}],"patterns":[{"pattern":"must be + 名詞/形容詞/動詞-ing（很確定的推測）","usage":"一定是…；根據證據推測","example_en":"He must be out hunting.","example_zh":"他一定是出去打獵了。"},{"pattern":"might + 動詞（不太確定的推測）","usage":"可能…；比 must 不確定","example_en":"The soldiers might have had a party.","example_zh":"士兵們可能開過派對。"},{"pattern":"be in a hurry","usage":"正在趕時間","example_en":"I'm in a hurry.","example_zh":"我在趕時間。"}],"words":["hunter","hut","footprint","blood","nest","bait","dive","riverbed","wild","hurry","examine","buckthorn"]},{"n":16,"title":"第 16 課　地圖與方向","added":"2026-09-26","story":[{"en":"Let's learn to read the map of White Orchard.","zh":"來學看白果園的地圖吧。"},{"en":"The Nilfgaardian garrison is north of the village.","zh":"尼弗迦德要塞在村子的北方。"},{"en":"The hunter's hut is southwest of the village.","zh":"獵人的小屋在村子的西南方。"},{"en":"To get there, start at the notice board and follow the road southwest.","zh":"要去那裡，從佈告欄出發，沿著路往西南走。"},{"en":"Near the door, you will find the hunter's tracks. They go south into the forest.","zh":"門附近會找到獵人的足跡，它們往南進入森林。"},{"en":"There is a river near the village, and you can cross it on a bridge.","zh":"村子附近有一條河，你可以從橋上過河。"},{"en":"There is even a signpost called Broken Bridge.","zh":"甚至有一個路標就叫「斷橋」。"},{"en":"Look for signposts on the road. You can use them to fast travel.","zh":"留意路上的路標，你可以用它們快速旅行。"},{"en":"If you are lost, open the map and check your direction.","zh":"如果迷路了，打開地圖確認方向。"}],"patterns":[{"pattern":"A is + 方位 + of + B","usage":"A 在 B 的某個方位（north of, southwest of）","example_en":"The garrison is north of the village.","example_zh":"要塞在村子北方。"},{"pattern":"位置介系詞：next to / behind / across / near","usage":"在旁邊／在後面／在對面／在附近","example_en":"The inn is across the road, next to the notice board.","example_zh":"旅店在馬路對面，佈告欄旁邊。"},{"pattern":"指路命令句：Follow / Turn / Go + 方向","usage":"沿著…走／轉彎／往…走","example_en":"Follow the road and turn left at the bridge.","example_zh":"沿著路走，到橋那裡左轉。"}],"words":["north","south","east","west","direction","road","bridge","signpost","across","toward","behind","follow"]},{"n":17,"title":"第 17 課　買賣與商人","added":"2026-09-26","story":[{"en":"Geralt meets a merchant on the road.","zh":"傑洛特在路上遇到一個商人。"},{"en":"Merchant: Good day, witcher! Would you like to buy something?","zh":"商人：你好，獵魔士！想買點什麼嗎？"},{"en":"Geralt: How much is this sword?","zh":"傑洛特：這把劍多少錢？"},{"en":"Merchant: It costs two hundred crowns.","zh":"商人：兩百克朗。"},{"en":"Geralt: That's too expensive. I can't afford it.","zh":"傑洛特：太貴了，我買不起。"},{"en":"Merchant: Then I'll make you an offer. One hundred and fifty.","zh":"商人：那我給你一個價錢，一百五十。"},{"en":"Geralt: Hm. I'd like to sell some things too.","zh":"傑洛特：嗯，我也想賣一些東西。"},{"en":"Merchant: Let me see. This old armor isn't worth much. I'll give you half the price.","zh":"商人：我看看。這件舊盔甲不值多少錢，我給你半價。"},{"en":"Tip: Some items are cheap but hard to find, like Gwent cards. Buy them when you see them!","zh":"提示：有些東西很便宜但很難找，像是昆特牌卡片。看到就買！"}],"patterns":[{"pattern":"How much is + 單數 / How much are + 複數?","usage":"…多少錢？","example_en":"How much is this sword? How much are these boots?","example_zh":"這把劍多少錢？這雙靴子多少錢？"},{"pattern":"I'd like to + 動詞","usage":"我想要…（比 I want 禮貌）；I'd＝I would","example_en":"I'd like to sell some things.","example_zh":"我想賣一些東西。"},{"pattern":"too + 形容詞","usage":"太…了（負面）；比較第 9 課的 形容詞 + enough","example_en":"That's too expensive.","example_zh":"那太貴了。"}],"words":["buy","sell","how much","cost","cheap","expensive","afford","trade","coin","offer","worth","half"]},{"n":18,"title":"第 18 課　昆特牌","added":"2026-09-26","story":[{"en":"Gwent is a card game inside The Witcher 3.","zh":"昆特牌是巫師3裡的紙牌遊戲。"},{"en":"You can learn it from a scholar in the White Orchard tavern.","zh":"你可以跟白果園酒館裡的一位學者學。"},{"en":"Each player has a deck of cards. At the start, you draw ten cards.","zh":"每個玩家都有一副牌，一開始抽十張。"},{"en":"The board has three rows on each side: close combat, ranged, and siege.","zh":"每一邊的桌面有三排：近戰、遠程和攻城。"},{"en":"Take turns. On your turn, you play one card.","zh":"輪流出牌，輪到你時出一張牌。"},{"en":"Each card has a strength from 0 to 15.","zh":"每張卡的戰力從 0 到 15。"},{"en":"At the end of a round, the player with the higher score wins the round.","zh":"回合結束時，分數比較高的玩家贏得這回合。"},{"en":"If you don't want to play more cards, you can pass.","zh":"不想再出牌的話，可以跳過。"},{"en":"To win the game, you have to win two of the three rounds.","zh":"要贏得整局，你必須贏三回合中的兩回合。"},{"en":"Be careful with weather cards. They make all cards in one row weak.","zh":"小心天氣卡，它們會讓一整排的卡都變弱。"},{"en":"Tip: Innkeepers and merchants sell cards. Buy them early!","zh":"提示：旅店老闆和商人都有賣卡，早點買！"}],"patterns":[{"pattern":"序數：first / second / third","usage":"第一／第二／第三（first round, the third round）","example_en":"You have to win two of the three rounds.","example_zh":"你必須贏三回合中的兩回合。"},{"pattern":"have to + 動詞","usage":"必須…（規則要求）","example_en":"To win the game, you have to win two rounds.","example_zh":"要贏整局，你必須贏兩回合。"},{"pattern":"It's + 人 + turn","usage":"輪到某人了（your / my / his turn）","example_en":"It's your turn.","example_zh":"輪到你了。"}],"words":["card","deck","round","pass","score","row","weather","strength","opponent","draw","lose","turn","Gwent","siege"]},{"n":19,"title":"第 19 課　對話與提問","added":"2026-09-26","story":[{"en":"Conversations are a big part of The Witcher 3. Many dialogue options are questions.","zh":"對話是巫師3很重要的一部分，很多對話選項都是問句。"},{"en":"When Geralt looks for Yennefer, he asks many questions.","zh":"傑洛特尋找葉妮芙時，問了很多問題。"},{"en":"Where is Yennefer? When did she leave? Which way did she go?","zh":"葉妮芙在哪裡？她什麼時候離開的？她往哪條路走了？"},{"en":"Sometimes strangers ask Geralt questions too.","zh":"有時陌生人也會問傑洛特問題。"},{"en":"Who are you? What do you want? Why are you here?","zh":"你是誰？你想要什麼？你為什麼在這裡？"},{"en":"Listen to the answer before you choose your next option.","zh":"選下一個選項之前，先仔細聽回答。"},{"en":"Remember: in who and whose, you say the h, and the w is silent.","zh":"記住：who 和 whose 要念 h，w 不發音。"},{"en":"In what, where, when, why, and which, most people say the w, and the h is silent.","zh":"what、where、when、why、which 大多數人念 w，h 不發音。"},{"en":"Good questions give you good information.","zh":"好問題帶來好情報。"}],"patterns":[{"pattern":"疑問詞 + be + 主詞","usage":"問「是什麼／在哪裡」","example_en":"Where is Yennefer? Who are you?","example_zh":"葉妮芙在哪裡？你是誰？"},{"pattern":"疑問詞 + do / does / did + 主詞 + 動詞","usage":"一般動詞的問句；過去用 did，後面動詞用原形","example_en":"Where did she go? What do you want?","example_zh":"她去哪裡了？你想要什麼？"},{"pattern":"How + 形容詞／副詞","usage":"How long（多久）、How far（多遠）、How much（多少錢）","example_en":"How long ago did she leave?","example_zh":"她多久以前離開的？"}],"words":["who","whose","what","where","when","why","which","how","answer","conversation","option","stranger"]},{"n":20,"title":"第 20 課　時間與晝夜","added":"2026-09-26","story":[{"en":"The world of The Witcher 3 has day and night.","zh":"巫師3的世界有白天和黑夜。"},{"en":"In the morning, villagers go to work. In the evening, many of them go to the tavern.","zh":"早上村民去工作，傍晚很多人去酒館。"},{"en":"Some monsters only come out at certain times.","zh":"有些怪物只在特定時間出現。"},{"en":"A noonwraith appears at noon, and a nightwraith appears at night.","zh":"午時妖靈在正午出現，夜之妖靈在夜晚出現。"},{"en":"If you need a different time, you can meditate.","zh":"如果你需要換個時間，可以冥想。"},{"en":"Choose an hour, and Geralt will meditate until that time.","zh":"選一個時間，傑洛特會冥想到那個時候。"},{"en":"For example, meditate until midnight, or until dawn.","zh":"例如，冥想到午夜，或冥想到黎明。"},{"en":"It is eight o'clock now. Wait one hour, and it will be nine o'clock.","zh":"現在八點，等一個小時就九點了。"},{"en":"Be careful at night. It's dark, so it's harder to see.","zh":"晚上要小心，天很黑，比較看不清楚。"}],"patterns":[{"pattern":"at / in / on + 時間","usage":"at + 時刻（at noon, at night）；in + 時段（in the morning）；on + 日期（on Monday）","example_en":"A noonwraith appears at noon. Villagers work in the morning.","example_zh":"午時妖靈在正午出現。村民早上工作。"},{"pattern":"until + 時間","usage":"直到某個時間","example_en":"Meditate until midnight.","example_zh":"冥想到午夜。"},{"pattern":"It is + 數字 + o'clock","usage":"現在幾點（只用在整點）","example_en":"It is eight o'clock now.","example_zh":"現在八點。"}],"words":["morning","afternoon","evening","night","midnight","hour","minute","until","o'clock","dawn","dusk","knight"]},{"n":21,"title":"第 21 課　天氣與自然","added":"2026-09-26","story":[{"en":"The weather in The Witcher 3 changes all the time.","zh":"巫師3的天氣隨時在變化。"},{"en":"Sometimes it's sunny. Sometimes it's raining, and sometimes there is a big storm.","zh":"有時晴天，有時下雨，有時還有大暴風雨。"},{"en":"Listen to the wind. When the wind is howling, a storm is coming.","zh":"聽聽風聲，風在呼嘯時，暴風雨就要來了。"},{"en":"In the morning, there may be fog over the lake.","zh":"早上湖面上可能有霧。"},{"en":"The world has many places to explore: forests, swamps, caves, lakes, mountains, and even islands.","zh":"這個世界有很多地方可以探索：森林、沼澤、洞穴、湖泊、山脈，甚至島嶼。"},{"en":"Swamps are wet and full of drowners.","zh":"沼澤很濕，到處都是水鬼。"},{"en":"Caves are dark, so drink a Cat potion to see better.","zh":"洞穴很暗，喝一瓶貓藥水就能看得比較清楚。"},{"en":"It's getting dark. Time to find an inn!","zh":"天漸漸黑了，該找間旅店了！"}],"patterns":[{"pattern":"It's + 動詞-ing（描述現在的天氣）","usage":"It's raining（正在下雨）；天氣的主詞用 it","example_en":"It's raining, and the wind is howling.","example_zh":"正在下雨，風在呼嘯。"},{"pattern":"It's getting + 形容詞","usage":"漸漸變得…","example_en":"It's getting dark.","example_zh":"天漸漸黑了。"},{"pattern":"There is + 單數 / There are + 複數","usage":"有…（存在）","example_en":"There is fog over the lake. There are many caves.","example_zh":"湖面上有霧。有很多洞穴。"}],"words":["rain","storm","fog","wind","howl","forest","swamp","cave","lake","mountain","island","dark"]},{"n":22,"title":"第 22 課　身體與受傷","added":"2026-09-26","story":[{"en":"Fighting monsters is dangerous. Geralt often gets hurt.","zh":"和怪物戰鬥很危險，傑洛特常常受傷。"},{"en":"A griffin can hit you with its claws, and you will start to bleed.","zh":"獅鷲會用爪子攻擊你，你會開始流血。"},{"en":"Some monsters use poison. If you get poisoned, your health goes down slowly.","zh":"有些怪物會用毒，中毒的話，生命值會慢慢下降。"},{"en":"Watch out for attacks to your head and chest.","zh":"小心頭部和胸部受到的攻擊。"},{"en":"Good armor protects your body: chest, arms, hands, and legs.","zh":"好的盔甲保護你的身體：胸部、手臂、手和腿。"},{"en":"When Geralt is injured, he can drink a potion, eat food, or meditate.","zh":"傑洛特受傷時，可以喝藥水、吃東西或冥想。"},{"en":"After a long fight, his arm hurts and his legs are tired.","zh":"長時間戰鬥後，他的手臂痛，腿也很累。"},{"en":"Even a witcher feels pain. But a witcher's heart is strong.","zh":"就連獵魔士也會痛，但獵魔士的心很堅強。"}],"patterns":[{"pattern":"My + 身體部位 + hurts / hurt","usage":"我的…痛（單數用 hurts，複數用 hurt）","example_en":"My arm hurts. My legs hurt.","example_zh":"我的手臂痛。我的腿痛。"},{"pattern":"get + 過去分詞","usage":"變得…；遭受…（get hurt, get poisoned）","example_en":"If you get poisoned, your health goes down.","example_zh":"如果中毒，生命值會下降。"},{"pattern":"Watch out (for + 名詞)!","usage":"小心…！","example_en":"Watch out for attacks to your head!","example_zh":"小心頭部受到攻擊！"}],"words":["head","arm","leg","chest","hand","heart","hurt","injured","poison","bleed","pain","stomach"]},{"n":23,"title":"第 23 課　食物與飲料","added":"2026-09-26","story":[{"en":"Food is important in The Witcher 3. When Geralt eats, his health comes back.","zh":"食物在巫師3很重要，傑洛特吃東西時生命值會恢復。"},{"en":"You can buy food from innkeepers and merchants: bread, meat, cheese, and fruit.","zh":"你可以向旅店老闆和商人買食物：麵包、肉、起司和水果。"},{"en":"Water and milk are good too. Beer and wine are alcohol.","zh":"水和牛奶也不錯，啤酒和葡萄酒則是酒精飲料。"},{"en":"Remember, you can use strong alcohol for alchemy.","zh":"記得，烈酒可以用在煉金術上。"},{"en":"Are you hungry? Have a piece of bread. Are you thirsty? Have a bottle of water.","zh":"餓了嗎？吃一塊麵包。渴了嗎？喝一瓶水。"},{"en":"Some food is very delicious, like the roast chicken at the White Orchard inn.","zh":"有些食物很好吃，像是白果園旅店的烤雞。"},{"en":"Tip: You don't need much food, but carry some in your inventory.","zh":"提示：你不需要很多食物，但物品欄裡要帶一些。"}],"patterns":[{"pattern":"a piece of / a bottle of / a cup of + 不可數名詞","usage":"不可數名詞要用單位來數：a piece of bread, a bottle of water","example_en":"Have a piece of bread and a bottle of water.","example_zh":"吃一塊麵包，喝一瓶水。"},{"pattern":"much + 不可數 / many + 可數","usage":"much food, much water；many potions, many cards","example_en":"You don't need much food, but you have many potions.","example_zh":"你不需要很多食物，但你有很多藥水。"},{"pattern":"some（肯定句）/ any（否定、疑問句）","usage":"Do you have any food? Yes, I have some.","example_en":"Do you have any bread? Yes, I have some.","example_zh":"你有麵包嗎？有，我有一些。"}],"words":["food","bread","meat","cheese","water","beer","wine","hungry","thirsty","delicious","piece","bottle"]},{"n":24,"title":"第 24 課　現在完成式與常用回應","added":"2026-09-26","story":[{"en":"Geralt travels a lot, so he often asks, \"Have you seen this woman?\"","zh":"傑洛特到處旅行，所以常問：「你見過這個女人嗎？」"},{"en":"In the tavern, people talk about rumors.","zh":"在酒館裡，人們在聊傳聞。"},{"en":"\"Have you heard the news? A griffin has attacked the road again!\"","zh":"「你聽說了嗎？獅鷲又在路上攻擊人了！」"},{"en":"Some villagers have never seen a witcher before. They are surprised.","zh":"有些村民從來沒見過獵魔士，他們很驚訝。"},{"en":"When someone asks for help, Geralt might say, \"Sure,\" or \"Of course.\"","zh":"有人求助時，傑洛特可能會說「好啊」或「當然」。"},{"en":"If someone says sorry, he might say, \"Never mind.\"","zh":"有人道歉時，他可能會說「沒關係」。"},{"en":"When he understands, he says, \"I see.\"","zh":"他明白時會說「我懂了」。"},{"en":"Has Geralt found Yennefer yet? Not yet, but he has already learned a lot.","zh":"傑洛特找到葉妮芙了嗎？還沒，但他已經打聽到很多了。"},{"en":"And you? Have you finished the White Orchard quests yet?","zh":"那你呢？白果園的任務完成了嗎？"}],"patterns":[{"pattern":"Have you (ever) + 過去分詞?","usage":"你（曾經）…過嗎？（現在完成式問經驗）","example_en":"Have you ever seen a griffin?","example_zh":"你見過獅鷲嗎？"},{"pattern":"have / has + already + 過去分詞；… yet?","usage":"already（已經）用在肯定句；yet 用在否定句（還沒）和問句（了沒）","example_en":"He has already learned a lot. Has he found her yet?","example_zh":"他已經學到很多了。他找到她了沒？"},{"pattern":"常用回應：Sure / Of course / Never mind / I see","usage":"好啊／當然／沒關係／我明白了","example_en":"Sure. Of course. Never mind. I see.","example_zh":"好啊。當然。沒關係。我懂了。"}],"words":["seen","heard","ever","never","already","yet","sure","fine","of course","never mind","I see","rumor"]},{"n":25,"title":"第 25 課　外貌與顏色","added":"2026-09-27","story":[{"en":"Geralt has long white hair.","zh":"傑洛特有一頭長長的白髮。"},{"en":"He is tall and thin, but very strong.","zh":"他又高又瘦，但非常強壯。"},{"en":"He has a scar over his left eye, and his skin is pale.","zh":"他的左眼上有一道疤，皮膚很蒼白。"},{"en":"His eyes are yellow, like a cat's eyes.","zh":"他的眼睛是黃色的，像貓的眼睛。"},{"en":"Some villagers are afraid. They say he looks like a monster.","zh":"有些村民會害怕，他們說他看起來像怪物。"},{"en":"But most of the time, he just looks tired.","zh":"但大部分的時候，他只是看起來很累。"},{"en":"He wears a silver wolf medallion around his neck.","zh":"他脖子上戴著一個銀色的狼頭徽章。"},{"en":"Yennefer has black hair and purple eyes.","zh":"葉妮芙有黑色的頭髮和紫色的眼睛。"},{"en":"She always wears black and white.","zh":"她總是穿黑色和白色。"},{"en":"Roach is a big brown horse.","zh":"蘿蔔是一匹高大的棕色馬。"},{"en":"In this game, your appearance can change. Geralt's beard grows every day!","zh":"在這個遊戲裡，你的外表會改變。傑洛特的鬍子每天都在長！"}],"patterns":[{"pattern":"look + 形容詞","usage":"看起來…（look 後面接形容詞，不接副詞：looks tired，不是 looks tiredly）","example_en":"He looks tired.","example_zh":"他看起來很累。"},{"pattern":"look like + 名詞","usage":"看起來像…（後面接名詞；和上一句型不要混用）","example_en":"He looks like a monster.","example_zh":"他看起來像怪物。"},{"pattern":"形容詞順序：看法 → 大小 → 年齡 → 顏色 + 名詞","usage":"多個形容詞一起用時的順序；中文比較自由，英文有固定順序","example_en":"Roach is a big brown horse.","example_zh":"蘿蔔是一匹高大的棕色馬。"}],"words":["hair","white","tall","thin","scar","eye","yellow","purple","pale","beard","handsome","wear","appearance","medallion"]},{"n":26,"title":"第 26 課　每天的例行公事（獵魔士的一天）","added":"2026-09-27","story":[{"en":"What does a witcher do every day?","zh":"獵魔士每天都在做什麼？"},{"en":"Geralt usually wakes up at dawn.","zh":"傑洛特通常在黎明醒來。"},{"en":"He always eats breakfast first.","zh":"他總是先吃早餐。"},{"en":"Then he often practices with his sword.","zh":"然後他常常練劍。"},{"en":"He sometimes uses a whetstone to make his sword sharper.","zh":"他有時候會用磨刀石讓劍更鋒利。"},{"en":"He is rarely lazy.","zh":"他很少偷懶。"},{"en":"In the afternoon, he rides Roach to the next village.","zh":"下午，他騎蘿蔔去下一個村子。"},{"en":"He reads the notice board and asks about contracts.","zh":"他看佈告欄，打聽有沒有委託。"},{"en":"At night he is usually tired, so he meditates or sleeps at an inn.","zh":"晚上他通常很累，所以會冥想或在旅店睡覺。"},{"en":"This is his daily routine.","zh":"這就是他每天的例行公事。"},{"en":"How often do you play The Witcher?","zh":"你多常玩巫師？"}],"patterns":[{"pattern":"頻率副詞 + 一般動詞","usage":"always / usually / often / sometimes / rarely 放在一般動詞前面（台灣人常放句尾）","example_en":"Geralt usually wakes up at dawn.","example_zh":"傑洛特通常在黎明醒來。"},{"pattern":"be 動詞 + 頻率副詞","usage":"遇到 am / is / are，頻率副詞放在 be 動詞後面","example_en":"He is rarely lazy.","example_zh":"他很少偷懶。"},{"pattern":"How often do you + 動詞？","usage":"你多常…？回答用頻率副詞或 every day / twice a week","example_en":"How often do you meditate?","example_zh":"你多常冥想？"}],"words":["always","usually","often","sometimes","rarely","wake up","breakfast","ride","practice","sleep","tired","daily","routine","whetstone"]},{"n":27,"title":"第 27 課　計畫與打算","added":"2026-09-27","story":[{"en":"Geralt has a plan.","zh":"傑洛特有一個計畫。"},{"en":"\"I'm going to leave White Orchard tomorrow,\" he says.","zh":"「我明天要離開白果園。」他說。"},{"en":"\"I'm going to follow Yennefer's trail.\"","zh":"「我要循著葉妮芙的線索走。」"},{"en":"A villager asks, \"Will you come back?\"","zh":"一個村民問：「你會回來嗎？」"},{"en":"\"Maybe. I will probably return soon.\"","zh":"「也許吧。我大概很快就會回來。」"},{"en":"The innkeeper says, \"It will rain tonight. Stay here.\"","zh":"旅店老闆說：「今晚會下雨，留下來吧。」"},{"en":"Geralt decides to stay one more night.","zh":"傑洛特決定多住一晚。"},{"en":"\"Fine. I'll leave at dawn. I promise.\"","zh":"「好吧，我黎明就走，我保證。」"},{"en":"Later, he will arrive in Velen, a dangerous land.","zh":"之後，他會抵達危險的威倫。"},{"en":"What is your plan for the next quest?","zh":"你下一個任務的計畫是什麼？"}],"patterns":[{"pattern":"be going to + 原形動詞","usage":"已經想好的計畫或打算；going to 口語常念 gonna","example_en":"I'm going to leave tomorrow.","example_zh":"我明天要離開。"},{"pattern":"will + 原形動詞","usage":"說話當下才決定、答應或保證；常縮寫成 I'll [aɪl]","example_en":"Fine. I'll leave at dawn.","example_zh":"好吧，我黎明就走。"},{"pattern":"will probably / maybe … will","usage":"預測未來；probably 放在 will 後面（台灣人常放錯位置）","example_en":"It will probably rain tonight.","example_zh":"今晚大概會下雨。"}],"words":["plan","going to","leave","tomorrow","tonight","next","maybe","probably","soon","return","arrive","decide","promise","Velen"]},{"n":28,"title":"第 28 課　委託人的故事","added":"2026-09-27","story":[{"en":"This notice is from a woman who lives in the village.","zh":"這張告示來自一個住在村子裡的女人。"},{"en":"She is a widow. Her husband was a farmer.","zh":"她是寡婦，她的丈夫是個農夫。"},{"en":"Something is killing her sheep at night.","zh":"有東西在晚上殺她的羊。"},{"en":"The villagers say it is a wolf that came from the forest.","zh":"村民說那是從森林來的狼。"},{"en":"But the footprints that Geralt finds are not a wolf's.","zh":"但傑洛特找到的腳印不是狼的。"},{"en":"He looks for someone who saw the monster.","zh":"他尋找看過那隻怪物的人。"},{"en":"A boy who works on the farm says it lives in an old cellar.","zh":"一個在農場工作的男孩說，牠住在一個老地窖裡。"},{"en":"It is a ghoul, a monster which eats dead bodies.","zh":"那是食屍鬼，一種吃屍體的怪物。"},{"en":"The woman wants to hire Geralt, but she can't pay much.","zh":"那女人想僱用傑洛特，但她付不了多少錢。"},{"en":"Someone also tried to steal her last coins.","zh":"還有人想偷她最後的幾枚錢幣。"},{"en":"Will Geralt help a woman who has almost nothing?","zh":"傑洛特會幫助一個幾乎一無所有的女人嗎？"}],"patterns":[{"pattern":"人 + who + 動詞","usage":"「…的人」：用 who 把說明放在人的後面（中文放前面，英文放後面）","example_en":"A woman who lives in the village needs help.","example_zh":"一個住在村子裡的女人需要幫忙。"},{"pattern":"東西／動物 + which / that + 動詞","usage":"「…的東西」：物和動物用 which 或 that；口語 that 最常用","example_en":"It's a monster that kills sheep.","example_zh":"那是一隻會殺羊的怪物。"},{"pattern":"someone who + 動詞","usage":"「一個…的人」：找人、問人時很常用","example_en":"I'm looking for someone who saw it.","example_zh":"我在找看過牠的人。"}],"words":["woman","village","farmer","widow","husband","sheep","wolf","kill","steal","someone","cellar","pay","hire","ghoul"]},{"n":29,"title":"第 29 課　酒館裡的騷動","added":"2026-09-27","story":[{"en":"Last night, Geralt was sitting in the tavern.","zh":"昨晚，傑洛特正坐在酒館裡。"},{"en":"He was drinking beer and playing Gwent.","zh":"他正在喝啤酒、玩昆特牌。"},{"en":"Some soldiers were singing at the next table.","zh":"隔壁桌有幾個士兵正在唱歌。"},{"en":"Suddenly, there was a loud noise.","zh":"突然傳來一聲巨響。"},{"en":"A drunk man fell on the floor.","zh":"一個醉漢跌倒在地上。"},{"en":"He jumped up and shouted at Geralt.","zh":"他跳起來對傑洛特大吼。"},{"en":"A woman screamed.","zh":"一個女人尖叫。"},{"en":"Geralt was finishing his game when the man hit the table.","zh":"傑洛特正要打完這局牌時，那男人拍了桌子。"},{"en":"It became a brawl.","zh":"場面變成了一場鬥毆。"},{"en":"While they were fighting, a thief escaped through the window.","zh":"他們打架的時候，一個小偷從窗戶逃走了。"},{"en":"Nobody saw him. But Geralt did.","zh":"沒人看到他，但傑洛特看到了。"}],"patterns":[{"pattern":"was / were + V-ing","usage":"過去進行式：過去某個時間點「正在」做的事；he/she/I 用 was，you/they 用 were","example_en":"He was drinking beer.","example_zh":"他當時正在喝啤酒。"},{"pattern":"was V-ing … when + 過去式","usage":"正在做 A 的時候，B 突然發生（長的動作用進行式，突然的動作用過去式）","example_en":"He was playing Gwent when the man shouted.","example_zh":"他正在玩昆特牌時，那個人大吼。"},{"pattern":"While + was/were V-ing, …","usage":"兩件事同時在進行；while 後面常接進行式","example_en":"While they were fighting, a thief escaped.","example_zh":"他們打架的時候，一個小偷逃走了。"}],"words":["suddenly","while","noise","fall","floor","drunk","jump","shout","scream","table","fight","brawl","escape","window"]}],"review":["crowd","punish","cheer","welcome","which","how","answer","conversation","option","stranger"],"review_label":"10/08 00:00 這一批","scenes":[{"key":"tavern-rumors","title":"Rumors at the Tavern","zh":"酒館打聽消息","where":"Velen・路邊小酒館","intro":"到新村子第一件事：去酒館點東西、跟老闆打聽最近的怪事。遊戲裡很多委託都是這樣開始的。","words":["tavern","innkeeper","beer","bread","crowns","rumor","heard","well","missing","villager","morning"],"lines":[{"who":"Innkeeper","who_zh":"酒館老闆","en":"Welcome, witcher. What can I get you?","zh":"歡迎，獵魔人。要來點什麼？"},{"who":"Geralt","who_zh":"傑洛特","en":"A beer and some bread, please.","zh":"一杯啤酒和一些麵包，麻煩了。"},{"who":"Innkeeper","who_zh":"酒館老闆","en":"That's ten crowns. Anything else?","zh":"十克朗。還需要什麼嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"Information. Heard any rumors lately?","zh":"消息。最近有聽到什麼傳聞嗎？"},{"who":"Innkeeper","who_zh":"酒館老闆","en":"People say something lives in the old well.","zh":"大家說舊井裡住著什麼東西。"},{"who":"Geralt","who_zh":"傑洛特","en":"What kind of something?","zh":"什麼樣的「東西」？"},{"who":"Innkeeper","who_zh":"酒館老闆","en":"Nobody knows. Two villagers went missing last week.","zh":"沒人知道。上週有兩個村民失蹤了。"},{"who":"Geralt","who_zh":"傑洛特","en":"Thanks. I'll take a look in the morning.","zh":"謝了。我明天早上去看看。"}],"spoiler":false,"added":"2026-09-29"},{"key":"take-the-contract","title":"Taking a Contract","zh":"接委託、談報酬","where":"村子的告示板旁","intro":"在告示板看到委託後，去找委託人問清楚狀況，再談價錢。獵魔人一定會先問：幾隻？什麼時候出現？","words":["notice board","contract","drowner","alive","hurt","lake","night","reward","pay","crowns","fine"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"I saw your contract on the notice board.","zh":"我在告示板上看到你的委託。"},{"who":"Villager","who_zh":"村民","en":"Thank the gods! Drowners attacked my brother at the lake.","zh":"謝天謝地！溺屍在湖邊攻擊了我哥哥。"},{"who":"Geralt","who_zh":"傑洛特","en":"Is he still alive?","zh":"他還活著嗎？"},{"who":"Villager","who_zh":"村民","en":"Yes, but he's badly hurt.","zh":"活著，但傷得很重。"},{"who":"Geralt","who_zh":"傑洛特","en":"How many did he see? And when?","zh":"他看到幾隻？什麼時候？"},{"who":"Villager","who_zh":"村民","en":"Three or four. They come out at night.","zh":"三、四隻。牠們晚上才出來。"},{"who":"Geralt","who_zh":"傑洛特","en":"Let's talk about the reward.","zh":"我們來談談報酬吧。"},{"who":"Villager","who_zh":"村民","en":"I can pay you two hundred crowns.","zh":"我可以付你兩百克朗。"},{"who":"Geralt","who_zh":"傑洛特","en":"Make it three hundred. Drowners never come alone.","zh":"三百吧。溺屍從來不會只有一隻。"},{"who":"Villager","who_zh":"村民","en":"Fine, fine. Just kill them, please.","zh":"好啦好啦，拜託你殺了牠們就好。"}],"spoiler":false,"added":"2026-09-29"},{"key":"investigation","title":"Following the Trail","zh":"調查現場","where":"森林邊的小路","intro":"打開獵魔人感官，找腳印、血跡，一路追到怪物的巢穴。這段練習描述你看到的東西。","words":["hunter","corpse","footprint","blood","grass","wolf","trail","toward","cave","haunted","Witcher Senses"],"lines":[{"who":"Hunter","who_zh":"獵人","en":"This is where we found the corpses.","zh":"我們就是在這裡發現屍體的。"},{"who":"Geralt","who_zh":"傑洛特","en":"Let me look around. Witcher Senses should help.","zh":"讓我四處看看。獵魔人感官應該派得上用場。"},{"who":"Geralt","who_zh":"傑洛特","en":"Footprints... and blood on the grass.","zh":"腳印……還有草上的血跡。"},{"who":"Hunter","who_zh":"獵人","en":"A wolf, maybe?","zh":"也許是狼？"},{"who":"Geralt","who_zh":"傑洛特","en":"No. Too big for a wolf.","zh":"不是。以狼來說太大了。"},{"who":"Geralt","who_zh":"傑洛特","en":"The trail leads toward that cave.","zh":"痕跡通往那個洞穴。"},{"who":"Hunter","who_zh":"獵人","en":"Nobody goes in there. People say it's haunted.","zh":"沒人敢進去。大家說那裡鬧鬼。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then I'll go alone. Wait here.","zh":"那我自己進去。你在這裡等。"}],"spoiler":false,"added":"2026-09-29"},{"key":"blacksmith","title":"At the Blacksmith","zh":"鐵匠鋪修裝備","where":"城裡的鐵匠鋪","intro":"修裝備、拿圖紙請鐵匠打造，順便殺價。練習問「能不能…？」「多少錢？」。","words":["blacksmith","sword","repair","armor","crowns","diagram","craft","silver","silver ingot","expensive","discount"],"lines":[{"who":"Blacksmith","who_zh":"鐵匠","en":"Your sword looks tired, witcher.","zh":"你的劍看起來很累了，獵魔人。"},{"who":"Geralt","who_zh":"傑洛特","en":"Can you repair it? My armor too.","zh":"你能修嗎？我的盔甲也要。"},{"who":"Blacksmith","who_zh":"鐵匠","en":"Sure. Forty crowns for both.","zh":"沒問題。兩樣一共四十克朗。"},{"who":"Geralt","who_zh":"傑洛特","en":"I also have a diagram. Can you craft this?","zh":"我還有一張圖紙。你能打造這個嗎？"},{"who":"Blacksmith","who_zh":"鐵匠","en":"A silver sword. I need two silver ingots.","zh":"一把銀劍。我需要兩塊銀錠。"},{"who":"Geralt","who_zh":"傑洛特","en":"I have them here. How much?","zh":"我這裡有。多少錢？"},{"who":"Blacksmith","who_zh":"鐵匠","en":"Three hundred crowns. It's hard work.","zh":"三百克朗。這可是費工的活。"},{"who":"Geralt","who_zh":"傑洛特","en":"That's expensive. Can you give me a discount?","zh":"太貴了。能打個折嗎？"},{"who":"Blacksmith","who_zh":"鐵匠","en":"For a witcher? Two hundred and fifty.","zh":"看在你是獵魔人的份上，兩百五。"}],"spoiler":false,"added":"2026-09-29"},{"key":"herbalist","title":"Buying Herbs","zh":"草藥師買材料","where":"村子的草藥攤","intro":"煉藥水前先補材料。練習「我需要…」「還剩多少？」這類購物句。","words":["herbalist","herb","celandine","mistletoe","rare","bottle","brew","potion","Swallow","heal","toxic"],"lines":[{"who":"Herbalist","who_zh":"草藥師","en":"Looking for herbs, witcher?","zh":"在找草藥嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"I need celandine and mistletoe.","zh":"我需要白屈菜和槲寄生。"},{"who":"Herbalist","who_zh":"草藥師","en":"I have celandine. Mistletoe is rare this year.","zh":"白屈菜有。槲寄生今年很少。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'll take what you have. And two bottles of spirit.","zh":"你有多少我全要。再來兩瓶烈酒。"},{"who":"Herbalist","who_zh":"草藥師","en":"Going to brew a potion?","zh":"要熬藥水嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"Swallow. It helps me heal during a fight.","zh":"燕子藥水。戰鬥時能幫我回血。"},{"who":"Herbalist","who_zh":"草藥師","en":"Careful. Too many potions are toxic.","zh":"小心點。藥水喝太多會中毒。"},{"who":"Geralt","who_zh":"傑洛特","en":"I know. Witchers can take more than most.","zh":"我知道。獵魔人撐得比一般人久。"}],"spoiler":false,"added":"2026-09-29"},{"key":"gwent-game","title":"A Game of Gwent","zh":"酒館打昆特牌","where":"酒館角落的牌桌","intro":"昆特牌是巫師3最紅的小遊戲。練習下注、出牌、喊「過」的說法。","words":["Gwent","crowns","card","spy card","row","pass","round","weather","close combat","clear weather"],"lines":[{"who":"Player","who_zh":"牌友","en":"Fancy a game of Gwent, witcher?","zh":"來一局昆特牌嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"Sure. What are we playing for?","zh":"好啊。我們賭什麼？"},{"who":"Player","who_zh":"牌友","en":"Ten crowns. The winner also gets a card.","zh":"十克朗，贏的人還能拿一張牌。"},{"who":"Geralt","who_zh":"傑洛特","en":"Deal.","zh":"成交。"},{"who":"Player","who_zh":"牌友","en":"I play a spy card on your row.","zh":"我在你那一排打一張間諜牌。"},{"who":"Geralt","who_zh":"傑洛特","en":"Thanks for the two extra cards.","zh":"謝謝你多送我兩張牌。"},{"who":"Player","who_zh":"牌友","en":"Hmm. I pass.","zh":"嗯……我過。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then this round is mine.","zh":"那這一回合是我的了。"},{"who":"Player","who_zh":"牌友","en":"Frost on your close combat row!","zh":"你的近戰排下霜凍！"},{"who":"Geralt","who_zh":"傑洛特","en":"Clear weather. Your frost is gone.","zh":"晴天。你的霜凍沒了。"}],"spoiler":false,"added":"2026-09-29"},{"key":"bandits-on-the-road","title":"Bandits on the Road","zh":"路上遇到強盜","where":"荒野的小路","intro":"騎著蘿蔔趕路，突然被強盜攔下。短句多、語氣強，很適合練語調。","words":["bandit","road","gold","sword","Roach","listen","fight"],"lines":[{"who":"Bandit","who_zh":"強盜","en":"Stop right there, witcher!","zh":"站住，獵魔人！"},{"who":"Geralt","who_zh":"傑洛特","en":"What do you want?","zh":"你們想幹嘛？"},{"who":"Bandit","who_zh":"強盜","en":"Your horse, your gold, and your swords.","zh":"你的馬、你的錢，還有你的劍。"},{"who":"Geralt","who_zh":"傑洛特","en":"Leave Roach out of this.","zh":"別把蘿蔔扯進來。"},{"who":"Bandit","who_zh":"強盜","en":"There are five of us. You're alone.","zh":"我們有五個人，你只有一個。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then you should run. I don't want to fight.","zh":"那你們最好快跑。我不想打。"},{"who":"Bandit","who_zh":"強盜","en":"Get him!","zh":"上！"},{"who":"Geralt","who_zh":"傑洛特","en":"You should have listened.","zh":"你們早該聽我的。"}],"spoiler":false,"added":"2026-09-29"},{"key":"kaer-morhen-training","title":"Training at Kaer Morhen","zh":"凱爾莫罕練劍","where":"凱爾莫罕的練武場","intro":"老師維瑟米爾陪傑洛特練劍。練習命令句（Dodge! Use Quen!）和獵魔人的基本常識。","words":["Vesemir","Kaer Morhen","dodge","Quen","shield","magic","wraith","silver","steel","attack","practice"],"lines":[{"who":"Vesemir","who_zh":"維瑟米爾","en":"Again, Geralt. Practice makes perfect.","zh":"再來一次，傑洛特。熟能生巧。"},{"who":"Geralt","who_zh":"傑洛特","en":"You're fast for an old man.","zh":"以老頭子來說，你還真快。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"Old? Watch your mouth. Now, dodge!","zh":"老？說話小心點。現在，閃！"},{"who":"Geralt","who_zh":"傑洛特","en":"Too slow, Vesemir.","zh":"太慢了，維瑟米爾。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"Good. Now cast Quen before I attack.","zh":"很好。在我攻擊前施放昆恩。"},{"who":"Geralt","who_zh":"傑洛特","en":"A shield of magic. Got it.","zh":"一層魔法護盾。知道了。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"And never fight a wraith without silver.","zh":"還有，絕對別不帶銀劍就去打怨靈。"},{"who":"Geralt","who_zh":"傑洛特","en":"Steel for people, silver for monsters.","zh":"鋼劍對人，銀劍對怪物。"}],"spoiler":false,"added":"2026-09-29"},{"key":"selling-loot","title":"Selling Loot","zh":"跟商人賣戰利品","where":"諾維格瑞的市集","intro":"背包太重（encumbered）就去找商人賣東西。練習討價還價的來回。","words":["merchant","sell","pelt","crowns","worth","offer","bargain","map","buy","sword"],"lines":[{"who":"Merchant","who_zh":"商人","en":"What do you have for me today?","zh":"今天有什麼要賣給我？"},{"who":"Geralt","who_zh":"傑洛特","en":"Some old swords and a few pelts.","zh":"一些舊劍和幾張獸皮。"},{"who":"Merchant","who_zh":"商人","en":"Fifty crowns for everything.","zh":"全部五十克朗。"},{"who":"Geralt","who_zh":"傑洛特","en":"Fifty? The pelts alone are worth more.","zh":"五十？光獸皮就不只這個價。"},{"who":"Merchant","who_zh":"商人","en":"Sixty. That's my best offer.","zh":"六十，這是我最好的出價。"},{"who":"Geralt","who_zh":"傑洛特","en":"Seventy, and I'll buy your map too.","zh":"七十，我順便買你的地圖。"},{"who":"Merchant","who_zh":"商人","en":"You drive a hard bargain, witcher.","zh":"你真會殺價，獵魔人。"},{"who":"Geralt","who_zh":"傑洛特","en":"I've had practice.","zh":"練過的。"}],"spoiler":false,"added":"2026-09-29"},{"key":"white-orchard-griffin","title":"The Griffin of White Orchard","zh":"白果園打聽獅鷲","where":"白果園的酒館與村子","intro":"遊戲一開場，傑洛特在白果園打聽一隻危害村子的獅鷲。練習問「在哪裡、什麼時候」和描述情緒（nervous、afraid、calm、grateful）。","words":["griffin","innkeeper","nervous","afraid","calm","reward","crossbow","grateful","village"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"I heard about a griffin. Where does it hunt?","zh":"我聽說有隻獅鷲。牠在哪裡獵食？"},{"who":"Innkeeper","who_zh":"旅店老闆","en":"Near the fields. Everyone is nervous.","zh":"在田野附近。大家都很緊張。"},{"who":"Villager","who_zh":"村民","en":"I am afraid to leave the village.","zh":"我不敢離開村子。"},{"who":"Geralt","who_zh":"傑洛特","en":"Stay calm. I will find it.","zh":"保持冷靜。我會找到牠。"},{"who":"Innkeeper","who_zh":"旅店老闆","en":"Is there a reward for you?","zh":"你有報酬可拿嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"There is. Witchers don't work for free.","zh":"有。獵魔人可不做白工。"},{"who":"Villager","who_zh":"村民","en":"How do you fight a flying beast?","zh":"你要怎麼對付會飛的野獸？"},{"who":"Geralt","who_zh":"傑洛特","en":"With my crossbow. It falls, then I strike.","zh":"用我的十字弓。牠掉下來，我再出手。"},{"who":"Innkeeper","who_zh":"旅店老闆","en":"We will be grateful, witcher.","zh":"我們會很感激你的，獵魔人。"}],"spoiler":false,"added":"2026-09-30"},{"key":"barber-shave","title":"At the Barber","zh":"理髮店刮鬍子","where":"城鎮裡的理髮店","intro":"傑洛特的鬍子會隨時間長長，到理髮店可以刮鬍子、換髮型。練習問價錢（How much）和描述長短（short、long）。","words":["barber","beard","hair","short","price","crowns","cheap","face"],"lines":[{"who":"Barber","who_zh":"理髮師","en":"Welcome, witcher! Please, sit down.","zh":"歡迎，獵魔人！請坐。"},{"who":"Geralt","who_zh":"傑洛特","en":"My beard is too long. Can you shave it?","zh":"我的鬍子太長了。你能幫我刮掉嗎？"},{"who":"Barber","who_zh":"理髮師","en":"Of course. And your hair?","zh":"當然。那頭髮呢？"},{"who":"Geralt","who_zh":"
