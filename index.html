傑洛特","en":"Keep it short. How much?","zh":"剪短就好。多少錢？"},{"who":"Barber","who_zh":"理髮師","en":"The price is twenty crowns.","zh":"價錢是二十克朗。"},{"who":"Geralt","who_zh":"傑洛特","en":"That's not cheap.","zh":"這可不便宜。"},{"who":"Barber","who_zh":"理髮師","en":"But your face will look new!","zh":"但你的臉會煥然一新！"},{"who":"Geralt","who_zh":"傑洛特","en":"Fine. Just be careful with the razor.","zh":"好吧。用剃刀小心點就好。"}],"spoiler":false,"added":"2026-09-30"},{"key":"horse-race","title":"Horse Race","zh":"賽馬報名","where":"村外的賽馬起點","intro":"在威倫、諾維格瑞和史凱利傑都能找到賽馬主辦人，下注後騎 Roach 和對手比賽。練習「下注、輸贏、時間」的簡單句型。","words":["bet","coin","roach","saddle","lose","today","before","after","late"],"lines":[{"who":"Race Master","who_zh":"賽馬主辦人","en":"Want to race today, witcher?","zh":"今天想賽馬嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"How much is the bet?","zh":"賭注多少？"},{"who":"Race Master","who_zh":"賽馬主辦人","en":"Fifty coin. Winner takes it all.","zh":"五十枚錢幣，贏家全拿。"},{"who":"Geralt","who_zh":"傑洛特","en":"Fine. Roach is ready.","zh":"好，蘿蔔準備好了。"},{"who":"Race Master","who_zh":"賽馬主辦人","en":"Check your saddle before the start.","zh":"開跑前檢查一下你的馬鞍。"},{"who":"Rider","who_zh":"對手騎士","en":"You will lose, old man.","zh":"你會輸的，老頭。"},{"who":"Geralt","who_zh":"傑洛特","en":"We'll talk after the race.","zh":"比完再說。"},{"who":"Race Master","who_zh":"賽馬主辦人","en":"Go! Don't be late at the end!","zh":"出發！終點別落後啦！"}],"spoiler":false,"added":"2026-09-30"},{"key":"fistfight","title":"Tavern Fistfight","zh":"酒館拳擊","where":"酒館後面的空地","intro":"威倫、諾維格瑞、史凱利傑都有拳擊擂台，下注後赤手空拳比一場（支線「Fists of Fury」系列）。練習打招呼、下注和打完後的客套話。","words":["greetings","tavern","bet","crowns","fight","hold on","all right","not bad","take care","let's go"],"lines":[{"who":"Fighter","who_zh":"拳手","en":"Greetings, witcher. Want a fight?","zh":"你好，獵魔人。想打一場嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"How much is the bet?","zh":"賭注多少？"},{"who":"Fighter","who_zh":"拳手","en":"Fifty crowns. No swords, just fists.","zh":"五十克朗。不准用劍，只用拳頭。"},{"who":"Geralt","who_zh":"傑洛特","en":"All right. Let's go.","zh":"好吧，來吧。"},{"who":"Tavern Keeper","who_zh":"酒館老闆","en":"Hold on! Not in my tavern!","zh":"等一下！別在我店裡打！"},{"who":"Fighter","who_zh":"拳手","en":"Fine. We fight outside.","zh":"好啦，我們去外面打。"},{"who":"Fighter","who_zh":"拳手","en":"Ugh... Not bad, witcher. Here's your money.","zh":"唉……不賴嘛，獵魔人。錢給你。"},{"who":"Geralt","who_zh":"傑洛特","en":"Take care of that nose.","zh":"好好照顧你的鼻子。"}],"spoiler":false,"added":"2026-09-30"},{"key":"bloody-baron-keep","title":"At the Baron's Gate","zh":"在男爵城堡門口通報","where":"威倫・鴉巢（Crow's Perch）城門","intro":"主線來到威倫，傑洛特要進鴉巢見血腥男爵打聽消息。練習報上身分、說明來意、被盤問時的簡短回答。","words":["witcher","baron","talk","search","sword","guard","captain","inside","crow's perch","all right"],"lines":[{"who":"Guard","who_zh":"守衛","en":"Halt! Who goes there?","zh":"站住！來者何人？"},{"who":"Geralt","who_zh":"傑洛特","en":"A witcher. I need to talk to the Baron.","zh":"獵魔人。我需要跟男爵談談。"},{"who":"Guard","who_zh":"守衛","en":"The Baron is busy. What do you want?","zh":"男爵很忙。你要幹嘛？"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm searching for someone. He may know something.","zh":"我在找一個人。他可能知道些什麼。"},{"who":"Guard","who_zh":"守衛","en":"Keep your sword on your back, witcher.","zh":"劍留在背上，獵魔人。"},{"who":"Geralt","who_zh":"傑洛特","en":"All right. No trouble.","zh":"好。不找麻煩。"},{"who":"Guard","who_zh":"守衛","en":"Guards! Call the captain!","zh":"衛兵！叫隊長來！"},{"who":"Captain","who_zh":"隊長","en":"Welcome to Crow's Perch. Come inside.","zh":"歡迎來到鴉巢。進來吧。"},{"who":"Geralt","who_zh":"傑洛特","en":"Thanks. Lead the way.","zh":"謝了。帶路吧。"}],"spoiler":false,"added":"2026-09-30"},{"key":"crones-warning","title":"The Crones' Warning","zh":"沼澤老婦的警告","where":"威倫・歪背沼澤（Crookback Bog）","spoiler":true,"intro":"主線在威倫找人時，傑洛特會來到歪背沼澤見「森林女士」。練習問人、談條件、拒絕威脅的短句。","words":["witcher","Ladies of the Wood","swamp","price","leave","Crookback Bog","Crones"],"lines":[{"who":"Crone","who_zh":"老婦","en":"Welcome, witcher. We have waited for you.","zh":"歡迎，獵魔人。我們等你很久了。"},{"who":"Geralt","who_zh":"傑洛特","en":"Who are you?","zh":"你們是誰？"},{"who":"Crone","who_zh":"老婦","en":"We are the Ladies of the Wood.","zh":"我們是森林女士。"},{"who":"Crone","who_zh":"老婦","en":"This swamp is ours. Everything here is ours.","zh":"這片沼澤是我們的。這裡的一切都是我們的。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm looking for a girl. Have you seen her?","zh":"我在找一個女孩。你們見過她嗎？"},{"who":"Crone","who_zh":"老婦","en":"Maybe. But every answer has a price.","zh":"也許。但每個答案都有代價。"},{"who":"Geralt","who_zh":"傑洛特","en":"Name your price.","zh":"開價吧。"},{"who":"Crone","who_zh":"老婦","en":"Leave Crookback Bog, and you will never find her.","zh":"離開歪背沼澤，你就永遠找不到她。"},{"who":"Geralt","who_zh":"傑洛特","en":"I won't leave. Not without answers.","zh":"我不走。沒拿到答案不走。"}],"added":"2026-09-30"},{"key":"ferry-crossing","title":"Crossing the River","zh":"搭船過河","where":"威倫的河邊渡口","intro":"在威倫跑任務常要過河。練習問價錢、講條件、提醒危險的短句。","words":["river","cross","pay","crowns","drowner","fog","dangerous","Roach","far"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"I need to cross the river.","zh":"我需要過河。"},{"who":"Ferryman","who_zh":"船夫","en":"It will cost you ten crowns.","zh":"要十克朗。"},{"who":"Geralt","who_zh":"傑洛特","en":"Ten? That's a lot.","zh":"十克朗？很貴耶。"},{"who":"Ferryman","who_zh":"船夫","en":"The river is dangerous now. Drowners everywhere.","zh":"現在河上很危險，到處都是溺屍鬼。"},{"who":"Geralt","who_zh":"傑洛特","en":"Fine. I'll pay.","zh":"好吧，我付。"},{"who":"Ferryman","who_zh":"船夫","en":"Your horse can't come. No room.","zh":"你的馬不能上船，沒位子。"},{"who":"Geralt","who_zh":"傑洛特","en":"Roach will find me. She always does.","zh":"蘿蔔會找到我的，她每次都會。"},{"who":"Ferryman","who_zh":"船夫","en":"The fog is coming. Sit down and hold on.","zh":"起霧了。坐好，抓緊。"},{"who":"Geralt","who_zh":"傑洛特","en":"How far is the other side?","zh":"對岸還有多遠？"},{"who":"Ferryman","who_zh":"船夫","en":"Not far. Pray the drowners are asleep.","zh":"不遠。祈禱溺屍鬼在睡覺吧。"}],"spoiler":false,"added":"2026-09-30"},{"key":"army-checkpoint","title":"The Army Checkpoint","zh":"尼弗迦德軍隊盤查","where":"威倫路上的尼弗迦德崗哨","intro":"威倫一帶有尼弗迦德軍隊駐守，路上常被黑衣士兵攔下盤問。練習自我介紹、說明來意、回應命令。","words":["soldier","witcher","hunt","Nilfgaard","war","hold","sword","silver","peace","empire"],"lines":[{"who":"Soldier","who_zh":"士兵","en":"Halt! Who goes there?","zh":"站住！是誰？"},{"who":"Geralt","who_zh":"傑洛特","en":"Geralt of Rivia. A witcher.","zh":"利維亞的傑洛特，獵魔人。"},{"who":"Soldier","who_zh":"士兵","en":"A witcher? What are you doing here?","zh":"獵魔人？你來這裡做什麼？"},{"who":"Geralt","who_zh":"傑洛特","en":"I hunt monsters. Nothing more.","zh":"我獵怪物，就這樣。"},{"who":"Soldier","who_zh":"士兵","en":"This land belongs to Nilfgaard now.","zh":"這片土地現在屬於尼弗迦德了。"},{"who":"Geralt","who_zh":"傑洛特","en":"I don't care about your war.","zh":"我不在乎你們的戰爭。"},{"who":"Officer","who_zh":"軍官","en":"Hold on. Show me your sword.","zh":"等等，把你的劍給我看。"},{"who":"Geralt","who_zh":"傑洛特","en":"Silver. For monsters, not soldiers.","zh":"銀劍。砍怪物用的，不是砍士兵。"},{"who":"Officer","who_zh":"軍官","en":"Keep the peace. The empire is watching.","zh":"別惹事。帝國在看著你。"}],"spoiler":false,"added":"2026-10-01"},{"key":"city-gate","title":"At the City Gate","zh":"諾維格瑞城門盤查","where":"諾維格瑞城門口","intro":"第一次進諾維格瑞時，城門守衛會盤問來意。這座城由永恆之火教會掌控，魔法被禁止。練習說明來意、回答搜身與付錢入城。","words":["guard","city","Novigrad","witcher","sword","contract","magic","Eternal Fire","potion","search","coin","enter","pass"],"lines":[{"who":"Guard","who_zh":"守衛","en":"Stop there. Why do you come to Novigrad?","zh":"站住。你來諾維格瑞做什麼？"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm a witcher. I'm looking for a contract.","zh":"我是獵魔人，來找委託的。"},{"who":"Guard","who_zh":"守衛","en":"Any magic on you? It's forbidden here.","zh":"身上有魔法的東西嗎？這裡禁止魔法。"},{"who":"Geralt","who_zh":"傑洛特","en":"Just a sword and some potions.","zh":"只有一把劍和一些藥水。"},{"who":"Guard","who_zh":"守衛","en":"We must search your bag.","zh":"我們得搜你的包包。"},{"who":"Geralt","who_zh":"傑洛特","en":"Go ahead. Nothing to hide.","zh":"請便，沒什麼好藏的。"},{"who":"Guard","who_zh":"守衛","en":"Fine. Five coins to enter the city.","zh":"好。進城要五枚錢幣。"},{"who":"Geralt","who_zh":"傑洛特","en":"Here. Can I pass now?","zh":"給你。我現在可以過了嗎？"},{"who":"Guard","who_zh":"守衛","en":"Pass. The Eternal Fire watches you.","zh":"過吧。永恆之火看著你。"}],"spoiler":false,"added":"2026-10-01"},{"key":"witch-hunters","title":"Stopped by Witch Hunters","zh":"被獵巫人攔下","where":"諾維格瑞街頭","intro":"在諾維格瑞，獵巫人會在街上盤問可疑的人，搜捕法師和女術士。練習 Where are you going? 和 I only... 句型。","words":["hunter","mage","sorceress","burn","rat"],"lines":[{"who":"Witch Hunter","who_zh":"獵巫人","en":"Halt! Where are you going, witcher?","zh":"站住！你要去哪裡，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"To the market. Is that a crime?","zh":"去市場。這也犯法嗎？"},{"who":"Witch Hunter","who_zh":"獵巫人","en":"We hunt mages and sorceresses here.","zh":"我們在這裡追捕法師和女術士。"},{"who":"Witch Hunter","who_zh":"獵巫人","en":"Do you know any mages?","zh":"你認識任何法師嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"No. I only hunt monsters.","zh":"不認識。我只獵殺怪物。"},{"who":"Witch Hunter","who_zh":"獵巫人","en":"Mages are worse than monsters.","zh":"法師比怪物還糟。"},{"who":"Geralt","who_zh":"傑洛特","en":"Some hunters are worse than rats.","zh":"有些獵人比老鼠還糟。"},{"who":"Witch Hunter","who_zh":"獵巫人","en":"Watch your tongue, or you will burn.","zh":"小心說話，不然你會被燒死。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'll keep that in mind.","zh":"我會記住的。"}],"spoiler":false,"added":"2026-10-01"},{"key":"bank-exchange","title":"At the Vivaldi Bank","zh":"諾維格瑞的維瓦第銀行","where":"諾維格瑞・維瓦第銀行","intro":"諾維格瑞的維瓦第銀行由矮人銀行家經營。練習 I'd like to... 和 How much...? 這兩個辦事句型。","words":["entrance","upstairs","dwarf","crowns","coin","loan","debt"],"lines":[{"who":"Clerk","who_zh":"行員","en":"Welcome to the Vivaldi Bank.","zh":"歡迎光臨維瓦第銀行。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'd like to see the owner.","zh":"我想見老闆。"},{"who":"Clerk","who_zh":"行員","en":"Master Vivaldi is upstairs. He is busy.","zh":"維瓦第先生在樓上，他正在忙。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then I'll wait by the entrance.","zh":"那我在門口等。"},{"who":"Clerk","who_zh":"行員","en":"Do you need a loan, witcher?","zh":"你需要貸款嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"No. I only want to change some coins.","zh":"不用。我只想換點錢幣。"},{"who":"Clerk","who_zh":"行員","en":"We pay in crowns. The dwarf counts every coin.","zh":"我們付克朗。那位矮人每一枚都會算清楚。"},{"who":"Geralt","who_zh":"傑洛特","en":"Fair enough. I hate debt.","zh":"還算公道。我討厭欠債。"}],"spoiler":false,"added":"2026-10-03"},{"key":"auction","title":"At the Auction House","zh":"奧森弗特拍賣會","where":"奧森弗特・拍賣行","intro":"奧森弗特的拍賣行常拍賣稀有武器和古董。練習喊價的 I bid... 和 How much...? 句型，以及形容物品的形容詞。","words":["rare","sword","sharp","crowns","mysterious","useless","wise"],"lines":[{"who":"Auctioneer","who_zh":"拍賣官","en":"Next, a rare sword from the north!","zh":"下一件，來自北方的稀有寶劍！"},{"who":"Auctioneer","who_zh":"拍賣官","en":"Look at the blade. It is still sharp.","zh":"看看這劍刃，依然鋒利。"},{"who":"Geralt","who_zh":"傑洛特","en":"How much does it start at?","zh":"起標價多少？"},{"who":"Auctioneer","who_zh":"拍賣官","en":"Five hundred crowns.","zh":"五百克朗。"},{"who":"Rich Man","who_zh":"富商","en":"Six hundred! It looks mysterious.","zh":"六百！它看起來很神祕。"},{"who":"Geralt","who_zh":"傑洛特","en":"I bid seven hundred.","zh":"我出七百。"},{"who":"Rich Man","who_zh":"富商","en":"Why? A sword is useless in your hands.","zh":"為什麼？劍在你手裡沒用。"},{"who":"Geralt","who_zh":"傑洛特","en":"A wise man doesn't say that to a witcher.","zh":"聰明人不會對獵魔人這樣說。"},{"who":"Auctioneer","who_zh":"拍賣官","en":"Sold, to the witcher!","zh":"成交，由獵魔人得標！"}],"spoiler":false,"added":"2026-10-04"},{"key":"theater","title":"Backstage at the Theater","zh":"劇院後台","where":"諾維格瑞・劇院後台","intro":"諾維格瑞的劇院常有吟遊詩人和演員出入，獵魔人在這裡打聽消息。練習 I'm looking for... 找人句型、祈使句 Be quiet. 和 whisper / warn 的用法。","words":["look for","bard","whisper","quiet","warn","hide","wander"],"lines":[{"who":"Stagehand","who_zh":"後台工作人員","en":"Hey! No one goes backstage.","zh":"喂！後台禁止進入。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm looking for a bard.","zh":"我在找一位吟遊詩人。"},{"who":"Stagehand","who_zh":"後台工作人員","en":"Be quiet. The play has started.","zh":"安靜點，戲已經開演了。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then whisper. Where is he?","zh":"那就小聲說。他在哪？"},{"who":"Stagehand","who_zh":"後台工作人員","en":"He likes to wander around the city.","zh":"他喜歡在城裡到處閒晃。"},{"who":"Stagehand","who_zh":"後台工作人員","en":"But some men came to look for him too.","zh":"不過也有些人來找過他。"},{"who":"Geralt","who_zh":"傑洛特","en":"Did they warn you?","zh":"他們有警告你嗎？"},{"who":"Stagehand","who_zh":"後台工作人員","en":"Yes. Now I hide when they come.","zh":"有。現在他們一來我就躲起來。"},{"who":"Geralt","who_zh":"傑洛特","en":"Smart. Thank you.","zh":"聰明。謝了。"}],"spoiler":false,"added":"2026-10-04"},{"key":"university","title":"Questions at the University","zh":"奧森弗特大學問教授","where":"奧森弗特・大學校園","intro":"奧森弗特是北方最有名的大學城，任務常要去找教授問事情。這段練習問「最後一次看到他是什麼時候」、描述線索的句子，順便複習這次新學的 witness、suspect。","words":["Oxenfurt","missing","witness","night","book","clue","suspect","history"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"Professor, a student of yours is missing.","zh":"教授，你的一個學生失蹤了。"},{"who":"Professor","who_zh":"教授","en":"Yes, Tomas. He studies history.","zh":"對，托馬斯。他念歷史。"},{"who":"Geralt","who_zh":"傑洛特","en":"When did you last see him?","zh":"你最後一次看到他是什麼時候？"},{"who":"Professor","who_zh":"教授","en":"Three nights ago, in the library.","zh":"三天前的晚上，在圖書館。"},{"who":"Geralt","who_zh":"傑洛特","en":"Was there a witness?","zh":"有目擊者嗎？"},{"who":"Professor","who_zh":"教授","en":"The old guard saw him leave with a book.","zh":"老守衛看到他帶著一本書離開。"},{"who":"Geralt","who_zh":"傑洛特","en":"What book?","zh":"什麼書？"},{"who":"Professor","who_zh":"教授","en":"An old book about monsters in Oxenfurt.","zh":"一本講奧森弗特怪物的老書。"},{"who":"Geralt","who_zh":"傑洛特","en":"That's a clue. Do you have a suspect?","zh":"這是條線索。你有懷疑的人嗎？"},{"who":"Professor","who_zh":"教授","en":"No. Please find him, witcher.","zh":"沒有。拜託找到他，獵魔人。"}],"spoiler":false,"added":"2026-10-04"},{"key":"harbor","title":"Finding a Ship at the Harbor","zh":"港口找船","where":"諾維格瑞・港口","intro":"要從諾維格瑞去史凱利傑群島，就得在港口找願意出海的船長。這段練習問價錢、問出發時間，順便複習這次新學的 flee、friend。","words":["harbor","captain","Skellige","how much","crowns","storm","siren","flee","friend","tomorrow"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"Captain, are you sailing to Skellige?","zh":"船長，你要開船去史凱利傑嗎？"},{"who":"Captain","who_zh":"船長","en":"Maybe. Who's asking?","zh":"也許吧。誰在問？"},{"who":"Geralt","who_zh":"傑洛特","en":"A witcher. How much for one passenger?","zh":"一個獵魔人。載一個人要多少錢？"},{"who":"Captain","who_zh":"船長","en":"Two hundred crowns. The sea is dangerous.","zh":"兩百克朗。海上很危險。"},{"who":"Geralt","who_zh":"傑洛特","en":"Storms?","zh":"有暴風雨嗎？"},{"who":"Captain","who_zh":"船長","en":"Storms and sirens. Last week, my sailors had to flee.","zh":"暴風雨，還有塞壬。上週我的水手只能逃命。"},{"who":"Geralt","who_zh":"傑洛特","en":"Sirens don't scare me. I'll pay.","zh":"塞壬嚇不了我。我付錢。"},{"who":"Captain","who_zh":"船長","en":"Good. We leave the harbor tomorrow morning.","zh":"很好。我們明天早上離港。"},{"who":"Geralt","who_zh":"傑洛特","en":"Can my friend come too?","zh":"我朋友也可以一起來嗎？"},{"who":"Captain","who_zh":"船長","en":"Sure, if he pays. No crowns, no ship.","zh":"可以，只要他付錢。沒錢就沒船。"}],"spoiler":false,"added":"2026-10-04"},{"key":"gwent-tournament","title":"Signing Up for a Gwent Tournament","zh":"昆特牌大賽報名","where":"諾維格瑞的旅店","intro":"諾維格瑞等城市會舉辦昆特牌大賽，報名後和各地高手對戰、贏取稀有卡牌。練習報名、自我介紹和「看情況」這類回應。","words":["gwent","tournament","fee","round","deck","who are you","it depends","trust me","calm down"],"lines":[{"who":"Organizer","who_zh":"主辦人","en":"Welcome! Are you here for the gwent tournament?","zh":"歡迎！你是來參加昆特牌大賽的嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"I am. Where can I sign up?","zh":"是的。我要在哪裡報名？"},{"who":"Organizer","who_zh":"主辦人","en":"Right here. Who are you, sir?","zh":"就在這裡。請問您是哪位？"},{"who":"Geralt","who_zh":"傑洛特","en":"Geralt of Rivia. Here's my fee.","zh":"利維亞的傑洛特。這是我的報名費。"},{"who":"Player","who_zh":"牌手","en":"A witcher? Do you even know the rules?","zh":"獵魔人？你真的懂規則嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"Win two rounds, win the game.","zh":"贏兩局，就贏整場。"},{"who":"Player","who_zh":"牌手","en":"Hmm. Is your deck any good?","zh":"嗯。你的牌組厲害嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"It depends. Trust me, you'll see.","zh":"看情況。相信我，你會知道的。"},{"who":"Organizer","who_zh":"主辦人","en":"Calm down, both of you. Take your seats.","zh":"兩位都冷靜點。請入座。"},{"who":"Player","who_zh":"牌手","en":"Fine. Good luck, witcher.","zh":"好吧。祝你好運，獵魔人。"}],"spoiler":false,"added":"2026-10-04"},{"key":"skellige-boat","title":"Rowing Out to Sea","zh":"划船出海遇塞壬","where":"史凱利傑的海岸","intro":"在史凱利傑跑島常要划小船出海，海上會有塞壬撲過來攻擊船。練習「等一下」「射牠」這類短指令。","words":["sea","storm","rock","siren","crossbow","shoot","sink","wait","fisherman"],"lines":[{"who":"Fisherman","who_zh":"漁夫","en":"Going out to sea, witcher?","zh":"要出海嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"Yes. I need to reach the next island.","zh":"對，我要到下一座島。"},{"who":"Fisherman","who_zh":"漁夫","en":"Wait. A storm is coming.","zh":"等等，暴風雨要來了。"},{"who":"Geralt","who_zh":"傑洛特","en":"I can't wait. I'll row fast.","zh":"我等不了，我會划快一點。"},{"who":"Fisherman","who_zh":"漁夫","en":"Watch out for the rocks. And sirens.","zh":"小心礁石，還有塞壬。"},{"who":"Geralt","who_zh":"傑洛特","en":"If they come, I'll shoot them.","zh":"牠們來了，我就射下來。"},{"who":"Fisherman","who_zh":"漁夫","en":"Good. Use your crossbow.","zh":"很好，用你的十字弩。"},{"who":"Fisherman","who_zh":"漁夫","en":"And don't let my boat sink!","zh":"還有別讓我的船沉了！"}],"spoiler":false,"added":"2026-10-04"},{"key":"feast","title":"A Feast in the Hall","zh":"長廳裡的維京式宴會","where":"史凱利傑的長廳","intro":"史凱利傑人愛辦宴會，大家舉杯敬酒、喝蜂蜜酒、吹噓戰功。練習敬酒，以及婉拒「再來一杯」的說法。","words":["feast","toast","mead","jarl","drink","hero","honor","drunk"],"lines":[{"who":"Warrior","who_zh":"戰士","en":"Witcher! Sit down and drink with us!","zh":"獵魔人！坐下來跟我們喝一杯！"},{"who":"Geralt","who_zh":"傑洛特","en":"Thanks. What are we drinking?","zh":"謝了，我們喝什麼？"},{"who":"Warrior","who_zh":"戰士","en":"Mead, of course. The best in Skellige.","zh":"當然是蜂蜜酒，史凱利傑最好的。"},{"who":"Jarl","who_zh":"族長","en":"A toast! To our heroes and to honor!","zh":"敬酒！敬我們的英雄，敬榮耀！"},{"who":"Geralt","who_zh":"傑洛特","en":"To honor.","zh":"敬榮耀。"},{"who":"Warrior","who_zh":"戰士","en":"Another cup, witcher? This is a feast!","zh":"再一杯嗎，獵魔人？這可是盛宴！"},{"who":"Geralt","who_zh":"傑洛特","en":"No more for me. I don't want to get drunk.","zh":"我不喝了，我不想喝醉。"},{"who":"Warrior","who_zh":"戰士","en":"Ha! A witcher who fears mead!","zh":"哈！怕蜂蜜酒的獵魔人！"},{"who":"Geralt","who_zh":"傑洛特","en":"I fear the morning after.","zh":"我怕的是隔天早上。"}],"spoiler":false,"added":"2026-10-05"},{"key":"drinking-contest","title":"The Drinking Contest","zh":"史凱利傑拚酒","where":"史凱利傑的酒館","intro":"史凱利傑人喜歡用拚酒分輸贏，酒館裡常有人下注挑戰。練習下注、接受挑戰，以及「我還行／我不行了」的說法。","words":["drink","mead","bet","drunk","coin","stock up"],"lines":[{"who":"Skelliger","who_zh":"史凱利傑人","en":"Witcher! Can you drink like a man of Skellige?","zh":"獵魔人！你能像史凱利傑男人一樣喝嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"Depends. What's the bet?","zh":"看情況。賭什麼？"},{"who":"Skelliger","who_zh":"史凱利傑人","en":"Fifty coins. Last man standing wins.","zh":"五十枚金幣。最後還站著的人贏。"},{"who":"Innkeeper","who_zh":"酒館老闆","en":"I stocked up on mead today. Go ahead!","zh":"我今天把蜂蜜酒囤滿了，喝吧！"},{"who":"Geralt","who_zh":"傑洛特","en":"Fine. One cup at a time.","zh":"好，一杯一杯來。"},{"who":"Skelliger","who_zh":"史凱利傑人","en":"Another! Are you drunk yet?","zh":"再一杯！你醉了沒？"},{"who":"Geralt","who_zh":"傑洛特","en":"Not yet. You look green.","zh":"還沒。你臉都綠了。"},{"who":"Skelliger","who_zh":"史凱利傑人","en":"I'm fine... the room is just moving.","zh":"我很好……只是房間在動。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'll take my coins now.","zh":"那我現在收錢了。"}],"spoiler":false,"added":"2026-10-05"},{"key":"jarl-hall","title":"In the Jarl's Hall","zh":"長廳覲見雅爾","where":"史凱利傑・凱爾特羅德（Kaer Trolde）長廳","intro":"到了史凱利傑，要先去 Kaer Trolde 的長廳見雅爾（jarl）。這裡練習正式的打招呼、自我介紹、說明來意，以及「我欠你一次」這類講義氣的說法。","words":["jarl","Kaer Trolde","throne","warrior","honor","mead","trust"],"lines":[{"who":"Guard","who_zh":"守衛","en":"Stop! Who comes to Kaer Trolde?","zh":"站住！誰來凱爾特羅德？"},{"who":"Geralt","who_zh":"傑洛特","en":"Geralt of Rivia. I'm here to see the jarl.","zh":"利維亞的傑洛特。我來見雅爾。"},{"who":"Guard","who_zh":"守衛","en":"Leave your sword at the door, witcher.","zh":"把劍留在門口，獵魔人。"},{"who":"Jarl","who_zh":"雅爾","en":"Welcome! Sit down and have some mead.","zh":"歡迎！坐下來喝點蜂蜜酒。"},{"who":"Geralt","who_zh":"傑洛特","en":"Thank you. I need your help, jarl.","zh":"謝謝。我需要你的幫忙，雅爾。"},{"who":"Jarl","who_zh":"雅爾","en":"A warrior asks, and I listen. Speak.","zh":"戰士開口，我就聽。說吧。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm looking for a girl with ashen hair.","zh":"我在找一個灰髮的女孩。"},{"who":"Jarl","who_zh":"雅爾","en":"I trust you. On my honor, I will help.","zh":"我信任你。以我的榮譽發誓，我會幫你。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then I owe you one.","zh":"那我欠你一次。"}],"spoiler":false,"added":"2026-10-05"},{"key":"smuggler-cave","title":"The Smugglers' Cave","zh":"走私者洞穴","where":"史凱利傑海岸邊的洞穴","intro":"史凱利傑海岸有不少洞穴，常有走私者或海盜藏貨。這裡練習在暗處小聲說話、談條件、付錢買情報，以及「保持專心」這類提醒。","words":["smuggler","cave","torch","quiet","gold","pay","focus","hide"],"lines":[{"who":"Geralt","who_zh":"傑洛特","en":"This cave is dark. I need a torch.","zh":"這個洞穴很暗。我需要火把。"},{"who":"Smuggler","who_zh":"走私者","en":"Quiet! Who's there?","zh":"安靜！誰在那裡？"},{"who":"Geralt","who_zh":"傑洛特","en":"Relax. I'm not here for your gold.","zh":"放輕鬆。我不是來搶你的金子的。"},{"who":"Smuggler","who_zh":"走私者","en":"Then why are you in my cave?","zh":"那你為什麼在我的洞裡？"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm looking for a boat. I can pay.","zh":"我在找一艘船。我付得起錢。"},{"who":"Smuggler","who_zh":"走私者","en":"Fifty crowns. And you never saw me.","zh":"五十克朗。而且你從沒見過我。"},{"who":"Geralt","who_zh":"傑洛特","en":"Deal. Why do you hide here?","zh":"成交。你為什麼躲在這裡？"},{"who":"Smuggler","who_zh":"走私者","en":"Drowners come at night. Stay focused.","zh":"晚上溺屍鬼會出來。保持專心。"},{"who":"Geralt","who_zh":"傑洛特","en":"I always focus. It's my job.","zh":"我一直都很專心。這是我的工作。"}],"spoiler":false,"added":"2026-10-05"},{"key":"winter-mulled-wine","title":"Mulled Wine at Kaer Morhen","zh":"凱爾莫罕冬夜喝熱紅酒","where":"凱爾莫罕・大廳火爐邊","intro":"凱爾莫罕是狼學派獵魔人的老家，冬天大家會回來過冬。練習天氣、喝東西、「看起來很累」和 like the old days 這類懷舊句。","words":["wine","winter","cold","old","quiet","tired","snow","drink","Vesemir","Eskel","Lambert"],"lines":[{"who":"Vesemir","who_zh":"維瑟米爾","en":"Cold night, Geralt. Have some wine.","zh":"好冷的夜，傑洛特。喝點酒吧。"},{"who":"Geralt","who_zh":"傑洛特","en":"Hot wine? With spices?","zh":"熱紅酒？有加香料嗎？"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"Cinnamon and honey. Like the old days.","zh":"肉桂和蜂蜜。就跟以前一樣。"},{"who":"Geralt","who_zh":"傑洛特","en":"It's so quiet here in winter.","zh":"冬天這裡好安靜。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"Too quiet. Only a few old wolves left.","zh":"太安靜了。只剩幾頭老狼。"},{"who":"Geralt","who_zh":"傑洛特","en":"Eskel and Lambert are coming too.","zh":"埃斯卡爾和蘭伯特也會來。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"Good. Drink, then rest. You look tired.","zh":"很好。喝完就去休息，你看起來很累。"},{"who":"Geralt","who_zh":"傑洛特","en":"Tomorrow we train in the snow.","zh":"明天我們在雪地裡練劍。"}],"spoiler":false,"added":"2026-10-05"},{"key":"prepare-defense","title":"Preparing the Defense","zh":"準備守城","where":"凱爾莫罕・城堡庭院","intro":"主線後段，狼學派的獵魔人要在凱爾莫罕迎戰狂獵。練習 need、will、be ready 和簡短的命令句。","words":["trap","Eskel","Lambert","Vesemir","Wild Hunt","Yrden"],"spoiler":true,"lines":[{"who":"Lambert","who_zh":"蘭伯特","en":"The Wild Hunt comes tonight.","zh":"狂獵今晚就會來。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then we need more traps.","zh":"那我們需要更多陷阱。"},{"who":"Eskel","who_zh":"埃斯卡爾","en":"I put two traps by the gate.","zh":"我在大門邊放了兩個陷阱。"},{"who":"Lambert","who_zh":"蘭伯特","en":"We have bombs and blade oil too.","zh":"我們也有炸彈和劍油。"},{"who":"Geralt","who_zh":"傑洛特","en":"Good. I'll cast Yrden in the yard.","zh":"很好。我會在庭院施放亞登法印。"},{"who":"Vesemir","who_zh":"維瑟米爾","en":"These walls are old, but strong.","zh":"這些城牆很老，但很堅固。"},{"who":"Eskel","who_zh":"埃斯卡爾","en":"Are we ready?","zh":"我們準備好了嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"No. But we fight anyway.","zh":"還沒。但我們照樣要打。"}],"added":"2026-10-05"},{"key":"stone-heart-contract","title":"The Toad Contract","zh":"接下蟾蜍委託","where":"奧森弗特・告示板前","intro":"《石之心》一開場，傑洛特在告示板上看到一張委託：奧森弗特的下水道裡有一隻怪蟾蜍。練習問問題的 What / Where / How much，以及 be careful。","words":["contract","notice board","sewer","Oxenfurt","poison","reward","crowns"],"lines":[{"who":"Townsman","who_zh":"鎮民","en":"Are you reading the contract, witcher?","zh":"獵魔人，你在看那張委託嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"Yes. What is in the sewer?","zh":"對。下水道裡有什麼？"},{"who":"Townsman","who_zh":"鎮民","en":"A giant toad. It is very ugly.","zh":"一隻巨大的蟾蜍。超級醜。"},{"who":"Geralt","who_zh":"傑洛特","en":"Where is the sewer entrance?","zh":"下水道入口在哪裡？"},{"who":"Townsman","who_zh":"鎮民","en":"Near the river, under Oxenfurt.","zh":"在河邊，奧森弗特的地底下。"},{"who":"Geralt","who_zh":"傑洛特","en":"How much is the reward?","zh":"賞金多少？"},{"who":"Townsman","who_zh":"鎮民","en":"Many crowns. The note on the notice board says so.","zh":"很多克朗，告示板上的紙條是這樣寫的。"},{"who":"Townsman","who_zh":"鎮民","en":"Be careful. It spits poison.","zh":"小心點，牠會吐毒液。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then I will bring a good potion.","zh":"那我會帶一瓶好藥水。"}],"spoiler":false,"added":"2026-10-06"},{"key":"wedding-party","title":"The Wedding Party","zh":"參加婚禮派對","where":"奧森弗特附近的婚禮宴會","intro":"《石之心》裡傑洛特去參加一場婚禮派對，整晚表現得很不像自己。練習 Let's…、You look…、邀請與回應的句型。","words":["wedding","Shani","wine","strange"],"spoiler":true,"lines":[{"who":"Guest","who_zh":"賓客","en":"Welcome to the wedding! Who are you?","zh":"歡迎來參加婚禮！你是誰？"},{"who":"Geralt","who_zh":"傑洛特","en":"A friend. I came with Shani.","zh":"朋友。我是跟 Shani 一起來的。"},{"who":"Shani","who_zh":"夏妮","en":"Geralt, you look strange tonight.","zh":"傑洛特，你今晚怪怪的。"},{"who":"Geralt","who_zh":"傑洛特","en":"I feel great! Let's dance!","zh":"我感覺棒透了！我們去跳舞！"},{"who":"Shani","who_zh":"夏妮","en":"You never dance.","zh":"你從來不跳舞的。"},{"who":"Geralt","who_zh":"傑洛特","en":"Tonight is different. More wine, please!","zh":"今晚不一樣。請再來點酒！"},{"who":"Guest","who_zh":"賓客","en":"Easy, friend. The night is long.","zh":"慢點，朋友。夜還長呢。"},{"who":"Shani","who_zh":"夏妮","en":"Who are you, and where is Geralt?","zh":"你是誰？傑洛特跑哪去了？"}],"added":"2026-10-06"},{"key":"auction-house-heist","title":"Planning the Heist","zh":"策劃搶拍賣行","where":"奧森弗特的一間密室","intro":"《石之心》裡傑洛特得跟一群人合作，潛進拍賣行的金庫。練習 How many…?、Where is…?、We need… 的句型。","words":["guard","plan","beneath","underground","lock","magic","mage","inside"],"spoiler":true,"lines":[{"who":"Ewald","who_zh":"艾瓦德","en":"We go in tonight, during the auction.","zh":"我們今晚趁拍賣會進去。"},{"who":"Geralt","who_zh":"傑洛特","en":"How many guards are inside?","zh":"裡面有多少守衛？"},{"who":"Ewald","who_zh":"艾瓦德","en":"Too many. So we need a good plan.","zh":"太多了。所以我們需要好計畫。"},{"who":"Geralt","who_zh":"傑洛特","en":"And the vault? Where is it?","zh":"那金庫呢？在哪裡？"},{"who":"Ewald","who_zh":"艾瓦德","en":"Underground, beneath the main hall.","zh":"在地底下，大廳的正下方。"},{"who":"Ewald","who_zh":"艾瓦德","en":"The door has a magic lock.","zh":"門上有魔法鎖。"},{"who":"Geralt","who_zh":"傑洛特","en":"Then we need a mage, too.","zh":"那我們還需要一位法師。"},{"who":"Ewald","who_zh":"艾瓦德","en":"I know one. Are you in, witcher?","zh":"我認識一個。你要加入嗎，獵魔人？"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm in. But nobody gets hurt.","zh":"我加入。但不准有人受傷。"}],"added":"2026-10-06"},{"key":"mirror-man","title":"A Deal with Master Mirror","zh":"跟神秘人講條件","where":"路邊的十字路口","intro":"《石之心》裡傑洛特遇到一位愛笑、什麼都知道的神秘商人。練習 What do you want?、I owe you…、Be careful 這類談條件的句型。","words":["stranger","help","price","pay","debt","promise","trust","soul","merchant"],"spoiler":true,"lines":[{"who":"Master Mirror","who_zh":"鏡子大師","en":"Ah, witcher! I helped you once, remember?","zh":"啊，獵魔人！我幫過你一次，記得嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"You're no simple merchant, stranger.","zh":"你可不是普通的商人，陌生人。"},{"who":"Master Mirror","who_zh":"鏡子大師","en":"Every help has a price.","zh":"每一份幫助都有代價。"},{"who":"Geralt","who_zh":"傑洛特","en":"So what do you want from me?","zh":"所以你想從我這裡得到什麼？"},{"who":"Master Mirror","who_zh":"鏡子大師","en":"Only that you pay your debt.","zh":"只要你還清你的債。"},{"who":"Geralt","who_zh":"傑洛特","en":"I don't trust you.","zh":"我不信任你。"},{"who":"Master Mirror","who_zh":"鏡子大師","en":"Smart man. But a promise is a promise.","zh":"聰明人。但承諾就是承諾。"},{"who":"Geralt","who_zh":"傑洛特","en":"And whose soul are we talking about?","zh":"那我們說的是誰的靈魂？"},{"who":"Master Mirror","who_zh":"鏡子大師","en":"Not yours, witcher. Not yet.","zh":"不是你的，獵魔人。暫時還不是。"}],"added":"2026-10-06"},{"key":"toussaint-arrival","title":"Arriving in Toussaint","zh":"抵達陶森特","where":"陶森特邊境的路口","intro":"《血與酒》一開場，傑洛特受女公爵之邀南下陽光燦爛的陶森特。練習打招呼、問路（Is it far?）和說明來意（I'm here for…）。","words":["Toussaint","traveler","witcher","duchess","Beauclair","road","follow","south","palace","wine","vineyard","knight"],"lines":[{"who":"Knight","who_zh":"騎士","en":"Welcome to Toussaint, traveler!","zh":"歡迎來到陶森特，旅人！"},{"who":"Geralt","who_zh":"傑洛特","en":"Thanks. Is Beauclair far from here?","zh":"謝謝。博克雷離這裡遠嗎？"},{"who":"Knight","who_zh":"騎士","en":"Not far. Follow this road south.","zh":"不遠。沿著這條路往南走。"},{"who":"Knight","who_zh":"騎士","en":"You will see the palace on the hill.","zh":"你會看到山丘上的宮殿。"},{"who":"Knight","who_zh":"騎士","en":"Are you here for our wine?","zh":"你是來喝我們的葡萄酒的嗎？"},{"who":"Geralt","who_zh":"傑洛特","en":"No. I'm a witcher. The duchess sent for me.","zh":"不是。我是獵魔人，女公爵找我來的。"},{"who":"Knight","who_zh":"騎士","en":"A witcher! Then go quickly, my friend.","zh":"獵魔人！那快去吧，朋友。"},{"who":"Knight","who_zh":"騎士","en":"But visit a vineyard later. You won't regret it.","zh":"不過之後去葡萄園看看，你不會後悔的。"},{"who":"Geralt","who_zh":"傑洛特","en":"Maybe I will. Thank you, sir.","zh":"也許會吧。謝了，先生。"}],"spoiler":false,"added":"2026-10-06"},{"key":"knight-errant","title":"Meeting a Knight-Errant","zh":"遇見遊俠騎士","where":"陶森特的鄉間小路","intro":"在《血與酒》的陶森特，路上常遇到立誓行俠的遊俠騎士。練習自我介紹（I am…）、說明誓言（I made a vow to…）和客氣地婉拒。","words":["knight-errant","knight","vow","lady","chivalry","honor","quest","sword","witcher"],"lines":[{"who":"Knight","who_zh":"騎士","en":"Halt! I am a knight-errant of Toussaint.","zh":"站住！我是陶森特的遊俠騎士。"},{"who":"Geralt","who_zh":"傑洛特","en":"I'm Geralt. Just a witcher on the road.","zh":"我是傑洛特，只是路過的獵魔人。"},{"who":"Knight","who_zh":"騎士","en":"I made a vow to help a lady.","zh":"我立誓要幫助一位女士。"},{"who":"Knight","who_zh":"騎士","en":"I cannot go home before my quest is done.","zh":"任務完成前我不能回家。"},{"who":"Geralt","who_zh":"傑洛特","en":"That sounds like a long trip.","zh":"聽起來是段很長的旅程。"},{"who":"Knight","who_zh":"騎士","en":"Chivalry is never easy, friend.","zh":"騎士精神從來不容易，朋友。"},{"who":"Knight","who_zh":"騎士","en":"Will you cross swords with me, for honor?","zh":"願意為了榮譽跟我比劃一下嗎？"},{"who":"Gera /* ---------- SRS（間隔重複）：紀錄存在這台裝置的 localStorage ---------- */
const DAY=864e5, IDX={}; W.forEach((w,i)=>IDX[w.word]=i);
const dk=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const today=()=>dk(Date.now());

function saveSRS(){store.set("srs1",SRS);store.set("log1",LOG);store.set("fav1",FAV);store.set("cfg1",CFG)}
const CEFR={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};

function plan(c,g){c=c||{iv:0,ease:2.5,reps:0};let iv=c.iv,ease=c.ease,reps=c.reps;
  if(g===0)return{iv:0,ease:Math.max(1.3,ease-0.2),reps:0,min:10};
  if(g===1){iv=reps?Math.max(1,iv*1.2):1;ease=Math.max(1.3,ease-0.15)}
  else if(g===2)iv=reps===0?1:reps===1?3:Math.max(iv+1,iv*ease);
  else{iv=reps===0?4:Math.max(iv+2,iv*ease*1.3);ease=Math.min(3.2,ease+0.15)}
  return{iv:Math.min(365,Math.round(iv)),ease:+ease.toFixed(2),reps:reps+1}}
const ivTxt=p=>p.min?"10 分鐘":p.iv<30?p.iv+" 天":(p.iv/30).toFixed(p.iv<60?1:0)+" 個月";
function fmtDue(t){if(t<=Date.now())return "現在";const d=new Date(t);if(dk(t)===today())return "今天 "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");return (d.getMonth()+1)+"/"+d.getDate()}
function applyGrade(word,g){const c=SRS[word],p=plan(c,g),t=Date.now();
  const n=Object.assign({wrong:0,first:today()},c||{},{iv:p.iv,ease:p.ease,reps:p.reps,g,last:today(),due:p.min?t+p.min*6e4:midnight()+p.iv*DAY+4*36e5});
  if(g===0)n.wrong=(n.wrong||0)+1;
  SRS[word]=n;const L=LOG[today()]||(LOG[today()]={r:0,n:0,bad:0});L.r++;if(!c)L.n++;if(g===0)L.bad++;saveSRS();return n}
const level=w=>{const c=SRS[w];return !c?0:c.iv>=21?3:c.iv>=7?2:1};
const dueList=()=>{const t=Date.now();return Object.keys(SRS).filter(w=>IDX[w]!=null&&SRS[w].due<=t).sort((a,b)=>SRS[a].due-SRS[b].due)};
function newList(extra){const L=LOG[today()]||{n:0};const left=extra||Math.max(0,CFG.newPerDay-L.n);const out=[];
  for(const w of DATA.review.concat(ORDER)){if(out.length>=left)break;if(!SRS[w]&&IDX[w]!=null&&!out.includes(w))out.push(w)}return out}
const inMistakes=w=>{const c=SRS[w];return !!c&&c.wrong>0&&(c.g<=1||c.iv<7)};
function streak(){let n=0;const d=new Date();if(!(LOG[dk(d)]||{}).r)d.setDate(d.getDate()-1);while((LOG[dk(d)]||{}).r){n++;d.setDate(d.getDate()-1)}return n}
function weekNew(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));let n=0;const end=Date.now();for(;d.getTime()<=end;d.setDate(d.getDate()+1))n+=(LOG[dk(d)]||{}).n||0;return n}
function nextDue(){const t=Object.values(SRS).map(c=>c.due).filter(x=>x>Date.now()).sort((a,b)=>a-b)[0];return t?fmtDue(t):"還沒有排程的字"}

function sceneLinesFor(word){let re;try{re=new RegExp("(^|[^A-Za-z'])"+reEsc(word)+"(e?s)?(?![A-Za-z])","i")}catch(e){return[]}

const synth=window.speechSynthesis; let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang));$("warn").style.display=(synth.getVoices().length&&!voices.length)?"block":"none"}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}else{$("warn").style.display="block"}
function pickVoice(){const want=S.acc.toLowerCase();const m=voices.filter(v=>v.lang.replace("_","-").toLowerCase()===want);
  return m.find(v=>/samantha|google us|daniel|google uk|aria|jenny|libby|sonia|natural/i.test(v.name))||m[0]||voices[0]||null}
const SAY=DATA.tts_respell||{};
const SAY_RE=Object.keys(SAY).length?new RegExp("\\b("+Object.keys(SAY).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")\\b","g"):null;
const fix=t=>SAY_RE?t.replace(SAY_RE,m=>SAY[m]):t;
let run=0;
function speak(t,rate,pitch){t=fix(t);return new Promise(r=>{if(!synth){r();return}const u=new SpeechSynthesisUtterance(t);const v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang}else u.lang=S.acc;u.rate=rate||S.rate;u.pitch=pitch||1;u.onend=r;u.onerror=r;synth.speak(u)})}

    catch(err){$("bst").textContent="檔案格式不對，請選擇從這裡匯出的 .json 檔。"}};
}
function viewLessons(s){
  $("main").innerHTML=head(s,"原本的課程：每課一篇短文＋三個句型。點一課打開。")+LES.map((l,i)=>`<button class="panel lsn" data-l="${i}"><h3>${esc(l.title)}</h3><div class="sub" style="margin:0">${l.words.slice(0,8).map(esc).join("・")}…</div></button>`).join("");
  $("main").querySelectorAll(".lsn").forEach(b=>b.onclick=()=>viewLesson(s,+b.dataset.l));
}
function viewLesson(s,li){
  const l=LES[li];const idx=l.words.map(w=>W.findIndex(x=>x.word===w)).filter(i=>i>=0);
  $("main").innerHTML=`<p class="crumb">Guides › 課程故事</p><h2 class="title">${esc(l.title)}</h2><p class="sub"><a href="#/guides/lessons" style="color:var(--steel)">← 所有課程</a></p>`+
    `<div class="panel"><h3>短文朗讀</h3><p class="sub" style="margin:0 0 6px">點一句只念那一句；「整篇朗讀」會一句一句念並停頓讓你跟讀。</p><button class="btn" id="all">整篇朗讀</button><div id="story" style="margin-top:8px">${l.story.map((x,i)=>`<button class="sent" data-i="${i}">${esc(x.en)}<small>${esc(x.zh)}</small></button>`).join("")}</div></div>`+
    `<div class="panel"><h3>句型</h3>${l.patterns.map((p,i)=>`<div class="pat"><b>${esc(p.pattern)}</b><div class="d">${esc(p.usage)}</div><button data-i="${i}">🔊 ${esc(p.example_en)}</button><div class="d">${esc(p.example_zh)}</div></div>`).join("")}</div>`+
    `<h3 style="font-family:var(--title)">本課單字</h3>`+cardsHTML(idx);
  bindCards($("main"),idx);
  $("story").onclick=async e=>{const b=e.target.closest(".sent");if(!b)return;stop();b.classList.add("on");await speak(l.story[+b.dataset.i].en);b.classList.remove("on")};
  $("all").onclick=async()=>{stop();const my=++run;const els=[...document.querySelectorAll(".sent")];
    for(let i=0;i<els.length&&my===run;i++){els[i].classList.add("on");els[i].scrollIntoView({block:"nearest",behavior:"smooth"});await speak(l.story[i].en);if(my!==run)break;await wait(800+l.story[i].en.split(" ").length*420);els[i].classList.remove("on")}};
  $("main").querySelectorAll(".pat button").forEach(b=>b.onclick=()=>{stop();speak(l.patterns[+b.dataset.i].example_en)});
  window.scrollTo(0,0);
}
function viewGrammar(s){
  $("main").innerHTML=head(s,"所有課程的句型，依課次排列。點例句聽發音。")+LES.map(l=>`<div class="panel"><h3>${esc(l.title)}</h3>${l.patterns.map(p=>`<div class="pat"><b>${esc(p.pattern)}</b><div class="d">${esc(p.usage)}</div><button data-s="${esc(p.example_en)}">🔊 ${esc(p.example_en)}</button><div class="d">${esc(p.example_zh)}</div></div>`).join("")}</div>`).join("");
  $("main").querySelectorAll(".pat button").forEach(b=>b.onclick=()=>{stop();speak(b.dataset.s)});
}
function viewSearch(q){
  const t=q.trim().toLowerCase();
  const idx=t?W.map((w,i)=>i).filter(i=>{const w=W[i];return w.word.toLowerCase().includes(t)||w.zh.includes(q.trim())}):[];
  $("main").innerHTML=`<p class="crumb">搜尋</p><h2 class="title">「${esc(q)}」</h2><p class="sub">${idx.length} 個結果</p>`+(idx.length?cardsHTML(idx):'<p class="empty">找不到。可能還沒收錄，排程會持續擴充。</p>');
  bindCards($("main"),idx);
}
function render(){
  const s=SUBS[cur.sub];const v=s.view;const f=S.flash;S.flash="";
  if(v==="review")viewReview(s);else if(v==="mistakes")viewMistakes(s);else if(v==="scenes")viewScenes(s);else if(v==="new")viewNew(s);else if(v==="traps")viewTraps(s);else if(v==="stats")viewStats(s);
  else if(v==="lessons")viewLessons(s);else if(v==="grammar")viewGrammar(s);else viewList(s);
  if(f)$("main").insertAdjacentHTML("afterbegin",`<div class="panel flash">${esc(f)}</div>`);
}
let qt;$("q").oninput=e=>{clearTimeout(qt);const v=e.target.value;qt=setTimeout(()=>{if(v.trim())go("#/s/"+encodeURIComponent(v.trim()));else go("#/home/review")},250)};

/* ---------- stage ---------- */
function openStage(i,quiz){S.quiz=!!quiz;S.rev=false;
  S.idx=Math.max(0,S.list.indexOf(i));if(S.list.indexOf(i)<0){S.list=[i];S.idx=0}
  fillStage();$("veil").classList.add("open");$("stage").classList.add("open");
}
function closeStage(silent){if(!$("stage").classList.contains("open"))return;stop();$("veil").classList.remove("open");$("stage").classList.remove("open");if(!silent)render()}
function cw(){return W[S.list[S.idx]]}
function fillStage(){
  const w=cw(),s=SUBS[w.sub];
  $("pos").textContent=`${S.idx+1} / ${S.list.length}`;
  $("where").textContent=`${s.catEn} › ${s.zh}${w.lesson?`・第 ${w.lesson} 課`:""}`;
  $("word").innerHTML=w.syllables.map((x,i)=>`<span class="syl${i===w.stress_index?" stress":""}">${esc(x)}</span>`).join("");
  $("word").setAttribute("aria-label",w.word);
  $("kk").textContent=w.kk;$("ipa").textContent=w.ipa;$("pt").textContent=w.pos;$("zh").textContent=w.zh;
  $("tags").innerHTML=[w.type,w.cefr!=="—"?w.cefr:""].concat((w.traps||[]).map(k=>TRAPS[k])).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  $("tip").textContent="發音："+w.tip+(/[。！？]$/.test(w.tip)?"":"。");
  $("en").textContent=w.example_en;$("ez").textContent=w.example_zh;$("note").textContent=w.note||"";
  const ex=$("exwrap");ex.className=w.spoiler&&!S.shown[w.word]?"spoiler hid":"";
  ex.onclick=()=>{if(ex.classList.contains("hid")){S.shown[w.word]=1;ex.className=""}};
  const sl=sceneLinesFor(w.word);
  $("scx").innerHTML=sl.length?`<div class="scxh">場景例句</div>`+sl.map(([sc,l],i)=>`<button class="sent" data-i="${i}">${esc(l.en)}<small>${esc(l.who_zh)}・${esc(sc.zh)}：${esc(l.zh)}</small></button>`).join("")+`<a class="scl" href="#/scene/${sl[0][0].key}">打開場景「${esc(sl[0][0].zh)}」→</a>`:"";
  $("scx").onclick=e=>{const b=e.target.closest(".sent");if(!b)return;stop();speak(sl[+b.dataset.i][1].en)};
  const c=SRS[w.word];$("stage").classList.toggle("quiz",!!S.quiz&&!S.rev);
  document.querySelectorAll("#grade .gb").forEach(b=>{b.querySelector("small").textContent=ivTxt(plan(c,+b.dataset.g))});
  $("srsinfo").textContent=c?`上次：${["忘了","模糊","記得","很熟"][c.g]||"—"}・下次：${fmtDue(c.due)}${c.wrong?`・錯過 ${c.wrong} 次`:""}`:"新字：評分後就會排進複習";
  const fv=!!FAV[w.word];$("fav").setAttribute("aria-pressed",fv);$("fav").textContent=fv?"★ 已收藏":"☆ 收藏";
  const link=w.type==="實用"&&!(DATA.no_dictionary_link||[]).includes(w.word);
  $("cam").innerHTML=link?`<a href="https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${encodeURIComponent(w.word.toLowerCase().replace(/ /g,"-"))}" target="_blank" rel="noopener">劍橋字典（真人發音）↗</a>`:"遊戲專有名詞：機器發音僅供參考，以遊戲配音為準";
  history.replaceState(null,"","#/w/"+encodeURIComponent(w.word));
}
function beat(rate){const syl=[...document.querySelectorAll("#word .syl")];const per=Math.max(220,340/(rate||S.rate));
  syl.forEach((el,i)=>setTimeout(()=>{el.classList.add("beat");setTimeout(()=>el.classList.remove("beat"),per)},i*per))}
async function sayW(rate){beat(rate);await speak(cw().word,rate)}
function step(d){S.idx=(S.idx+d+S.list.length)%S.list.length;S.rev=false;fillStage()}
$("pw").onclick=()=>{stop();sayW()};$("ps").onclick=()=>{stop();sayW(0.5)};
$("pe").onclick=()=>{const w=cw();if(w.spoiler&&!S.shown[w.word])return;stop();speak(w.example_en)};
$("prev").onclick=()=>{stop();step(-1)};$("next").onclick=()=>{stop();step(1)};
$("reveal").onclick=()=>{if(!S.quiz||S.rev)return;S.rev=true;fillStage();stop();sayW()};
$("grade").onclick=e=>{const b=e.target.closest(".gb");if(!b)return;const g=+b.dataset.g,i=S.list[S.idx],w=W[i].word;stop();
  const n=applyGrade(w,g);
  if(S.quiz){
    if(g===0&&S.list.indexOf(i,S.idx+1)<0)S.list.push(i);
    if(S.idx>=S.list.length-1){const L=LOG[today()]||{r:0};S.flash=`這一輪完成了！今天共練 ${L.r} 次。下次到期：${nextDue()}。`;
      closeStage();history.replaceState(null,"","#/"+cur.cat+"/"+cur.sub);return}
    S.idx++;S.rev=false;fillStage();$("st").textContent=g===0?"10 分鐘後再練一次":`下次：${fmtDue(n.due)}`;
  }else{fillStage();$("st").textContent=g===0?"已收進錯誤本，10 分鐘後再練":`已記錄，下次：${fmtDue(n.due)}`}};
$("fav").onclick=()=>{const w=cw().word;if(FAV[w])delete FAV[w];else FAV[w]=1;saveSRS();fillStage()};
$("close").onclick=()=>{closeStage();history.replaceState(null,"","#/"+cur.cat+"/"+cur.sub)};
$("veil").onclick=$("close").onclick;
document.addEventListener("keydown",e=>{if(!$("stage").classList.contains("open"))return;
  const qz=$("stage").classList.contains("quiz");if(e.key===" "&&qz){e.preventDefault();$("reveal").onclick();return}
  if(/^[1-4]$/.test(e.key)&&!qz){const b=document.querySelector('#grade .gb[data-g="'+(e.key-1)+'"]');if(b)b.click();return}if(e.key==="Escape")$("close").onclick();if(e.key==="ArrowRight")$("next").onclick();if(e.key==="ArrowLeft")$("prev").onclick()});
function setAuto(on){$("auto").setAttribute("aria-pressed",on);$("auto").textContent=on?"停止跟讀":"自動跟讀"}
async function startAuto(){stop();const my=++run;setAuto(true);
  while(my===run){const w=cw();
    $("st").textContent="聽";await sayW();if(my!==run)break;
    $("st").textContent="換你念";await wait(1800);if(my!==run)break;
    $("st").textContent="慢速再聽一次";await sayW(0.5);if(my!==run)break;
    $("st").textContent="換你念";await wait(2000);if(my!==run)break;
    if(!(w.spoiler&&!S.shown[w.word])){$("st").textContent="例句";await speak(w.example_en);if(my!==run)break;
      $("st").textContent="換你念例句";await wait(1200+w.example_en.split(" ").length*450);if(my!==run)break}
    if(S.idx===S.list.length-1){$("st").textContent="這一組跑完一輪了";setAuto(false);break}
    step(1)}}
$("auto").onclick=()=>{if($("auto").getAttribute("aria-pressed")==="true")stop();else startAuto()};
document.querySelectorAll("[data-acc]").forEach(b=>{b.setAttribute("aria-pressed",b.dataset.acc===S.acc);
  b.onclick=()=>{S.acc=b.dataset.acc;store.set("acc",S.acc);document.querySelectorAll("[data-acc]").forEach(x=>x.setAttribute("aria-pressed",x===b));speak(cw().word)}});
$("rate").value=S.rate;$("rv").textContent=S.rate.toFixed(1)+"×";
$("rate").oninput=e=>{S.rate=+e.target.value;$("rv").textContent=S.rate.toFixed(1)+"×";store.set("rate",S.rate)};

$("meta").textContent=`${W.length} 字・更新 ${META.updated||""}`;
$("foot").innerHTML=`巫師3英文圖鑑・KK＋IPA 雙音標・每 4 小時自動更新<br>劇透內容預設模糊，點一下才顯示`;
if(!location.hash)history.replaceState(null,"","#/home/review");
route();
</script>
</body>
</html>
